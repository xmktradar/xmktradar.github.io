<title>Page not found | The Crowd Tape</title>
<script>
(function(){
  if(/^\/ko(\/|$)/.test(location.pathname)){location.replace("/en"+location.pathname.slice(3)+location.search+location.hash);return}
  var m=location.pathname.match(/^\/stock\/([A-Za-z0-9.\-]+)\/?$/);
  if(!m)return;
  var l;try{l=localStorage.getItem("ct-lang")}catch(e){}
  if(l!=="zh"&&l!=="en")l=0;
  if(!l){var n=(navigator.languages||[navigator.language||""]).join(",").toLowerCase();
    l=/^zh|,zh/.test(n)?"zh":"en"}
  location.replace("/"+l+"/stock/"+m[1].toUpperCase()+"/"+location.search+location.hash);
})();
</script>
<style>
:root{
  --bg:#f3f4f7; --surface:#ffffff; --ink:#161a21; --muted:#5b6372; --line:#dde1e8;
  --accent:#2d48c9; --accent-soft:#e6eafb;
  --f-display:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;

/* Apple-style look (2026-10-27): same colours, font and cards as the homepage; dark mode follows the device */

body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",var(--f-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--link)}
h1,h2,h3,.brand{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",var(--f-body)!important;letter-spacing:-.02em}
h1{font-weight:700;font-size:clamp(30px,5vw,44px)!important;line-height:1.12!important}
.brand{font-weight:600!important;font-size:19px!important}
.card,.ct-news,.panel{background:var(--surface)!important;border:0!important;border-radius:20px!important}
.note{border:0!important;border-radius:16px!important;background:var(--accent-soft)!important}
.site-nav a,.lang a{border:0!important;background:var(--surface)!important;font-weight:600!important}
.site-nav a.nav-donate,.tool-btn,.ct-news button[type=submit],.btn{background:var(--accent)!important;color:#fff!important;border:0!important}
.lang a[aria-current]{color:var(--ink)!important;background:var(--accent-soft)!important}
.aff-tag{background:transparent!important}
.ct-news input[type=email]{background:var(--bg)!important;color:var(--ink)!important;border-color:var(--line)!important}

</style>
