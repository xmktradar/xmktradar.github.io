name: Draw character stickers
# Manual only. Draws missing assets/characters/<id>/E01-E15.png with Google's free Gemini image model
# (tools/stickers.py) and pushes them to branch stickers-drawn for a look before merging into main.
on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Most stickers to draw this run'
        default: '45'
permissions:
  contents: write
concurrency:
  group: draw-stickers
jobs:
  draw:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: pip install pillow
      - name: Draw missing stickers
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_IMAGE_MODEL: ${{ vars.GEMINI_IMAGE_MODEL }}
          STICKER_LIMIT: ${{ inputs.limit }}
        run: python tools/stickers.py
      - name: Push to branch stickers-drawn
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git checkout -B stickers-drawn
          git add assets/characters
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Draw character stickers"
          git push -f origin stickers-drawn
