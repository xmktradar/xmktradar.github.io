name: Intraday social
# Generation is 5 minutes before each US/Eastern slot (09:45, 11:00, 12:15, 13:30, 14:45, 15:40).
# Clocks: 09:40, 10:55, 12:10, 13:25, 14:40, 15:35 ET.
# Main path: hard UTC cron at each gen clock for BOTH EST (UTC−5) and EDT (UTC−4).
# Guard keeps America/New_York ±20 min on a NYSE day (off-season DST twin exits in seconds).
# Backup +10m if GitHub drops/delays the primary. Bot Intraday A–F workflow_dispatch stays as fringe.
# workflow_dispatch: slot=auto|force|<name> (force bypasses the time guard).
# Tim／CEO 2026-11-05: hard cron primary; reduce Bot A–F reliance.
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot name, auto, or force (bypass time guard; still writes)'
        required: false
        default: auto
  schedule:
    # Gen 09:40 ET → 13:40 UTC (EDT) / 14:40 UTC (EST); backup +10
    - cron: '40 13,14 * * 1-5'
    - cron: '50 13,14 * * 1-5'
    # Gen 10:55 ET → 14:55 / 15:55 UTC
    - cron: '55 14,15 * * 1-5'
    - cron: '5 15,16 * * 1-5'
    # Gen 12:10 ET → 16:10 / 17:10 UTC
    - cron: '10 16,17 * * 1-5'
    - cron: '20 16,17 * * 1-5'
    # Gen 13:25 ET → 17:25 / 18:25 UTC
    - cron: '25 17,18 * * 1-5'
    - cron: '35 17,18 * * 1-5'
    # Gen 14:40 ET → 18:40 / 19:40 UTC
    - cron: '40 18,19 * * 1-5'
    - cron: '50 18,19 * * 1-5'
    # Gen 15:35 ET → 19:35 / 20:35 UTC
    - cron: '35 19,20 * * 1-5'
    - cron: '45 19,20 * * 1-5'
permissions:
  contents: write
# Not site-update: update-site holds that group for 60-90 min, and GitHub keeps
# only one pending run per group, so a queued intraday run misses its slot.
concurrency:
  group: intraday
  cancel-in-progress: false
jobs:
  intraday:
    runs-on: ubuntu-24.04  # pin: playwright@1.56.1 lacks ubuntu26.04 deps (2026-11-05)
    timeout-minutes: 30
    env:
      WORK_DIR: /tmp/site-work
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Guard
        id: guard
        env:
          SLOT_INPUT: ${{ github.event.inputs.slot }}
        run: python3 tools/intraday.py --guard --slot "${SLOT_INPUT:-auto}"
      - name: Restore full page data
        if: steps.guard.outputs.run == 'true'
        run: python3 tools/slim_pages.py --restore
      - name: Install headless browser
        if: steps.guard.outputs.run == 'true'
        run: |
          # Light run: use the runner's preinstalled Google Chrome instead of downloading Chromium + deps (~13 min).
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Fetch new posts
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python3 tools/fetch_posts.py
      - name: Analyse posts with Grok
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python3 tools/analyse_posts.py
      - name: Add posts to the site
        if: steps.guard.outputs.run == 'true'
        run: python3 tools/merge_posts.py
      - name: Apply SuperGrok write-ups
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python3 tools/apply_writeups.py
      - name: Consensus and counts
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p "$WORK_DIR"
          echo '{"daily": null}' > "$WORK_DIR/windows.json"
          node tools/stats.js index.html "$WORK_DIR/windows.json" "$WORK_DIR/stats.json" || { echo "::error::共識計算失敗"; exit 1; }
      - name: Write intraday slot
        if: steps.guard.outputs.run == 'true'
        env:
          SLOT: ${{ steps.guard.outputs.slot }}
          FORCE: ${{ steps.guard.outputs.force }}
        run: |
          extra=""
          if [ "$FORCE" = "true" ]; then extra=--force; fi
          python3 tools/intraday.py --slot "$SLOT" $extra
      - name: Publish data
        if: steps.guard.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # update-site may push a rewritten social-posts.json while this job runs.
          # Drop local data edits, rebuild one slot commit on latest main, and retry the push.
          ok=0
          for i in 1 2 3 4 5 6; do
            git stash -u -q || true
            git fetch origin main
            git reset --hard origin/main
            python3 tools/intraday.py --merge-from "$WORK_DIR/intraday-slot.json"
            git add data/social-posts.json data/social-history.json
            if git diff --cached --quiet; then
              ok=1
              break
            fi
            git commit -m "盤中社交槽 $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
            git push origin HEAD:main && { ok=1; break; }
            echo "::warning::push failed (try $i), retrying"
            sleep $((i * 8))
          done
          [ "$ok" = 1 ] || { echo "::error::push failed after retries"; exit 1; }
