name: Intraday social
# Generation is 5 minutes before each US/Eastern slot (09:45, 11:00, 12:15, 13:30, 14:45, 15:40).
# Clocks: 09:40, 10:55, 12:10, 13:25, 14:40, 15:35 ET.
# One weekday tick every 10 minutes, 13:00–23:50 UTC: EDT open through EST close,
# plus evening catch-up when GitHub delivers the schedule hours late.
# Guard uses America/New_York. It will not start a slot more than 20 minutes early.
# Once a clock is due, it writes the earliest unwritten slot for that ET trade date
# (on time, in the gaps, or the rest of the evening). One job can fill the rest, cap 6.
# Bot Intraday A–F workflow_dispatch stays as fringe.
# workflow_dispatch: slot=auto|force|<name> (force bypasses the time guard).
on:
  workflow_dispatch:
    inputs:
      slot:
        description: 'Slot name, auto, or force (bypass time guard; still writes)'
        required: false
        default: auto
  schedule:
    # Tick every 10 minutes, 13:00–23:50 UTC Mon–Fri.
    # Covers EDT open gen (13:40 UTC) through EST close (20:35 UTC), plus hours of
    # catch-up when GitHub delivers the schedule late (observed delays of 2–5 hours).
    - cron: '*/10 13-23 * * 1-5'
permissions:
  contents: write
# Not site-update: update-site holds that group for 60-90 min, and GitHub keeps
# only one pending run per group, so a queued intraday run is dropped.
concurrency:
  group: intraday
  cancel-in-progress: false
jobs:
  intraday:
    runs-on: ubuntu-24.04  # pin: playwright@1.56.1 lacks ubuntu26.04 deps (2026-11-05)
    timeout-minutes: 30
    env:
      WORK_DIR: /tmp/site-work
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
      TZ: America/New_York
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Guard
        id: guard
        env:
          SLOT_INPUT: ${{ github.event.inputs.slot }}
        run: python3 tools/intraday.py --guard --slot "${SLOT_INPUT:-auto}"
      - name: Restore full page data
        if: steps.guard.outputs.run == 'true'
        run: python3 tools/slim_pages.py --restore
      - name: Install headless browser
        if: steps.guard.outputs.run == 'true'
        run: |
          # Light run: use the runner's preinstalled Google Chrome instead of downloading Chromium + deps (~13 min).
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          if [ -x /usr/bin/google-chrome ]; then echo "CHROME_PATH=/usr/bin/google-chrome" >> "$GITHUB_ENV"; else npx playwright install --with-deps chromium; fi
      - name: Fetch new posts
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python3 tools/fetch_posts.py
      - name: Analyse posts with Grok
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python3 tools/analyse_posts.py
      - name: Add posts to the site
        if: steps.guard.outputs.run == 'true'
        run: python3 tools/merge_posts.py
      - name: Apply SuperGrok write-ups
        if: steps.guard.outputs.run == 'true'
        continue-on-error: true
        run: python3 tools/apply_writeups.py
      - name: Consensus and counts
        if: steps.guard.outputs.run == 'true'
        run: |
          mkdir -p "$WORK_DIR"
          echo '{"daily": null}' > "$WORK_DIR/windows.json"
          node tools/stats.js index.html "$WORK_DIR/windows.json" "$WORK_DIR/stats.json" || { echo "::error::共識計算失敗"; exit 1; }
      - name: Write and publish intraday slots
        if: steps.guard.outputs.run == 'true'
        env:
          SLOT: ${{ steps.guard.outputs.slot }}
          FORCE: ${{ steps.guard.outputs.force }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # update-site may push a rewritten social-posts.json while this job runs.
          # Drop local data edits, rebuild one slot commit on latest main, and retry the push.
          publish_one() {
            slot="$1"
            extra=""
            if [ "$FORCE" = "true" ]; then extra=--force; fi
            python3 tools/intraday.py --slot "$slot" $extra
            ok=0
            for i in 1 2 3 4 5 6; do
              git stash -u -q || true
              git fetch origin main
              git reset --hard origin/main
              python3 tools/intraday.py --merge-from "$WORK_DIR/intraday-slot.json"
              git add data/social-posts.json data/social-history.json
              if git diff --cached --quiet; then
                ok=1
                break
              fi
              git commit -m "盤中社交槽 $(TZ=America/New_York date '+%Y-%m-%d %H:%M') ET"
              git push origin HEAD:main && { ok=1; break; }
              echo "::warning::push failed (try $i), retrying"
              sleep $((i * 8))
            done
            [ "$ok" = 1 ] || { echo "::error::push failed after retries"; exit 1; }
          }
          publish_one "$SLOT"
          # force bypasses the clock; do not walk the rest of the day.
          if [ "$FORCE" = "true" ]; then
            exit 0
          fi
          # Shared fetch already ran. A late tick can fill every still-due slot (cap 6).
          n=1
          while [ "$n" -lt 6 ]; do
            n=$((n + 1))
            gout=$(mktemp)
            GITHUB_OUTPUT="$gout" python3 tools/intraday.py --guard --slot auto
            runv=$(awk -F= '$1=="run"{print $2; exit}' "$gout")
            next=$(awk -F= '$1=="slot"{print $2; exit}' "$gout")
            rm -f "$gout"
            if [ "$runv" != "true" ] || [ -z "$next" ]; then
              echo "catch-up done ($((n - 1)) slot(s) this job)"
              break
            fi
            echo "catch-up $next ($n/6)"
            publish_one "$next"
          done
