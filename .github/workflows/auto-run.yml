name: Auto run
# GitHub sometimes never starts a scheduled workflow (the 03:00 HKT slot on 2026-11-24 did not appear).
# This job ticks every hour and dispatches Update site, Update prices, or
# Update follow-through (齊聲之後) when they are overdue and not already running. It does not expire. workflow_dispatch from this token is allowed to start them.
on:
  workflow_dispatch:
  schedule:
    - cron: '50 * * * *'
permissions:
  actions: write
  contents: read
concurrency:
  group: auto-run
  cancel-in-progress: true
jobs:
  kick:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Dispatch overdue workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 tools/ensure_runs.py
