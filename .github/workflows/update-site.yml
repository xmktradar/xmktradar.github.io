name: Update site
# Every 4 hours (HKT 03:05, 07:05, 11:05, 15:05, 19:05, 23:05), about 1.5 h before each SuperGrok summary task (:35),
# so new posts are on the site before SuperGrok reads them: fetch new posts, apply SuperGrok summaries and write-ups,
# refresh prices, consensus history and share image, build the language versions and stock pages, check, then publish.
# Steps: fetch posts, merge SuperGrok summaries and write-ups, prices, stats, publish.
on:
  workflow_dispatch:
  schedule:
    - cron: '5 3-23/4 * * *'  # UTC 03:05, 07:05 ... = HKT 11:05, 15:05, 19:05, 23:05, 03:05, 07:05
  push:
    branches: [main]
    paths: ['tools/**', '.github/workflows/update-site.yml', 'data/super-grok-analysis.json', 'data/grok-inbox/**', 'data/super-grok-writeups.json']
permissions:
  contents: write
concurrency:
  group: site-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WORK_DIR: /tmp/site-work
      XAI_API_KEY: ${{ secrets.XAI_API_KEY }}
      XAI_MODEL: ${{ vars.XAI_MODEL }}
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest main, not the commit that triggered the run, so publishing never conflicts
      - name: Restore full page data
        run: python3 tools/slim_pages.py --restore
      # Installs come from caches: on 2026-10-27 the apt mirror and browser downloads took ~50 min and runs hit the
      # 60-min limit before publishing. A cache miss downloads once (time-limited) and saves for the next runs.
      - name: Cache headless browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-chromium-1.56.1-${{ runner.os }}
      - name: Cache apt packages (ffmpeg, fonts)
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-v1-${{ runner.os }}-ffmpeg-fonts-noto-cjk-fonts-inter
      - name: Install headless browser
        timeout-minutes: 15
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.56.1
          npx playwright install chromium
          # the runner image normally has the system libraries; only fetch them when the browser cannot start
          node -e "require('playwright').chromium.launch().then(b=>b.close())" 2>/dev/null || npx playwright install-deps chromium
      - name: Install ffmpeg and fonts (motion videos, Top5 clip, social pictures; not on the runner image)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          PKGS="ffmpeg fonts-noto-cjk fonts-inter"
          if ls ~/apt-debs/*.deb >/dev/null 2>&1; then
            sudo dpkg -i ~/apt-debs/*.deb >/dev/null 2>&1 || sudo apt-get install -y -qq -f --no-install-recommends
          fi
          if ! command -v ffmpeg >/dev/null 2>&1 || ! fc-list | grep -qi "Noto Sans CJK TC"; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends $PKGS
            mkdir -p ~/apt-debs && cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
          fi
          ffmpeg -version | head -1
          fc-list | grep -qi "Noto Sans CJK TC" || echo "::warning::Noto Sans CJK 裝唔到，社交圖有機會用後備字型"
      - name: Install Chinese converter
        continue-on-error: true
        run: pip install opencc-python-reimplemented==0.1.7
      - name: Fetch new posts
        continue-on-error: true
        run: python3 tools/fetch_posts.py
      - name: Analyse posts with Grok
        continue-on-error: true
        run: python3 tools/analyse_posts.py
      - name: Add posts to the site
        run: python3 tools/merge_posts.py
      - name: Apply SuperGrok write-ups
        continue-on-error: true
        run: python3 tools/apply_writeups.py
      - name: Update prices
        continue-on-error: true
        run: python3 tools/update_prices.py index.html
      - name: Earnings brief numbers (US stocks >= $50B; SEC + Yahoo, no AI; tools/earnings_data.py)
        continue-on-error: true
        timeout-minutes: 12
        run: python3 tools/earnings_data.py
      - name: Consensus and counts
        run: |
          echo '{"daily": null}' > "$WORK_DIR/windows.json"
          node tools/stats.js index.html "$WORK_DIR/windows.json" "$WORK_DIR/stats.json" || { echo "::error::共識計算失敗"; exit 1; }
      - name: Consensus history, share text, sitemap
        run: python3 tools/publish_extras.py
      - name: Files for SuperGrok (consensus numbers, site status)
        continue-on-error: true
        run: python3 tools/write_status.py
      - name: Share image and social posts
        run: |
          python3 tools/share.py
          if [ -f "$WORK_DIR/og.json" ]; then
            node tools/og.js "$WORK_DIR/og.json" || { echo "::error::分享圖畫唔到"; exit 1; }
          fi
          if [ -f "$WORK_DIR/xcards.json" ]; then node tools/xcard.js "$WORK_DIR/xcards.json" || echo "::warning::X card failed"; fi
          if [ -f "$WORK_DIR/top5cards.json" ]; then node tools/top5card.js "$WORK_DIR/top5cards.json" || echo "::warning::top5 card failed"; fi
      - name: Top5 vertical video
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::warning::ffmpeg not installed; skip top5 video"
            exit 0
          fi
          for lang in zh en; do
            png="og/top5-${lang}.png"
            if [ ! -f "$png" ]; then
              echo "::warning::${png} missing; skip"
              continue
            fi
            sh tools/top5video.sh "$lang"
          done
      - name: Daily multi-picture posts (12:30, 16:30, 20:30 HKT slots on trading days)
        continue-on-error: true
        run: |
          python3 tools/carousel.py
          if [ -f "$WORK_DIR/carousel.json" ]; then
            node tools/carousel.js "$WORK_DIR/carousel.json" || { echo "::error::多圖帖畫唔到，下次更新再試"; exit 1; }
            cp "$WORK_DIR/social-posts.json" data/social-posts.json
            mkdir -p social && cp "$WORK_DIR/social.html" social/index.html
          fi
          if [ -f "$WORK_DIR/xcards.json" ]; then node tools/xcard.js "$WORK_DIR/xcards.json" || echo "::warning::X card failed"; fi
      - name: Motion videos from the multi-picture posts (12:30 slot; zh+en voiceover; tools/MOTION_VIDEO.md)
        continue-on-error: true
        timeout-minutes: 12
        run: |
          if [ -f "$WORK_DIR/carousel.json" ] && ! command -v ffmpeg >/dev/null 2>&1; then
            echo "::error::冇 ffmpeg，今次出唔到動態片（Install ffmpeg and fonts 嗰步失敗）"
          fi
          if [ -f "$WORK_DIR/carousel.json" ] && command -v ffmpeg >/dev/null 2>&1; then
            pip install numpy edge-tts==7.3.1 || echo "::warning::numpy/edge-tts 裝唔到"
            VO_LANGS=zh,en node tools/carousel_video.js "$WORK_DIR/carousel.json" || echo "::warning::動態片整唔到，下次更新再試"
          fi
      - name: Keep only motion videos that exist (runs even if the step above timed out)
        continue-on-error: true
        run: python3 tools/carousel_video_post.py
      - name: Earnings posts (10:00 / 22:00 HKT slots) and the day's earnings short (11:00 HKT)
        continue-on-error: true
        timeout-minutes: 15
        run: |
          python3 tools/earnings_posts.py
          if [ -f "$WORK_DIR/earnings_cards.json" ]; then
            node tools/earnings_cards.js "$WORK_DIR/earnings_cards.json" || { echo "::error::財報貼文圖畫唔到，下次更新再試"; exit 1; }
            if [ -f "$WORK_DIR/earnings_video.json" ]; then
              if command -v ffmpeg >/dev/null 2>&1; then
                pip install numpy edge-tts==7.3.1 || echo "::warning::numpy/edge-tts 裝唔到"
                python3 tools/earnings_video.py "$WORK_DIR/earnings_video.json" "$WORK_DIR/earnings-posts.json" || echo "::warning::財報短片整唔到"
              else
                echo "::warning::冇 ffmpeg，今日冇財報短片"
                python3 -c "import json,sys;p=sys.argv[1];d=json.load(open(p));d.pop('video',None);json.dump(d,open(p,'w'),ensure_ascii=False,indent=1)" "$WORK_DIR/earnings-posts.json"
              fi
            fi
            cp "$WORK_DIR/earnings-posts.json" data/earnings-posts.json
            mkdir -p social && cp "$WORK_DIR/earnings.html" social/earnings.html
          fi
      - name: Language versions
        run: python3 tools/build_langs.py
      - name: Support page
        run: python3 tools/support.py
      - name: Advertise page
        run: python3 tools/advertise.py
      - name: Tools page
        run: python3 tools/toolspage.py
      - name: About page
        run: python3 tools/about.py
      - name: Weekly newsletter (first run Monday 07:00+ HKT; writes last week's issue, sends it via Resend once)
        continue-on-error: true
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_AUDIENCE_ID: ${{ secrets.RESEND_AUDIENCE_ID }}
        run: python3 tools/newsletter_auto.py
      - name: Newsletter pages
        run: python3 tools/newsletter.py
      - name: 404 page
        run: python3 tools/page404.py
      - name: llms-full.txt
        run: python3 tools/llms_full.py
      - name: Stock pages
        run: node tools/stock_pages.js
      - name: Earnings brief pages (/zh|en/earnings/; links on stock pages and homepages; sitemap)
        continue-on-error: true
        run: python3 tools/earnings_pages.py
      - name: Account pages (/zh|en/account/; links from stock pages and homepages; sitemap)
        run: node tools/account_pages.js
      - name: Donate box on stock, earnings and account pages
        run: python3 tools/donate_box.py
      - name: Old Korean links go to the English page (Korean removed 2026-10-27)
        run: python3 tools/ko_redirect.py
      - name: Sitemap lastmod (real content-change time per page)
        run: python3 tools/sitemap_lastmod.py
      - name: Weekend guide posts (Saturday and Sunday)
        continue-on-error: true
        run: |
          python3 tools/tutorial.py
          if [ -f "$WORK_DIR/tutorial.json" ]; then
            node tools/tutorial.js "$WORK_DIR/tutorial.json" || {
              for f in data/tutorial-posts.json social/tutorial.html; do git checkout -- "$f" 2>/dev/null || rm -f "$f"; done
              echo "::error::週末教學圖畫唔到，下次更新再試"; exit 1; }
          fi
      - name: Saturday macro post (frozen Saturday 15:00 HKT; preview on other days)
        continue-on-error: true
        run: |
          python3 tools/macro_week.py
          if [ -f "$WORK_DIR/macro_week.json" ]; then
            node tools/macro_week.js "$WORK_DIR/macro_week.json" || {
              for f in data/macro-week.json social/macro.html; do git checkout -- "$f" 2>/dev/null || rm -f "$f"; done
              echo "::error::星期六宏觀貼文圖畫唔到，下次更新再試"; exit 1; }
          fi
      - name: Instagram plan (Chinese only, at most 2 earnings posts a day, a question at the end; Tim 2026-10-29)
        continue-on-error: true
        run: |
          python3 tools/ig_plan.py && python3 tools/ig_plan.py --check || echo "::error::IG／Threads 方案檢查唔合格（tools/ig_plan.py），bot 會照手冊只發中文"
      - name: Slim homepages
        run: python3 tools/slim_pages.py --slim
      - name: Check the pages
        run: |
          for f in index.html zh/index.html en/index.html; do
            node tools/check.js "$f" || { echo "::error::網頁檢查唔合格：$f"; exit 1; }
          done
      - name: Layout check (replaces the Grok bot daily layout check; writes layout_warnings)
        continue-on-error: true
        run: node tools/layout_check.js
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          # og/ includes og/c motion mp4s, cover jpgs, and *.vo.json voiceover markers
          git add -A index.html zh/ en/ ko/ support/ advertise/ about/ newsletter/ tools/index.html data/ og/ px/ av/ embed/ social/ sitemap.xml llms-full.txt 404.html ccab4c5e388dc31f07a4976abba71466.txt
          git diff --cached --quiet && exit 0
          git commit -m "定時重建 $(date '+%Y-%m-%d %H:%M') HKT"
          # --autostash: build steps can leave tracked files changed that are not published (they used to stop the pull).
          git pull --rebase --autostash origin main || { git rebase --abort; echo "::error::main 嘋更新期間有新改動，今次唔發佈，下次再試"; exit 1; }
          git push origin HEAD:main
          echo published > "$WORK_DIR/published"
      - name: Tell search engines (IndexNow)
        continue-on-error: true
        run: |
          # key https://thecrowdtape.com/ccab4c5e388dc31f07a4976abba71466.txt
          # After Publish so GitHub Pages deploys changed URLs before they are submitted.
          # Every published run sends the changed URLs. The 03:05 HKT run (hour < 4) also sends
          # a rotating slice of up to 150 sitemap URLs. workflow_dispatch sends the whole sitemap.
          if [ -f "$WORK_DIR/published" ] || [ "$GITHUB_EVENT_NAME" = workflow_dispatch ]; then python3 tools/indexnow.py; fi
