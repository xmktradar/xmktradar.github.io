name: Fetch new account profiles
on:
  push:
    branches: [avatar-fetch-2]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_profiles.py
        env:
          ONLY: VitalikButerin,brian_armstrong,garyvee,APompliano,ilyasut,deepakshenoy,dollarsanddata,compound248,QCompounding,TheTranscript_,KellyCNBC
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B profiles-download
          git add profiles
          git commit -m "Download new account profiles"
          git push -f origin profiles-download
