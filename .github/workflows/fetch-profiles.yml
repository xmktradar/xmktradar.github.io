name: Fetch new account profiles
on:
  push:
    branches: [avatar-fetch-2]
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/fetch_profiles.py
        env:
          ONLY: VitalikButerin,brian_armstrong,garyvee,cz_binance,APompliano,balajis,AndrewYNg,bchesky,SahilBloom,gdb,reidhoffman,ilyasut,DrJimFan,RampCapitalLLC,johnrampton,fundstrat,CliffordAsness,ramit,deepakshenoy,iancassel,MohnishPabrai,hmarksofficial,jaltucher,dollarsanddata,Greenbackd,compound248,chriswmayer,andrewrsorkin,MrZackMorris,QCompounding,WallStJesus,AlderLaneEggs,TheOneLanceB,CarterBWorth,ThetaWarrior,jsblokland,TheTranscript_,OddStats,NateGeraci,SqueezeMetrics,KellyCNBC,Seawolfcap
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git checkout -B profiles-download
          git add profiles
          git commit -m "Download new account profiles"
          git push -f origin profiles-download
