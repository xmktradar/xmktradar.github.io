name: Update prices
# Prices also refresh inside "Update site" every 4 hours; this one is for a manual refresh.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['tools/update_prices.py', '.github/workflows/update-prices.yml']
permissions:
  contents: write
concurrency:
  group: site-update
  cancel-in-progress: false
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # latest main, not the commit that triggered the run, so publishing never conflicts
      - run: python3 tools/update_prices.py index.html
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "更新股價 $(TZ=Asia/Hong_Kong date '+%Y-%m-%d %H:%M') HKT"
          git pull --rebase origin main || { git rebase --abort; echo "::error::main 喺更新期間有新改動，今次唔發佈，下次再試"; exit 1; }
          git push origin HEAD:main
