<style>
:root{
  --bg:#fbf6ec; --surface:#fffaf2; --ink:#3b2f24; --muted:#87776a; --line:#ece1cc;
  --accent:#a5672c; --accent-soft:#f8ecda;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-display:"Noto Serif TC","Songti TC",serif;
  color-scheme:light;
}
*{box-sizing:border-box}
html[lang=ko] body{font-family:"Noto Sans KR","Noto Sans TC",system-ui,sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6}
img{max-width:100%;height:auto}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:22px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);text-decoration:none}
.lang{display:flex;flex-wrap:wrap;gap:4px}
.lang a{font-size:13px;font-weight:600;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;background:var(--surface)}
.lang a[aria-current]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
h1{font-family:var(--f-display);font-size:28px;line-height:1.3;margin:0 0 8px;overflow-wrap:anywhere}
.lead{margin:0 0 20px}
.cards{display:grid;grid-template-columns:1fr;gap:12px}
.card{min-width:0;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:8px}
.card h2{font-size:16px;line-height:1.35;margin:0;overflow-wrap:anywhere}
.card img{width:min(180px,100%);border-radius:8px;background:#fff}
.btn{display:inline-block;margin-top:4px;padding:8px 16px;border-radius:999px;background:var(--accent);color:#fff;font-weight:700;font-size:14px;text-decoration:none}
.badge{display:inline-block;margin-top:4px;padding:4px 10px;border-radius:999px;background:#e4e0d8;color:#8a8175;font-size:12px;font-weight:700}
.note{margin-top:16px;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;background:var(--accent-soft)}
.note b{display:block;margin-bottom:4px}
.note p{margin:0;font-size:14px}
.back{display:inline-block;margin-top:18px;font-weight:700;text-decoration:none}
@media(min-width:720px){.cards{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:420px){h1{font-size:24px}.wrap{padding:16px 14px 40px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="brand" href="/ko/">The Crowd Tape</a>
  <nav class="lang" aria-label="언어">
    <a href="/zh/support/" hreflang="zh-Hant">中</a>
    <a href="/en/support/" hreflang="en">EN</a>
    <a href="/ko/support/" hreflang="ko" aria-current="page">한</a>
  </nav>
</header>
<main>
  <h1>The Crowd Tape 후원</h1>
  <p class="lead">사이트는 무료이며 로그인이 필요 없고 4시간마다 업데이트된다. 후원금은 사이트 운영에 쓰인다.</p>
  <div class="cards">
    <article class="card">
      <img src="/assets/donate/paypal.png" alt="PayPal" width="400" height="400">
      <h2>PayPal</h2>
      <a class="btn" href="https://www.paypal.com/qrcodes/p2pqrc/3KT8QNVNRWJMA" target="_blank" rel="nofollow noopener">PayPal로 열기</a>
    </article>
    <article class="card">
      <h2>Ko-fi / Buy Me a Coffee</h2>
      <span class="badge">곧 출시</span>
    </article>
    <article class="card">
      <h2>GitHub Sponsors</h2>
      <span class="badge">곧 출시</span>
    </article>
  </div>
  <aside class="note">
    <b>투자 조언 아님</b>
    <p>이 사이트 내용은 참고용이며 투자 조언이 아니다. 후원은 자발적이며 투자 조언이나 추가 콘텐츠를 제공하지 않는다.</p>
  </aside>
  <p><a class="back" href="/ko/">홈으로 돌아가기</a></p>
</main>
</div>
</body>
</html>
