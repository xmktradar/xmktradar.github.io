com/@realDonaldTrump\" target=\"_blank\" rel=\"noopener\">@realDonaldTrump<\/a> 話醫療器械關稅年底生效，<a class=\"tk\" href=\"#stock/BDX\">$BDX<\/a> 承諾 30 億美元返美設廠。數據範圍：10/5 08:31 至 10/6 18:19 HKT，共 32 則。<\/p>","full":"<p><strong>共識：<\/strong> 記憶體係今日唯一有共識嘅題材。<a href=\"https://x.com/ren_stocks\" target=\"_blank\" rel=\"noopener\">@ren_stocks<\/a> 同 <a href=\"https://x.com/vikramskr\" target=\"_blank\" rel=\"noopener\">@vikramskr<\/a> 睇好 <a class=\"tk\" href=\"#stock/MU\">$MU<\/a> 同 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a>；<a href=\"https://x.com/aleabitoreddit\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a> 揀 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a> 做已賺錢嘅選擇，所以 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a> 有 3 個帳號睇好，<a class=\"tk\" href=\"#stock/MU\">$MU<\/a> 有 2 個；冇股票有共同睇淡。<\/p>\n<p>理由最完整嘅係 <a href=\"https://x.com/ren_stocks\" target=\"_blank\" rel=\"noopener\">@ren_stocks<\/a>（<a href=\"https://x.com/ren_stocks/status/2107300051970126204\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）。佢睇完摩根大通（JPM）最新嘅記憶體市場報告，話更加睇好 <a class=\"tk\" href=\"#stock/MU\">$MU<\/a> 同 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a>，理由有四層：<\/p>\n<ol><li><strong>供需：<\/strong> 美光預計 2027、2028 年供應會比 2026 年更緊，而且睇唔到幾時會返到平衡。需求增長快過供應，無塵室又唔夠，個缺口補唔到。<\/li><li><strong>客戶合約：<\/strong> 美光嘅長期供應協議一季之內由 16 份加到 26 份，訂單能見度去到 2031 年。預付款由 220 億美元升到 320 億，合約積壓訂單有 1,500 億，2027 年大約 75% 產量已經鎖定。<\/li><li><strong>HBM 更緊：<\/strong> 2027 年 HBM 供應已經賣晒，價格按年升 54%。HBM 位元需求增長 63%，其他伺服器記憶體得 37%。<\/li><li><strong>唔止美光：<\/strong> 三星有六至七成產能已經簽咗合約，SK 海力士簽緊五年期合約。<\/li><\/ol>\n<p>佢嘅結論係，客戶肯提早幾年預付 320 億，代表佢哋更驚冇貨；周期要等供應追上先會完，而家業內冇人講得出幾時。呢篇係今日唯一一篇講明個股同理由、而且兩隻都係大型股（市值 ≥$50B）嘅睇好。<\/p>\n<p><a href=\"https://x.com/vikramskr\" target=\"_blank\" rel=\"noopener\">@vikramskr<\/a>（<a href=\"https://x.com/vikramskr/status/2107314252537303353\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）引用 <a href=\"https://x.com/damnang2\" target=\"_blank\" rel=\"noopener\">@damnang2<\/a>（<a href=\"https://x.com/damnang2/status/2106970721612386304\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/5）「HBM4 要由 8 層返去 12 層」嘅警報，話美銀由頭到尾都唔信「降規格」傳聞。佢附上嘅美銀 9 月 19 日報告寫明：唔預期新 GPU／ASIC 會降規格或者減少記憶體用量，反而假設會再增加，Rubin Ultra 每顆去到 1,000GB，新 Rubin 去到 384GB，而家係 288GB。報告亦預計 2030 年全球 DRAM 加 NAND 市場規模去到 2 萬億美元，第三季大部分 DRAM 產品價格按季升 20–30%，NAND 升 15% 以上。不過報告都有一個保留：預計 2028 年記憶體平均售價會跌大約 10%（DRAM 跌約 5%，NAND 跌約 13%），美銀形容係「軟着陸」，之後 2029–30 年再增長。呢篇帖同截圖都冇點名個股，分析師按內容將佢歸做睇好 <a class=\"tk\" href=\"#stock/MU\">$MU<\/a> 同 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a>。<\/p>\n<p><a href=\"https://x.com/damnang2\" target=\"_blank\" rel=\"noopener\">@damnang2<\/a> 另外貼咗一篇 SK 海力士工程師訪問（<a href=\"https://x.com/damnang2/status/2107414090092322872\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6），講下一代記憶體競爭唔可以單靠微縮：3D DRAM 喺製造同檢測兩方面都有瓶頸，而將記憶體單元同周邊電路分開造再接合，會改變競爭嘅基礎。呢篇係技術討論，冇講個股好淡。<\/p>\n<p><strong>分歧：<\/strong> 今日冇明顯分歧嘅股票。<a href=\"https://x.com/aleabitoreddit\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a>（<a href=\"https://x.com/aleabitoreddit/status/2107143846027268373\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）講 <a class=\"tk\" href=\"#stock/AAOI\">$AAOI<\/a> 終於完成 6 億美元「按市價增發」（ATM），公司公告共賣出約 569 萬股，均價 $105.36。佢之前批評公司 4 月、6 月、8 月接連增發，喺 $100、$150、$200 呢啲價位都有約 6 億美元沽壓，令股價突破唔到。不過佢覺得 AAOI 營運上 2027 年好強，光模組月收入 4.71 億美元，2028 年每月仲有 40 萬個 ELSFP，收入爬升快到可以將預測市盈率壓到單位數。所以佢話只要公司唔再增發，AAOI 應該會跑贏 <a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>。呢個係有條件嘅相對比較，唔係睇淡 LITE。佢亦提到 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a> 同三星係「而家已經有盈利」嘅公司，用嚟比較投資 AAOI 嘅機會成本。留意 AAOI 係細價股（市值 &lt; $50B）。<\/p>\n<p><strong>大人物（Trump）：<\/strong> <a href=\"https://truthsocial.com/@realDonaldTrump\" target=\"_blank\" rel=\"noopener\">@realDonaldTrump<\/a> 今日喺 Truth Social 發咗 15 篇（大部分係選舉背書同鬧傳媒），同市場有關嘅有四篇：<\/p>\n<ul><li>醫療器械關稅（<a href=\"https://truthsocial.com/@realDonaldTrump/117391801119298224\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢話 Becton Dickinson（<a class=\"tk\" href=\"#stock/BDX\">$BDX<\/a>，細價股（市值 &lt; $50B））答應投資 30 億美元將針筒、針頭、化驗套件搬返美國生產，其中超過 10 億美元喺內布拉斯加州，並話原因係佢嘅醫療器械關稅，年底前實施。即係醫療器械進口關稅已經有時間表，未喺美國生產嘅同業可能受壓。<\/li><li>派錢（<a href=\"https://truthsocial.com/@realDonaldTrump/117390550758872714\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢話如果共和黨喺 2026 年中期選舉贏晒參眾兩院，會向每個成年公民派 5,000 美元，帖文冇講資金來源同時間。<\/li><li>油價（<a href=\"https://truthsocial.com/@realDonaldTrump/117389259991976695\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢話推高汽油價嘅已經唔係荷姆茲海峽，而係俄羅斯煉油廠被烏克蘭炸，加上加州等州份關閉煉油廠，即係佢認為瓶頸喺煉油產能多過原油供應。<\/li><li>《紐約時報》（<a href=\"https://truthsocial.com/@realDonaldTrump/117390214220913462\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢連發幾篇鬧紐時（<a class=\"tk\" href=\"#stock/NYT\">$NYT<\/a>，細價股（市值 &lt; $50B））改圖同報道失實，話佢訂閱數字大跌、遲早執笠，屬政治攻擊，冇提供訂閱數據。<\/li><\/ul>\n<p><strong>值得留意：<\/strong> AI 訂閱成本成為話題。<a href=\"https://x.com/insane_analyst\" target=\"_blank\" rel=\"noopener\">@insane_analyst<\/a>（<a href=\"https://x.com/insane_analyst/status/2107244864333361207\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）話 AI 月費訂閱仲係大幅補貼緊。佢附圖顯示，同樣係 $200 月費，按 API 價計（以 agentic 工作量計），ChatGPT Pro 大約值 $2,084（10.4 倍），Claude Max 20x 大約值 $11,726（58.6 倍）。佢反問：喺供應極度緊張嘅市場，補貼越高係好事定壞事？冇補貼嘅話，年度經常性收入（ARR）仲會唔會升得咁快？<a href=\"https://x.com/dylan522p\" target=\"_blank\" rel=\"noopener\">@dylan522p<\/a>（<a href=\"https://x.com/dylan522p/status/2107259067693748373\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）亦話 Anthropic、OpenAI 等公司嘅訂閱俾用戶嘅價值差距好大，佢哋測試咗 Meta、Minimax、Kimi、Grok 同 Cursor 嘅訂閱。兩位都冇講個股，分析師將 <a class=\"handle\" href=\"https://x.com/insane_analyst\" target=\"_blank\" rel=\"noopener\">@insane_analyst<\/a> 呢篇標做偏淡。<\/p>\n<p><strong>業績日：<\/strong> <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a> 10/29 美股收市後公布業績（公司已確認，即香港時間 10/30 清晨）；<a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a> 11/5 美股收市後公布（公司已確認）；<a class=\"tk\" href=\"#stock/AAOI\">$AAOI<\/a> 估計同樣 11/5，但公司未正式公布。<\/p>\n<p>今日係第一日資料，32 則入面有 10 則有明確好淡判斷，未有立場變化可以比較。<\/p>\n<p>內容來自被追蹤帳號公開貼文，非投資建議。<\/p>","win":{"from":"2026-10-05T08:31","to":"2026-10-06T18:19"},"date":"2026-10-06","html":"<h4>短摘要<\/h4>\n<p>共識：記憶體係唯一共識，<a href=\ 收入爬升快到可以將預測市盈率壓到單位數。所以佢話只要公司唔再增發，AAOI 應該會跑贏 <a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>。呢個係有條件嘅相對比較，唔係睇淡 LITE。佢亦提到 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a> 同三星係「而家已經有盈利」嘅公司，用嚟比較投資 AAOI 嘅機會成本。留意 AAOI 係細價股（市值 &lt; $50B）。<\/p>\n<p><strong>大人物（Trump）：<\/strong> <a href=\"https://truthsocial.com/@realDonaldTrump\" target=\"_blank\" rel=\"noopener\">@realDonaldTrump<\/a> 今日喺 Truth Social 發咗 15 篇（大部分係選舉背書同鬧傳媒），同市場有關嘅有四篇：<\/p>\n<ul><li>醫療器械關稅（<a href=\"https://truthsocial.com/@realDonaldTrump/117391801119298224\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢話 Becton Dickinson（<a class=\"tk\" href=\"#stock/BDX\">$BDX<\/a>，細價股（市值 &lt; $50B））答應投資 30 億美元將針筒、針頭、化驗套件搬返美國生產，其中超過 10 億美元喺內布拉斯加州，並話原因係佢嘅醫療器械關稅，年底前實施。即係醫療器械進口關稅已經有時間表，未喺美國生產嘅同業可能受壓。<\/li><li>派錢（<a href=\"https://truthsocial.com/@realDonaldTrump/117390550758872714\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢話如果共和黨喺 2026 年中期選舉贏晒參眾兩院，會向每個成年公民派 5,000 美元，帖文冇講資金來源同時間。<\/li><li>油價（<a href=\"https://truthsocial.com/@realDonaldTrump/117389259991976695\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢話推高汽油價嘅已經唔係荷姆茲海峽，而係俄羅斯煉油廠被烏克蘭炸，加上加州等州份關閉煉油廠，即係佢認為瓶頸喺煉油產能多過原油供應。<\/li><li>《紐約時報》（<a href=\"https://truthsocial.com/@realDonaldTrump/117390214220913462\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）：佢連發幾篇鬧紐時（<a class=\"tk\" href=\"#stock/NYT\">$NYT<\/a>，細價股（市值 &lt; $50B））改圖同報道失實，話佢訂閱數字大跌、遲早執笠，屬政治攻擊，冇提供訂閱數據。<\/li><\/ul>\n<p><strong>值得留意：<\/strong> AI 訂閱成本成為話題。<a href=\"https://x.com/insane_analyst\" target=\"_blank\" rel=\"noopener\">@insane_analyst<\/a>（<a href=\"https://x.com/insane_analyst/status/2107244864333361207\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）話 AI 月費訂閱仲係大幅補貼緊。佢附圖顯示，同樣係 $200 月費，按 API 價計（以 agentic 工作量計），ChatGPT Pro 大約值 $2,084（10.4 倍），Claude Max 20x 大約值 $11,726（58.6 倍）。佢反問：喺供應極度緊張嘅市場，補貼越高係好事定壞事？冇補貼嘅話，年度經常性收入（ARR）仲會唔會升得咁快？<a href=\"https://x.com/dylan522p\" target=\"_blank\" rel=\"noopener\">@dylan522p<\/a>（<a href=\"https://x.com/dylan522p/status/2107259067693748373\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）亦話 Anthropic、OpenAI 等公司嘅訂閱俾用戶嘅價值差距好大，佢哋測試咗 Meta、Minimax、Kimi、Grok 同 Cursor 嘅訂閱。兩位都冇講個股，分析師將 <a class=\"handle\" href=\"https://x.com/insane_analyst\" target=\"_blank\" rel=\"noopener\">@insane_analyst<\/a> 呢篇標做偏淡。<\/p>\n<p><strong>業績日：<\/strong> <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a> 10/29 美股收市後公布業績（公司已確認，即香港時間 10/30 清晨）；<a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a> 11/5 美股收市後公布（公司已確認）；<a class=\"tk\" href=\"#stock/AAOI\">$AAOI<\/a> 估計同樣 11/5，但公司未正式公布。<\/p>\n<p>今日係第一日資料，32 則入面有 10 則有明確好淡判斷，未有立場變化可以比較。<\/p>\n<p>內容來自被追蹤帳號公開貼文，非投資建議。<\/p>","range":"分析範圍：10/5 08:31 至 10/6 18:19（HKT），首次抓取，共 32 則貼文（X 17 則、Truth Social 15 則）","mtime_hkt":"2026-10-06 20:21"}],"weekly":[],"monthly":[]},"briefings":[{"date":"2026-10-06","html":"<h3>X 投資帖簡報：2026-10-06（HKT）<\/h3>\n<p>涵蓋時間：2026-10-05 08:31 至 2026-10-06 18:19 HKT。共 17 篇帖，其中 7 篇有 ticker。<br>團隊範圍：美股普通股、市值 ≥ $50B、只做現金長倉、唔做 ETF。<br>市值係 2026-10-05 收市數，已經喺網上核實（stockanalysis／companiesmarketcap／Nasdaq）。<br>本版（19:30 HKT 重做）：每篇帖都用 fxtwitter 攞咗全文、引用帖同附圖，逐張圖睇過。有立場嘅帖由 5 篇加到 7 篇，有 stance_by_ticker 嘅帖由 4 篇加到 5 篇。<\/p>\n<h4>先睇：團隊持倉同十月 Top10<\/h4>\n<ul><li><strong>持倉（BE、INTC、TER、AMAT、MRVL）<\/strong>：今日 17 篇帖<strong>一篇都冇提<\/strong>，明講同暗示都冇。冇睇淡觀點，亦冇硬風險。<\/li><li><strong>Top10 有提到嘅只有 <a class=\"tk\" href=\"#stock/MU\">$MU<\/a> 同 <a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a><\/strong>：WDC、DELL、AMD、COHR、MRNA 全部冇提。INTC、TER、MRVL 同上面一樣冇提。<\/li><li>　<strong><a class=\"tk\" href=\"#stock/MU\">$MU<\/a>：兩篇睇好<\/strong>（<a class=\"handle\" href=\"https://x.com/ren_stocks\" target=\"_blank\" rel=\"noopener\">@ren_stocks<\/a>、<a class=\"handle\" href=\"https://x.com/vikramskr\" target=\"_blank\" rel=\"noopener\">@vikramskr<\/a>），冇人睇淡。但係要留意以下風險（下面詳細講）：<\/li><li>　BofA 預測 <strong>2028 年記憶體 ASP 會跌大約 10%<\/strong>（DRAM 跌 5%、NAND 跌 13%）。BofA 叫佢做「軟着陸」，2029 至 30 年先再升。<\/li><li>　市值年初至今已經升咗大約 274%。<\/li><li>　<strong><a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>：中性<\/strong>。<a class=\"handle\" href=\"https://x.com/aleabitoreddit\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a> 只係攞佢嚟比較，話 AAOI 會跑贏 LITE。即係相對睇法偏弱，但唔係睇淡 LITE 本身，亦唔構成長倉理由。<\/li><li>　光通訊板塊背景（冇 ticker）：<a class=\"handle\" href=\"https://x.com/PhotonCap\" target=\"_blank\" rel=\"noopener\">@PhotonCap<\/a> 講 Hybrid PIC 市場，立場中性。數據中心光互連係主要增長動力，同 LITE、COHR 有關。不過佢指出報告嘅 CAGR 計多咗：13.6% 實際應該係 10.8%。<\/li><\/ul>\n<h4>按 ticker 分<\/h4>\n<h5><a class=\"tk\" href=\"#stock/MU\">$MU<\/a>（Micron）：喺範圍內 ✅（市值約 $1.20T），係 Top10<\/h5>\n<ul><li><strong><a class=\"handle\" href=\"https://x.com/ren_stocks\" target=\"_blank\" rel=\"noopener\">@ren_stocks<\/a><\/strong>：睇好｜基本面｜長線<\/li><li>　全文先見到嘅數字（引用 JPM 嘅 Memory Market Update，附圖已核對）：<\/li><li>　Micron 預計 2027、2028 年供應會比 2026 年更緊，「睇唔到幾時供求平衡」，因為無塵室唔夠。<\/li><li>　長期供應協議一季內由 16 份加到 26 份，訂單能見度去到 2031 年。<\/li><li>　預付款由 $22B 升到 $32B，合約 backlog 有 $150B，2027 年大約 75% 產出已經鎖定。<\/li><li>　HBM 2027 年已經賣晒，價格按年升 54%。HBM bit 需求增長 63%，其他伺服器記憶體係 37%。<\/li><li>　佢原話：「Memory bears are running out of years to be right.」<\/li><li>　附圖入面 JPM 嘅一個細位：MU 透過 SCA 鎖定大約 35% 以上 2030 年前收入，亞洲同業嘅 LTA 覆蓋就超過 50%。JPM 認為 MU 嘅數係保守。<\/li><li>　連結：<a href=\"https://x.com/ren_stocks/status/2107300051970126204\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><li><strong><a class=\"handle\" href=\"https://x.com/vikramskr\" target=\"_blank\" rel=\"noopener\">@vikramskr<\/a><\/strong>：睇好｜基本面｜長線（今次由「側面支持」升級做正式立場，觀點喺附圖）<\/li><li>　帖文原文只有一句：「BoA never bought into this despec rumor」，引用 <a class=\"handle\" href=\"https://x.com/damnang2\" target=\"_blank\" rel=\"noopener\">@damnang2<\/a> 話 HBM4 會由 8Hi 返去 12Hi。<\/li><li>　真正嘅內容喺附圖，係 <strong>BofA 9 月 19 日嘅 Global Memory Tech 報告<\/strong>：<\/li><li>　報告明講唔預期新 GPU／ASIC 會「de-spec」。反而預期每粒晶片嘅記憶體再加：Rubin Ultra 用 1,000GB，新 Rubin 用 384GB，而家係 288GB。<\/li><li>　2030 年 DRAM＋NAND 市場（TAM）上調到 $2.0tn（之前係 $1.8tn），報告稱之為「L-T super-cycle」。<\/li><li>　2027 至 28 年 DRAM／NAND ASP 假設上調 8–12%／2–3%。<\/li><li>　⚠️ <strong>硬風險（同一張圖）<\/strong>：BofA 預期 2028 年 ASP 跌大約 10%（DRAM 跌 5%、NAND 跌 13%），2028 年營收增長會急劇放慢（DRAM 由 2027 年嘅 +60% 降到 +12%，NAND 由 +33% 降到 +3%）。<\/li><li>　連結：<a href=\"https://x.com/vikramskr/status/2107314252537303353\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a>（Sandisk）：喺範圍內 ✅（市值約 $250B）<\/h5>\n<ul><li><strong><a class=\"handle\" href=\"https://x.com/ren_stocks\" target=\"_blank\" rel=\"noopener\">@ren_stocks<\/a><\/strong>：睇好｜基本面｜長線。理由同上，係同一份 JPM 記憶體報告。<\/li><li><strong><a class=\"handle\" href=\"https://x.com/vikramskr\" target=\"_blank\" rel=\"noopener\">@vikramskr<\/a><\/strong>：睇好。BofA 附圖寫明「NAND upside also emerging」，第三季 NAND 價格按季升超過 15%。不過帖文主題係 HBM，對 SNDK 嘅支持較間接。<\/li><li><strong><a class=\"handle\" href=\"https://x.com/aleabitoreddit\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a><\/strong>：睇好，係順帶一提。佢喺引用嘅舊帖將 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a> 同三星列為「而家已經賺錢」嘅名，用嚟對比 AAOI 不停增發嘅機會成本。呢句要睇引用帖先見到。<\/li><li>風險：<\/li><li>　BofA 預期 2028 年 NAND ASP 跌 13%。<\/li><li>　已核實：市值一年升咗超過 12 倍，52 週高位 $2,354.39，近收市大約 $1,704–1,720，波動好大。<\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>（Lumentum）：喺範圍內 ✅（市值約 $97.9B），係 Top10<\/h5>\n<ul><li><strong><a class=\"handle\" href=\"https://x.com/aleabitoreddit\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a><\/strong>：中性，只係比較對象。佢話只要 AAOI 唔再做 ATM，AOI 會跑贏 LITE。<\/li><li>連結：<a href=\"https://x.com/aleabitoreddit/status/2107143846027268373\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/AAOI\">$AAOI<\/a>（Applied Optoelectronics）：唔喺範圍內 ❌（市值約 $10.3B）<\/h5>\n<ul><li><strong><a class=\"handle\" href=\"https://x.com/aleabitoreddit\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a><\/strong>：睇好｜催化劑｜中線<\/li><li>理由：<\/li><li>　附圖係 10 月 5 日公司公告：$600m ATM 做完，賣咗 5,694,845 股，平均價 $105.36，淨收大約 $588m。<\/li><li>　引用帖補充：<\/li><li>　佢認為 AAOI 營運上 2027 年好強：每月 $471m 光收發模組營收，2028 年每月 40 萬件 ELSFP，預測 P/E 可以壓到單位數。<\/li><li>　但係佢批評 AAOI 不停做 ATM，令股價好難突破 $100、$150、$200。佢預期要停咗 ATM 先會大幅跑贏，尤其係 2027 年。<\/li><\/ul>\n<h5><a class=\"tk\" href=\ const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const S_OF={'睇好':'bull','睇淡':'bear','中性':'neu'};
const SLABEL={bull:'看多',bear:'看空',neu:'中性',none:'未表態'};
const SCHAR={bull:'多',bear:'空',neu:'中',none:'?'};
const TRADE_RE=/買進|買入|賣出|加倉|減倉|持倉|持有|建倉|平倉|清倉|資金|流入|流出|部位|倉位|增發/;
const OV=D.overrides||{};const UNC=t=>!!(OV[t]&&OV[t].unconfirmed);
const ACCINFO=D.accounts||{};
function accInfo(h){if(ACCINFO[h])return ACCINFO[h];const k=Object.keys(ACCINFO).find(k=>k.toLowerCase()===h.toLowerCase());return k?ACCINFO[k]:{}}
const NAMES={};D.posts.forEach(p=>{if(p.name&&!p.reposted_by)NAMES[p.handle]=p.name});
const nameOf=h=>accInfo(h).name||NAMES[h]||h;

// ---------- 日期（全部以 HKT 計） ----------
const hkDate=ms=>new Date(ms+8*36e5).toISOString().slice(0,10);
const hkMs=d=>Date.parse(d+'T00:00:00+08:00');
const addDays=(d,n)=>hkDate(hkMs(d)+n*DAY+12*36e5);
const fmt=d=>`${+d.slice(5,7)}/${+d.slice(8,10)}`;
const fmtFull=d=>d;
const hm=ms=>new Date(ms+8*36e5).toISOString().slice(11,16);
const CUT=D.meta.cutoff_hkt?Date.parse(D.meta.cutoff_hkt):Math.max(0,...D.posts.map(p=>Date.parse(p.time_utc)));
const TODAY=hkDate(CUT);

// ---------- 把貼文展開成「帖 × 股票」觀點（等同設計稿的 POSTS，一帖一股） ----------
// 股票＝貼文標出的代號 ∪ 分析師逐股立場（stance_by_ticker）裡的代號
// 一律中文：只用寫手 zh_summary／中文 summary_zh，永不顯示英文原文（讀者撳「原始貼文」睇原文）
const HAS_ZH=s=>typeof s==='string'&&/[\u3400-\u9fff]/.test(s);
const ALLP=D.posts.map(p=>({...p,text:undefined,summary_zh:HAS_ZH(p.zh_summary)?p.zh_summary:HAS_ZH(p.summary_zh)?p.summary_zh:'',truncated:HAS_ZH(p.zh_summary)?false:p.truncated,tickers:[...new Set([...(p.tickers||[]),...Object.keys(p.stance_by_ticker&&typeof p.stance_by_ticker==='object'?p.stance_by_ticker:{})].map(t=>String(t).replace(/^\$/,'').toUpperCase()))],ms:Date.parse(p.time_utc),acc:p.reposted_by||p.handle,date:p.time_hkt.slice(0,10)})).sort((a,b)=>a.ms-b.ms);
const valid=p=>!p.folded_into&&p.theme!=='非市場';
// 立場一律按個股讀 stance_by_ticker（唔用整篇帖立場）；冇標示＝未表態
function stanceOf(p,t){const m=p.stance_by_ticker&&typeof p.stance_by_ticker==='object'?p.stance_by_ticker:null;if(!m)return p.stance&&S_OF[p.stance]?{s:S_OF[p.stance],star:true}:{s:'none',star:false};const k=Object.keys(m).find(x=>String(x).replace(/^\$/,'').toUpperCase()===t);return {s:k?(S_OF[m[k]]||'none'):'none',star:false}}
const POSTS=[];ALLP.filter(valid).forEach(p=>p.tickers.forEach(t=>{const r=stanceOf(p,t);POSTS.push({p,t,acc:p.acc,s:r.s,star:r.star,ms:p.ms,d:p.date,kind:p.basis||null,why:p.summary_zh||'',url:p.url})}));
const TICKERS=[...new Set(POSTS.map(x=>x.t))].sort();
const explicit=s=>s==='bull'||s==='bear';
const stanced=s=>s!=='none';

// ---------- 計算（對應設計稿 postsIn / latest / prevStance / change / dist / agreeLabel / dailyWindow） ----------
// 範圍可以係日期（YYYY-MM-DD）或時間點（YYYY-MM-DDTHH:MM，HKT，包頭包尾）
const rk=(v,end)=>Date.parse(v+':00+08:00')+(end?59999:0);
const inR=(d,ms,from,to)=>from.length>10?(ms>=rk(from)&&ms<=rk(to,true)):(d>=from&&d<=to);
const tsOf=ms=>hkDate(ms)+'T'+hm(ms);
const fmtR=v=>v.length>10?`${fmt(v)} ${v.slice(11,16)}`:fmt(v);
const postsIn=(from,to)=>POSTS.filter(x=>inR(x.d,x.ms,from,to));
const rawIn=(from,to)=>ALLP.filter(p=>inR(p.date,p.ms,from,to));
function latest(acc,t,from,to){let r=null;for(const x of postsIn(from,to))if(x.acc===acc&&x.t===t&&(!r||x.ms>=r.ms))r=x;return r}
function prevStance(acc,t,beforeMs){let r=null;for(const x of POSTS)if(x.acc===acc&&x.t===t&&x.ms<beforeMs&&stanced(x.s)&&(!r||x.ms>r.ms))r=x;return r}
function change(prev,cur){if(!prev||!cur||!stanced(cur.s)||prev.s===cur.s)return null;if(explicit(prev.s)&&explicit(cur.s))return '反轉';const rank={bear:0,neu:1,bull:2};return rank[cur.s]>rank[prev.s]?'轉強':'轉弱'}
const chgOf=x=>change(prevStance(x.acc,x.t,x.ms),x);
function accsOf(from,to){return [...new Set(postsIn(from,to).map(x=>x.acc))]}
// 共識計算（一致程度、共同看多／看空、好淡分歧）計所有追蹤帳號
function dist(t,from,to,all){const c={bull:0,bear:0,neu:0,none:0,accs:0,mentions:0};accsOf(from,to).filter(a=>all||inCons(a)).forEach(a=>{const x=latest(a,t,from,to);if(x){c[x.s]++;c.accs++}});c.mentions=postsIn(from,to).filter(x=>x.t===t).length;return c}
function agreeLabel(c){const tot=c.bull+c.bear+c.neu+c.none;if(tot<2)return {l:'樣本不足',k:'neu'};if(c.bull>=1&&c.bear>=1&&Math.min(c.bull,c.bear)/Math.max(c.bull,c.bear)>=.5)return {l:'明顯分歧',k:'chg'};const r=Math.abs(c.bull-c.bear)/tot;if(r>=.6)return {l:c.bull>c.bear?'高度一致看多':'高度一致看空',k:c.bull>c.bear?'bull':'bear'};return {l:'部分一致',k:'neu'}}
// 每日窗：優先用寫手分析第一行嘅時間範圍（同今日市場分析一致，包括 Truth Social）；
// 冇得讀就用同一個抓帖周期：最近一次抓帖時段之前 24 小時至資料截止
const SCRAPE_SLOTS=D.meta.scrape_slots_hkt||[];
function dailyWindow(){const sm=summaryOf('daily',TODAY);const win=sm&&!sm.stale&&sm.s.win;
 if(win&&win.from&&win.to){const n=rawIn(win.from,win.to).filter(valid).length;return {from:win.from,to:win.to,day:TODAY,timed:true,src:'writer',merged:false,n}}
 if(SCRAPE_SLOTS.length&&D.meta.cutoff_hkt){const cut=Date.parse(D.meta.cutoff_hkt.replace(' ','T')+':00+08:00');if(cut){
  const cands=[];[0,1].forEach(k=>SCRAPE_SLOTS.forEach(sl=>{const t=Date.parse(addDays(hkDate(cut),-k)+'T'+sl+':00+08:00');if(t<=cut)cands.push(t)}));
  const last=cands.length?Math.max(...cands):cut;const from=tsOf(last-DAY),to=tsOf(cut);const n=rawIn(from,to).filter(valid).length;
  if(n)return {from,to,day:TODAY,timed:true,src:'cycle',merged:false,n}}}
 return dailyWindowByDay()}
function dailyWindowByDay(){const n=rawIn(TODAY,TODAY).filter(valid).length;const y=addDays(TODAY,-1);const hasPrev=ALLP.some(p=>p.date<TODAY);return n<MIN_POSTS&&hasPrev?{from:y,to:TODAY,day:TODAY,merged:true,n}:{from:TODAY,to:TODAY,day:TODAY,merged:false,n}}
const DATES=[...new Set(ALLP.map(p=>p.date))].sort();

// ---------- 股價 ----------
function closes(t){if(UNC(t))return null;const p=D.prices[t];return p&&p.c&&p.c.length?p.c:null}
function pchg(t,days){const c=closes(t);if(!c)return null;const last=c[c.length-1];if(days==null)return (last[1]/c[0][1]-1)*100;const lim=new Date(Date.parse(last[0])-days*DAY).toISOString().slice(0,10);let base=null;for(const r of c){if(r[0]<=lim)base=r;else break}return base?(last[1]/base[1]-1)*100:null}
function closeOn(t,d){const c=closes(t);if(!c)return null;let r=null;for(const x of c){if(x[0]<=d)r=x;else break}return r}
const money=v=>v==null?'—':(v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toFixed(2));
// 非美元報價（例如澳交所）：清楚標示貨幣與交易日
const CURNAME={USD:'美元',AUD:'澳元',HKD:'港元',CAD:'加元',GBP:'英鎊',EUR:'歐元',JPY:'日圓'};
const curOf=t=>((D.prices[t]&&D.prices[t].currency)||(OV[t]&&OV[t].currency)||'USD').toUpperCase();
const isUS=t=>!(OV[t]&&(OV[t].exchange&&!/^(NYSE|NASDAQ|AMEX|NYSEARCA|US)$/i.test(OV[t].exchange)||OV[t].symbol&&OV[t].symbol.includes('.')));
const tradeDay=t=>isUS(t)?'美東交易日':((OV[t]&&OV[t].exchange)||'當地')+' 交易日';
const moneyT=(t,v)=>{const c=curOf(t);return c==='USD'?money(v):`${money(v)} ${CURNAME[c]||c}`};
// 市值／類別標籤（中性色）：美股市值 < $50B →「細價股（市值 < $50B）」；ETF →「ETF」；沒有資料就不顯示
const QT=t=>(D.quotes||{})[t]||null;
const capKind=t=>{if(UNC(t)||!isUS(t))return null;const q=QT(t);if(!q)return null;if(q.type==='ETF')return 'etf';if(q.type==='MUTUALFUND')return 'fund';if(q.type==='EQUITY'&&typeof q.mcap==='number'&&q.mcap<50e9)return 'small';return null};
const CAPTXT={small:'細價股（市值 < $50B）',etf:'ETF',fund:'基金'},CAPSHORT={small:'細價股',etf:'ETF',fund:'基金'};
const capTag=t=>{const k=capKind(t);return k?`<span class="flag small-cap" title="${k==='small'?'市值約 $'+(QT(t).mcap/1e9).toFixed(1)+'B（Yahoo Finance，'+esc(QT(t).date||'')+'）':''}">${CAPTXT[k]}</span>`:''};
const OVN=t=>{const o=OV[t];if(!o||o.unconfirmed)return '';const tags=[];if(o.note)tags.push(`<span class="pill unc">${esc(o.note)}</span>`);else if(!isUS(t))tags.push('<span class="pill unc">非美股</span>');return tags.join(' ')};
const UNC_TXT='<span class="pill unc" title="代號可能有歧義，未能確認對應哪隻股票">代號未確認</span>';
const pctCell=(t,days)=>{if(UNC(t))return UNC_TXT;const v=pchg(t,days);return v==null?'<span class="note">無股價資料</span>':signed(+v.toFixed(1))+'%'};

// ---------- 小元件 ----------
const tkBtn=t=>{const o=OV[t];const tip=o&&!o.unconfirmed&&o.note?` title="${esc(o.note)}"`:'';const ck=capKind(t);const x=o&&!o.unconfirmed&&!isUS(t)?`<small class="xch">${esc(o.exchange||'非美股')}</small>`:(ck?` <span class="flag small-cap" title="${CAPTXT[ck]}">${CAPSHORT[ck]}</span>`:'');const fl=(FLAGS[t]||[]).map(flagSpan).join('');return `<button class="tk" data-tk="${esc(t)}"${tip}>${esc(t)}${x}${fl}</button>`};
const accLink=h=>`<a class="handle" href="${xUrl(h)}" target="_blank" rel="noopener">@${esc(h)}</a>${platTag(h)}`;
const accIn=h=>`<a class="accin" href="#account/${encodeURIComponent(h)}" title="查看 @${esc(h)} 在本頁的觀點" aria-label="查看 @${esc(h)} 在本頁的觀點">觀點 ›</a>`;
const pill=(s,star)=>`<span class="pill ${s}"${star?' title="多股帖：分析師只標示整篇帖立場，套用到帖內每隻股票"':''}>${SLABEL[s]}${star?'＊':''}</span>`;
const distBar=c=>{const tot=c.bull+c.neu+(c.none||0)+c.bear||1;return `<div class="bar" title="看多 ${c.bull}・中性 ${c.neu}・未表態 ${c.none||0}・看空 ${c.bear}"><span class="b" style="width:${c.bull/tot*100}%"></span><span class="m" style="width:${c.neu/tot*100}%"></span><span class="u" style="width:${(c.none||0)/tot*100}%"></span><span class="r" style="width:${c.bear/tot*100}%"></span></div>`};
const signed=v=>`<span class="${v>0?'up':v<0?'dn':''}">${v>0?'+':''}${typeof v==='number'&&!Number.isInteger(v)?v.toFixed(1):v}</span>`;
const legend=`<div class="legend"><span><i class="sw b"></i>看多</span><span><i class="sw m"></i>中性</span><span><i class="sw u"></i>未表態</span><span><i class="sw r"></i>看空</span></div>`;
const empty=t=>`<div class="empty">${t}</div>`;
const vsPrev=(a,b,has)=>has?`${signed(a-b)} 對比前期`:'<span class="note">前期無資料</span>';
function whyLine(p){const k=[p.basis,p.horizon].filter(Boolean).map(esc);const extra=[];if(p.specific===true)extra.push('<span class="chip spec">具體</span>');if(TRADE_RE.test(p.summary_zh||''))extra.push('<span class="chip claim" title="帖中提及的交易／資金紀錄未經查證">據貼文所述</span>');
 return `<p class="why">推論依據：${k.length?`<b>${k[0]}</b>${k.slice(1).map(x=>'・'+x).join('')}`:'<span class="note">分析師未標示</span>'} ${extra.join(' ')}</p>`}
const FOLD={};ALLP.forEach(p=>{if(p.folded_into)(FOLD[p.folded_into]=FOLD[p.folded_into]||[]).push(p)});
// 一帖可提及多隻股票：每隻股票各自顯示立場與變化
function postHtml(p,focusT){const xs=POSTS.filter(x=>x.p===p&&(!focusT||x.t===focusT));
 const tags=xs.length?xs.map(x=>{const ch=chgOf(x);return `${tkBtn(x.t)} ${pill(x.s,x.star)}${ch?` <span class="pill chg">${ch}</span>`:''}`}).join(' '):pill(p.stance?S_OF[p.stance]:'none');
 const fold=(FOLD[p.url]||[]).map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">附圖貼文 ↗</a>`).join(' ');
 const pap=p.price_at_post?Object.entries(p.price_at_post).filter(([t])=>!focusT||t===focusT).map(([t,v])=>`$${esc(t)} ${esc(v)}`).join('、'):'';
 const xu=xUrl(p.acc);
 return `<div class="post"><div><a class="post-who" href="${xu}" target="_blank" rel="noopener">${avImg(p.acc,'post-av')}<span><b>${esc(nameOf(p.acc))}</b><small>@${esc(p.acc)} ${platTag(p.acc)}</small></span></a></div><div class="hd">${tags}${p.reposted_by?`<span class="note">↻ 轉發 @${esc(p.handle)}</span>`:''}<span>${p.time_hkt.slice(0,10)} ${p.time_hkt.slice(11,16)} HKT</span><a href="${esc(p.url)}" target="_blank" rel="noopener">原始貼文 ↗</a>${fold}</div>
<p class="tx">${p.summary_zh?esc(p.summary_zh):p.media_only?'<span class="note">（原帖只有圖片／影片，冇文字）</span>':'<span class="note">未有中文概括，請睇原帖</span>'}</p>${(p.links||[]).length||(p.media||[]).length?`<p class="ref">${(p.media||[]).map((u,i)=>`<a href="${esc(u)}" target="_blank" rel="noopener">圖片 ${i+1} ↗</a>`).concat((p.links||[]).slice(0,3).map(u=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(u.replace(/^https?:\/\/(www\.)?/,'').slice(0,40))} ↗</a>`)).join(' ')}</p>`:''}${p.truncated?'<p class="trunc">原文較長，請點開看全文</p>':''}${whyLine(p)}${pap?`<p class="ref">發帖時股價（據紀錄）：${pap}</p>`:''}</div>`}
function spark(vals,w=110,h=26){const mx=Math.max(...vals,1);const pts=vals.map((v,i)=>`${(i/(vals.length-1||1)*w).toFixed(1)},${(h-2-v/mx*(h-4)).toFixed(1)}`);const last=pts[pts.length-1].split(',');return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polygon class="sa" points="0,${h} ${pts.join(' ')} ${w},${h}"/><polyline class="sl" points="${pts.join(' ')}"/><circle class="sd" cx="${last[0]}" cy="${last[1]}" r="2.5"/></svg>`}
function summaryOf(kind,date){const arr=(D.summaries&&D.summaries[kind])||[];if(date){const m=arr.filter(x=>x.date===date);if(m.length)return {s:m[m.length-1],stale:false}}return arr.length?{s:arr[arr.length-1],stale:!!date}:null}
function daysNote(from,to){const ds=DATES.filter(d=>d>=from&&d<=to);return ds.length<3?`<div class="notice">目前只有 ${ds.length} 天的貼文資料（${ds.map(fmt).join('、')||'無'}），以下按現有資料計算；趨勢與變化需要累積更多天數才有意義。</div>`:''}

// ---------- 帳號今日動態卡（指定樣式；資料：帳號資料＋當期貼文） ----------
const ATYPE={opinion:'觀點帳號',news:'市場新聞',disclosure:'交易披露'};
// 追蹤名單的分類優先作為帳號類型標籤
const CAT={};((D.tracked&&D.tracked.accounts)||[]).forEach(a=>{if(a.category)CAT[a.handle.toLowerCase()]=a.category});
// 帳號平台：預設 X；Truth Social 帳號個人頁連去 truthsocial.com，並加細標籤
const PLAT={};((D.tracked&&D.tracked.accounts)||[]).forEach(a=>{if(a.platform)PLAT[a.handle.toLowerCase()]={p:a.platform,url:a.url}});
const isTS=h=>(PLAT[String(h).toLowerCase()]||{}).p==='truthsocial';
const platTag=h=>isTS(h)?'<span class="plat">Truth Social</span>':'';
const platName=h=>isTS(h)?'Truth Social':'X';
const CATN={};((D.tracked&&D.tracked.categories)||[]).forEach((c,i)=>{CATN[c.name]=(i%7)+1});
// 類別層 consensus:false（例如市場快訊）→ 呢啲帳號唔計入任何共識／分歧／最看好統計；其他人（包括大人物）照計
const NOCONS_CATS=((D.tracked&&D.tracked.categories)||[]).filter(c=>c.consensus===false).map(c=>c.name);
const NOCONS=new Set(((D.tracked&&D.tracked.accounts)||[]).filter(a=>NOCONS_CATS.includes(a.category)).map(a=>a.handle.toLowerCase()));
const inCons=h=>!NOCONS.has(String(h).toLowerCase());
const noConsNote=NOCONS_CATS.length?`・不計${NOCONS_CATS.join('、')}`:'';
const catBadge=h=>{const c=CAT[String(h).toLowerCase()];return c&&CATN[c]?`<span class="cat c${CATN[c]}">${esc(c)}</span>`:''};
const typeLabel=(h,type)=>CAT[String(h).toLowerCase()]||ATYPE[type]||'觀點帳號';
function accChips(a,c,max=3){return a.slice(0,max).map(t=>`<button class="tk ${c}" data-tk="${esc(t)}">${esc(t)}</button>`).join('')+(a.length>max?`<span class="tk more" title="${esc(a.slice(max).join('、'))}">+${a.length-max}</span>`:'')}
function cardData(h,from,to){const i=accInfo(h);const lt={};postsIn(from,to).filter(x=>x.acc===h).forEach(x=>{if(!lt[x.t]||x.ms>=lt[x.t].ms)lt[x.t]=x});const v=Object.values(lt).sort((a,b)=>a.t.localeCompare(b.t));
 return {h,name:nameOf(h),avatar:i.avatar&&/^data:image\//.test(i.avatar)?i.avatar:null,type:ATYPE[i.type]?i.type:'opinion',typeKnown:!!ATYPE[i.type],bio:i.bio||null,n:rawIn(from,to).filter(p=>!p.folded_into&&p.acc===h).length,bull:v.filter(x=>x.s==='bull').map(x=>x.t),bear:v.filter(x=>x.s==='bear').map(x=>x.t),men:v.filter(x=>x.s==='neu'||x.s==='none').map(x=>x.t)}}
function avatarHtml(c){return c.avatar?`<img class="av" src="${esc(c.avatar)}" alt="">`:`<div class="av" aria-hidden="true">${esc((Array.from(c.name.replace(/^[^\p{L}\p{N}]+/u,''))[0]||'@').toUpperCase())}</div>`}
function accCardsHtml(w,label){const hs=[...new Set(rawIn(w.from,w.to).filter(p=>!p.folded_into).map(p=>p.acc))];if(!hs.length)return '';
 const rows=hs.map(h=>cardData(h,w.from,w.to)).sort((a,b)=>((b.bull.length+b.bear.length)>0)-((a.bull.length+a.bear.length)>0)||b.n-a.n||a.h.localeCompare(b.h));
 const card=r=>{const has=r.bull.length||r.bear.length;const href='#account/'+encodeURIComponent(r.h);
  const body=has?`<div class="row"><span class="lb bull">看多</span>${r.bull.length?accChips(r.bull,'bull'):`<span class="none">${label}沒有明確看多貼文</span>`}</div><div class="row"><span class="lb bear">看空</span>${r.bear.length?accChips(r.bear,'bear'):`<span class="none">${label}沒有明確看空貼文</span>`}</div>`
   :`<div class="quiet">${label}沒有明確看多或看空的標的</div><div class="row"><span class="lb men">${label}提及</span>${r.men.length?accChips(r.men,'men'):`<span class="none">${label}沒有提及</span>`}</div>`;

 return `<div class="grid">${groups.filter(g=>g.list.length).map(g=>`<section class="c12"><div class="trk-group"><h3>${esc(g.name)}</h3><span class="cnt">${g.list.length} 個</span>${g.consensus===false?`<span class="nocon">只轉發頭條，唔計入共識</span>`:''}${g.desc?`<p>${esc(g.desc)}</p>`:''}</div><div class="trk-grid">${g.list.map(item).join('')}</div></section>`).join('')}</div>`}

// ---------- @帳號前的細頭像（設計稿 a.xh / .xh-av；CSS 在 cream-skin.css） ----------
const AVMINI=D.avmini||{};
const miniAv=h=>{const i=infoOf(h);const src=(i.avatar&&/^data:image\//.test(i.avatar))?i.avatar:AVMINI[h.toLowerCase()];
 if(src){const im=document.createElement('img');im.className='xh-av';im.src=src;im.alt='';return im}
 const sp=document.createElement('span');sp.className='xh-av ini';sp.setAttribute('aria-hidden','true');sp.textContent=(h.replace(/^_+/,'')[0]||'@').toUpperCase();return sp};
function addMiniAvatars(root){if(!root)return;root.querySelectorAll('a[href^="https://x.com/"],a[href^="https://truthsocial.com/@"]').forEach(a=>{if(a.closest('svg,.acc,.trk,.post-who'))return;const m=a.textContent.trim().match(/^@([A-Za-z0-9_]{1,15})$/);if(!m||a.querySelector('.xh-av'))return;a.classList.add('xh');a.prepend(miniAv(m[1]))})}

// ---------- 所有 @handle 都連到 X 個人頁（掃描畫面上未連結的文字） ----------
const HANDLE_RE=/(^|[^A-Za-z0-9_\/.@])@([A-Za-z0-9_]{1,15})(?![A-Za-z0-9_])/g;
// 窄螢幕放唔落的表格（每週、每月等）改為逐行卡片：第一欄（股票）可換行，其餘欄位附欄名，
// 確保「一年股價」「淨看多變化」等右邊欄位唔使橫向捲動都見到；矩陣表維持原樣
function fitTables(root){if(!root)return;root.querySelectorAll('.tablewrap,.lb-wrap').forEach(w=>{if(w.querySelector('table.matrix'))return;const t=w.querySelector('table');if(!t)return;
 const hs=[...t.querySelectorAll('thead th')].map(th=>th.innerText.replace(/[↓↑]/g,'').replace(/\s+/g,' ').trim());t.querySelectorAll('tbody tr').forEach(tr=>[...tr.children].forEach((td,i)=>{if(hs[i]&&!td.dataset.l)td.dataset.l=hs[i]}));
 w.classList.remove('stack');if(w.scrollWidth>w.clientWidth+1)w.classList.add('stack')})}
addEventListener('resize',()=>{fitTables(document.getElementById('view'));const d=document.getElementById('dive');if(d&&!d.hidden)fitTables(d)});
function linkHandles(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,{acceptNode:n=>{const p=n.parentElement;if(!p||p.closest('a,button,script,style,textarea,title,option,svg'))return NodeFilter.FILTER_REJECT;return /@[A-Za-z0-9_]/.test(n.nodeValue)?NodeFilter.FILTER_ACCEPT:NodeFilter.FILTER_REJECT}});
 const nodes=[];while(w.nextNode())nodes.push(w.currentNode);
 for(const n of nodes){const t=n.nodeValue;HANDLE_RE.lastIndex=0;if(!HANDLE_RE.test(t))continue;HANDLE_RE.lastIndex=0;
  const frag=document.createDocumentFragment();let last=0,m;
  while((m=HANDLE_RE.exec(t))){const at=m.index+m[1].length;frag.append(t.slice(last,at));const a=document.createElement('a');a.className='handle';a.href=xUrl(m[2]);a.target='_blank';a.rel='noopener';a.textContent='@'+m[2];frag.append(a);last=at+1+m[2].length}
  frag.append(t.slice(last));n.replaceWith(frag)}
 addMiniAvatars(root)}
const VIEWS={daily:viewDaily,weekly:viewWeekly,monthly:viewMonthly,tracked:viewTracked};
function render(){const h=decodeURIComponent((location.hash||'#daily').slice(1));
 const ms=h.match(/^stock[\/-](.+)$/),ma=h.match(/^account\/(.+)$/);
 if(ms||ma){if(!document.getElementById('view').innerHTML)drawView();try{ms?openDive(ms[1].toUpperCase()):openAccount(ma[1])}catch(e){console.error(e);document.getElementById('dive').innerHTML='<div class="wrap">'+empty('畫面顯示錯誤：'+esc(e.message))+'</div>';showDive(document.getElementById('dive'))}return}
 closeDive();current=VIEWS[h]?h:'daily';drawView()}
function drawView(){document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===current));
 try{document.getElementById('view').innerHTML=VIEWS[current]();linkHandles(document.getElementById('view'));fitTables(document.getElementById('view'));try{mountTape(document.getElementById('view'))}catch(e){}}catch(e){console.error(e);document.getElementById('view').innerHTML=empty('畫面顯示錯誤：'+esc(e.message))}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tk]');if(b){e.preventDefault();location.hash='stock/'+b.dataset.tk;return}
 const v=e.target.closest('nav.tabs button');if(v){location.hash=v.dataset.v;return}
 const card=e.target.closest('.acc[data-href]');if(card&&!e.target.closest('a,button')){location.hash=card.dataset.href}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('dive').hidden){location.hash=current;return}const card=e.target.closest&&e.target.closest('.acc[data-href]');if(card&&e.key==='Enter'&&e.target===card)location.hash=card.dataset.href});

let rT=null;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{const m=decodeURIComponent(location.hash.slice(1)).match(/^stock[\/-](.+)$/);if(m)drawChart(m[1].toUpperCase())},150)});

 const slots=m.update_slots_hkt||[];const now=Date.now(),base=Math.max(now,Date.parse((m.generated_hkt||'').replace(' ','T')+':00+08:00')||0);let next=null;
 for(let k=0;k<3&&!next;k++){const d=hkDate(base+k*DAY);for(const s of slots){const t=Date.parse(`${d}T${s}:00+08:00`);if(t>base){next=t;break}}}

 const nonUS=Object.entries(D.prices).filter(([t])=>!UNC(t)&&!isUS(t)).map(([t,p])=>`$${esc(t)} 以 ${esc(p.symbol||t)}（${esc((OV[t]&&OV[t].exchange)||p.exchange||'')}，${CURNAME[curOf(t)]||curOf(t)}，${esc(p.source)}，截至 ${esc(p.as_of)} ${tradeDay(t)}）報價，非美股`);const fet=Object.values(D.prices).map(p=>p.fetched_hkt).sort().pop();const unc=Object.keys(OV).filter(UNC);
 document.getElementById('foot').innerHTML=`<p><b>免責聲明：</b>所有內容整理自被追蹤帳號的公開貼文，只反映帳號本身的說法；任何「資金流向」或「交易紀錄」均為「據貼文所述」，未經查證。本頁不構成投資建議。</p>

<p>股價：${Object.keys(srcs).length?Object.keys(srcs).map(esc).join('、')+` 日收市價，截至 ${esc(asof)}（美東交易日），抓取於 ${esc(fet)} HKT`:'沒有股價資料'}${m.price_missing.length?`；無股價資料：${m.price_missing.map(t=>'$'+esc(t)).join(' ')}`:''}${nonUS.length?'；非美股以當地交易所及貨幣報價（個股頁已標示）':''}。</p>
${MAC&&MAC.rows.length?`<p>大市數據：${[...new Set(MAC.rows.map(r=>(r.src||'').replace(/（.*?）|\(.*?\)/g,'').trim()).filter(Boolean))].map(esc).join('、')||'—'}${MAC.as_of?`，截至 ${esc(MAC.as_of)} HKT`:''}。</p>`:''}<p>時間均為香港時間（HKT, UTC+8）。帳號頭像與簡介來自各帳號的 X 個人頁。</p>`;linkHandles(document.getElementById('foot'))})();
