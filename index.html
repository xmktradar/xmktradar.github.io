<!DOCTYPE html>
<html lang="zh-Hant-TW"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex"><meta name="format-detection" content="telephone=no">
<title>市場共識儀表板</title>
<style>
/* 基礎樣式：所有顏色、圓角、陰影、字體都讀 CSS 變數（由 design/theme.css 提供；缺檔時用 DEFAULT_THEME） */
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--sans);line-height:1.6;font-size:15px}
.wrap{max-width:1180px;margin:0 auto;padding:18px 16px 40px;padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:12px}
h1{margin:0;font-size:1.6rem;color:var(--tx-strong);font-family:var(--serif);font-weight:700;letter-spacing:.01em}
.sub{color:var(--mut);font-size:.85rem;margin:2px 0 0}.sub b{color:var(--tx)}
.cut{display:inline-block;background:var(--tx-strong);color:var(--panel);border-radius:var(--radius-sm);padding:1px 9px;font-weight:600;font-variant-numeric:tabular-nums}
.navr{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tabs{display:flex;gap:4px;background:var(--panel2);border-radius:var(--radius);padding:4px}
.tabs a{padding:6px 16px;border-radius:calc(var(--radius) - 4px);color:var(--mut);text-decoration:none!important}
.tabs a[aria-selected=true]{background:var(--panel);color:var(--tx-strong);font-weight:600;box-shadow:var(--shadow)}
.search input{font:inherit;font-size:16px;color:var(--tx);border:1px solid var(--line);border-radius:var(--radius);padding:5px 12px;width:170px;background:var(--panel)}
.search input::placeholder{color:var(--mut)}
.search input:focus{outline:2px solid var(--link-line);border-color:var(--link)}
.disc-top{font-size:.75rem;color:var(--warn);margin:8px 0 0}
.range{font-size:.82rem;color:var(--mut);margin:12px 0}.range .fb{color:var(--warn);font-weight:600}.range b{color:var(--tx)}
.note{background:var(--warn-bg);border:1px solid var(--warn-line);color:var(--warn);border-radius:var(--radius-sm);padding:6px 12px;font-size:.82rem;margin:0 0 12px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;box-shadow:var(--shadow)}
.kpi small{color:var(--mut);font-size:.78rem}.kpi b{display:block;font-size:1.5rem;font-family:var(--serif);font-variant-numeric:tabular-nums;line-height:1.3;color:var(--tx-strong)}
.kpi .d{font-size:.78rem;color:var(--mut)}
.up,.kpi b.up{color:var(--bull-ink)}.dn,.kpi b.dn{color:var(--bear-ink)}.flat{color:var(--mut)}
.brief{background:var(--brief-bg);border:1px solid var(--brief-line);border-radius:var(--radius);padding:12px 18px;margin-bottom:16px}
.brief h2{margin:0 0 4px;font-size:1.12rem;color:var(--tx-strong);font-family:var(--serif);display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;align-items:baseline}
.brief h2 small{font-family:var(--sans);font-weight:400;color:var(--mut);font-size:.75rem}
.brief ul,.brief ol{margin:.2em 0;padding-left:1.3em}.brief li{margin:.3em 0}.brief b{color:var(--tx-strong)}
.brief h3,.brief h4,.brief h5,.brief h6{margin:.8em 0 .2em;font-size:.95rem;color:var(--tx-strong);font-family:var(--serif)}
.brief blockquote{margin:.4em 0;padding:4px 10px;border-left:3px solid var(--warn-line);background:var(--warn-bg);color:var(--warn);font-size:.88rem;border-radius:0 var(--radius-sm) var(--radius-sm) 0}
.brief p{margin:.45em 0}.brief details{margin-top:8px;border-top:1px dashed var(--brief-line);padding-top:6px}.brief summary{cursor:pointer;color:var(--link);font-size:.88rem}
.brief .empty{background:var(--panel)}
.cols{display:grid;grid-template-columns:1.4fr 1fr;gap:14px}.cols>div{min-width:0}@media(max-width:860px){.cols{grid-template-columns:1fr}}
.box{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:14px;min-width:0;box-shadow:var(--shadow)}
.box h3{margin:0 0 8px;font-size:1.06rem;font-family:var(--serif);font-weight:700;color:var(--tx-strong);display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.box h3 small{font-family:var(--sans);font-weight:400;color:var(--mut);font-size:.78rem}
.box h4{margin:12px 0 6px;font-size:.92rem;font-family:var(--serif);color:var(--tx-strong)}
.scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th{text-align:left;color:var(--mut);font-weight:500;font-size:.78rem;border-bottom:1px solid var(--line);padding:6px;white-space:nowrap}
td{padding:7px 6px;border-bottom:1px solid var(--line-soft);vertical-align:middle}
tr.click{cursor:pointer}tr.click:hover td{background:var(--hover)}
.tk{font-family:var(--mono);font-weight:700;color:var(--tx-strong)}a.tk:hover{color:var(--link)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.ratio{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--panel2);min-width:90px}.ratio i{display:block}
.ratio .b{background:var(--bull)}.ratio .m{background:var(--neu)}.ratio .n{background:var(--neu-bg)}.ratio .s{background:var(--bear)}
.rl{font-size:.72rem;color:var(--mut);white-space:nowrap}
.pill{display:inline-block;font-size:.72rem;font-weight:600;border-radius:999px;padding:0 9px;border:1px solid;white-space:nowrap}
.p-con{color:var(--bull-ink);background:var(--bull-bg);border-color:var(--bull-line)}
.p-div{color:var(--div-ink);background:var(--div-bg);border-color:var(--div-line)}
.p-bear{color:var(--bear-ink);background:var(--bear-bg);border-color:var(--bear-line)}
.p-one{color:var(--neu-ink);background:var(--neu-bg);border-color:var(--neu-line)}
.p-unc{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.matrix table td,.matrix table th{text-align:center;padding:5px}.matrix th.acct{text-align:left;white-space:nowrap}
.cell{display:inline-block;min-width:26px;height:22px;border-radius:6px;line-height:22px;font-size:.75rem;font-weight:700;padding:0 3px}
.c-b{background:var(--bull-bg);color:var(--bull-ink)}.c-s{background:var(--bear-bg);color:var(--bear-ink)}.c-n{background:var(--neu-bg);color:var(--neu-ink)}
.c-u{background:transparent;color:var(--mut);border:1px dashed var(--faint)}.c-x{background:transparent;color:var(--faint)}.c-mix{background:var(--div-bg);color:var(--div-ink)}
.legend{font-size:.75rem;color:var(--mut);margin-top:6px}
.post{border-top:1px solid var(--line-soft);padding:9px 0}.post:first-child{border-top:0}
.post .h{display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.82rem}.post .h time{color:var(--mut);margin-left:auto;white-space:nowrap}
.post p{margin:4px 0}.post .ft{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;align-items:center}.post .stats{color:var(--mut);font-size:.75rem}
.st{display:inline-flex;align-items:center;gap:3px;font-size:.72rem;font-weight:600;border-radius:999px;padding:0 9px;border:1px solid;white-space:nowrap}
.st.bull{color:var(--bull-ink);background:var(--bull-bg);border-color:var(--bull-line)}.st.bear{color:var(--bear-ink);background:var(--bear-bg);border-color:var(--bear-line)}
.st.neu{color:var(--neu-ink);background:var(--neu-bg);border-color:var(--neu-line)}.st.none{color:var(--mut);background:transparent;border-color:var(--faint);border-style:dashed}
.chip{font-size:.7rem;color:var(--tx);background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 6px;white-space:nowrap}
.chip.spec{color:var(--link);background:var(--link-bg);border-color:var(--link-line)}
.chip.out,.chip.claim,.chip.unc{color:var(--warn);background:var(--warn-bg);border-color:var(--warn-line)}
.chip.rep{color:var(--mut)}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
.hd{color:var(--link);font-weight:600}
.ref,.trunc{font-size:.75rem;color:var(--warn)}
.empty{color:var(--mut);font-size:.85rem;background:var(--bg);border:1px dashed var(--line-strong);border-radius:var(--radius-sm);padding:10px 12px;margin:4px 0}
.back{font-size:.85rem;margin:12px 0;display:inline-block}
.dhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:4px}
.dhead h2{margin:0;font-size:1.6rem;font-family:var(--mono);color:var(--tx-strong)}.dhead h2.acct-h{font-family:var(--serif)}.dhead .nm{color:var(--mut);font-size:.9rem}
.dhead .av{width:52px;height:52px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--neu-bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--mut);font-size:1.2rem}
.abio{color:var(--mut);font-size:.88rem;margin:6px 0 0}
.tpill{font-size:.7rem;font-weight:600;border-radius:999px;padding:1px 9px;border:1px solid;white-space:nowrap}.tpill.opinion{color:var(--t-opinion-ink);background:var(--t-opinion-bg);border-color:var(--t-opinion-line)}.tpill.news{color:var(--t-news-ink);background:var(--t-news-bg);border-color:var(--t-news-line)}.tpill.disclosure{color:var(--t-disc-ink);background:var(--t-disc-bg);border-color:var(--t-disc-line)}
.chartwrap{width:100%;min-height:120px}.chart{display:block;width:100%;height:auto;overflow:visible}
.chart .g{stroke:var(--line-soft)}.chart .ax{fill:var(--mut);font-size:11px}.chart .ln{stroke:var(--chart-line);fill:none;stroke-width:2}.chart .ar{fill:var(--chart-line);fill-opacity:.1}
.chart .mk{stroke:var(--panel);stroke-width:1.5}.chart .lab{fill:var(--tx);font-size:11px}
.chart .bull{fill:var(--bull);stroke:var(--bull)}.chart .bear{fill:var(--bear);stroke:var(--bear)}.chart .neu{fill:var(--neu-ink);stroke:var(--neu-ink)}
.chart line.vl{fill:none;stroke-dasharray:3 3;opacity:.7}.chart circle.mk{stroke:var(--panel)}
.dot{font-size:.9em}.dot.bull{color:var(--bull)}.dot.bear{color:var(--bear)}.dot.neu{color:var(--neu-ink)}
.rbtn{display:flex;gap:4px}.rbtn button{font:inherit;font-size:.75rem;border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:1px 10px;cursor:pointer;color:var(--tx)}
.rbtn button[aria-pressed=true]{background:var(--link);border-color:var(--link);color:var(--panel)}
.timeline{border-left:2px solid var(--line);margin-left:6px;padding-left:14px}.tl{position:relative;margin-bottom:12px}
.tl:before{content:"";position:absolute;left:-20px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--neu)}
.tl.bull:before{background:var(--bull)}.tl.bear:before{background:var(--bear)}.tl.none:before{background:var(--panel);border:2px solid var(--neu);width:6px;height:6px}
.tl small{color:var(--mut)}.tl p{margin:2px 0}
.chg{font-size:.72rem;font-weight:600;white-space:nowrap}.chg.rev{color:var(--bear-ink)}.chg.str{color:var(--bull-ink)}.chg.wk{color:var(--div-ink)}.chg.same,.chg.first{color:var(--mut)}
.bars{display:flex;align-items:flex-end;gap:6px;height:120px;padding-top:6px;border-bottom:1px solid var(--line)}
.bars .col{flex:1;display:flex;flex-direction:column-reverse;min-width:14px;max-width:60px}.bars .col i{display:block}
.bars .b{background:var(--bull)}.bars .m{background:var(--neu)}.bars .n{background:var(--neu-bg)}.bars .s{background:var(--bear)}
.bl{display:flex;gap:6px;font-size:.7rem;color:var(--mut)}.bl span{flex:1;text-align:center;min-width:14px;max-width:60px;white-space:nowrap;overflow:hidden}
.hm td{text-align:center;font-size:.75rem;padding:4px}.hm th{font-size:.7rem}.hm .tk{text-align:left}
details.more summary{cursor:pointer;color:var(--link);font-size:.85rem;margin-top:6px}
.tags{display:flex;flex-wrap:wrap;gap:4px}
.foot{color:var(--mut);font-size:.78rem;border-top:1px solid var(--line);margin-top:20px;padding-top:10px}.foot p{margin:.3em 0}.foot b{color:var(--tx)}
[hidden]{display:none!important}
@media(max-width:600px){body{font-size:14.5px}.wrap{padding-top:12px}h1{font-size:1.35rem}.top{align-items:flex-start}.navr{width:100%}.tabs{flex:1}.tabs a{flex:1;text-align:center;padding:6px 8px}.search{width:100%}.search input{width:100%}.kpis{grid-template-columns:repeat(2,1fr)}.kpi b{font-size:1.3rem}.box{padding:10px 12px}.post .h time{margin-left:0;width:100%}}

/* design/account-cards.css（已加 .acc-sec 範圍）*/
body.paper{background:var(--bg) radial-gradient(var(--bg-dot) 1px,transparent 1px) 0 0/14px 14px;color:var(--tx)}
.acc-sec .acc-head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin:8px 0 14px}
.acc-sec .acc-head h2{font-family:var(--serif);font-weight:700;font-size:1.45rem;margin:0;letter-spacing:.01em}
.acc-sec .acc-head small{color:var(--mut);font-size:.8rem}
.acc-sec .acc-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media(max-width:1100px){.acc-sec .acc-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.acc-sec .acc-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:540px){.acc-sec .acc-grid{grid-template-columns:1fr}}
.acc-sec .acc{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 14px 40px;box-shadow:var(--shadow);display:flex;flex-direction:column;min-height:150px;cursor:pointer;transition:box-shadow .15s,transform .15s,border-color .15s}
.acc-sec .acc:hover{border-color:var(--line-strong);box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.acc-sec .acc:focus-visible{outline:2px solid var(--bull-ink);outline-offset:2px}
.acc-sec .acc-top{display:grid;grid-template-columns:40px 1fr auto;gap:10px;align-items:start}
.acc-sec .av{width:40px;height:40px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--neu-bg);display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-weight:700;color:var(--mut)}
.acc-sec .nmrow{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0}
.acc-sec .acc .nm{font-family:var(--serif);font-weight:700;font-size:1.02rem;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.acc-sec .xlink{font-size:.66rem;color:var(--link);border:1px solid var(--link-line);background:var(--link-bg);border-radius:999px;padding:0 6px;line-height:1.5;white-space:nowrap;text-decoration:none}
.acc-sec .xlink:hover{background:var(--link-bg);text-decoration:none}
.acc-sec .hdl{font-size:.78rem;color:var(--mut);margin-top:1px}
.acc-sec .type{font-size:.66rem;font-weight:600;border-radius:999px;padding:1px 8px;border:1px solid;white-space:nowrap}
.acc-sec .type.opinion{color:var(--t-opinion-ink);background:var(--t-opinion-bg);border-color:var(--t-opinion-line)}
.acc-sec .type.news{color:var(--t-news-ink);background:var(--t-news-bg);border-color:var(--t-news-line)}
.acc-sec .type.disclosure{color:var(--t-disc-ink);background:var(--t-disc-bg);border-color:var(--t-disc-line)}
.acc-sec .bio{font-size:.74rem;color:var(--mut);margin:8px 0 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-bottom:10px;border-bottom:1px solid var(--line)}
.acc-sec .row{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin:4px 0;font-size:.82rem}
.acc-sec .lb{font-weight:700;min-width:2.6em}
.acc-sec .lb.bull{color:var(--bull-ink)}
.acc-sec .lb.bear{color:var(--bear-ink)}
.acc-sec .lb.men{color:var(--tx)}
.acc-sec .acc .tk{font-family:var(--mono);font-weight:700;font-size:.78rem;border-radius:6px;padding:2px 8px;border:1px solid}
.acc-sec .acc .tk.bull{color:var(--bull-ink);background:var(--bull-bg);border-color:var(--bull-line)}
.acc-sec .acc .tk.bear{color:var(--bear-ink);background:var(--bear-bg);border-color:var(--bear-line)}
.acc-sec .acc .tk.men{color:var(--tx);background:var(--neu-bg);border-color:var(--neu-line)}
.acc-sec .acc .tk.more{color:var(--link);background:var(--link-bg);border-color:var(--link-line)}
.acc-sec .none{color:var(--mut);font-size:.78rem}
.acc-sec .quiet{font-weight:600;font-size:.8rem;color:var(--tx);margin:4px 0}
.acc-sec .go{position:absolute;right:12px;bottom:10px;width:24px;height:24px;border-radius:50%;border:1px solid var(--line);background:var(--panel);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--link)}
.acc-sec .acc:hover .go{background:var(--link);color:var(--panel);border-color:var(--link)}
.acc-sec{margin:4px 0 18px}
.acc-sec .acc-top>div{min-width:0}
.acc-sec .acc-div{border-bottom:1px solid var(--line);margin:10px 0}
.acc-sec .tk{text-decoration:none!important}.acc-sec a.tk:hover{filter:brightness(.96)}
.acc-sec .go{text-decoration:none!important}
.acc-sec .hdl .n{white-space:nowrap}

/* design/theme.css */
/* ===== 奶油風格 theme v1（網頁UI 設計）=====
   儀表板所有顏色都由呢度讀。換風格只需要換呢個檔。 */
:root{
  /* 底色同面板 */
  --bg:#fbf6ec;            /* 奶油底 */
  --bg-dot:#f1e7d3;        /* 底紋點 */
  --panel:#fffaf2;         /* 卡片／方格 */
  --panel2:#f6eedf;        /* 次要底：分頁列、膠囊 */
  --hover:#f9f1e3;         /* 表格行 hover */
  --line:#ece1cc;          /* 邊框 */
  --line-soft:#f2e9d8;     /* 表格分隔 */
  --line-strong:#dccbab;   /* hover 邊框 */
  /* 文字 */
  --tx:#3b2f24;            /* 可可色主文字 */
  --tx-strong:#2a2119;     /* 標題 */
  --mut:#87776a;           /* 次要文字 */
  --faint:#c2b49c;         /* 極淡：未提及 */
  /* 強調色 */
  --link:#a5672c;          /* 焦糖：連結、按鈕 */
  --link-bg:#f8ecda; --link-line:#ecd4b0;
  /* 看多（鼠尾草綠） */
  --bull:#7ba374; --bull-ink:#4f7a4a; --bull-bg:#ebf3e3; --bull-line:#d3e4c7;
  /* 看空（陶土紅） */
  --bear:#d4836a; --bear-ink:#b0583e; --bear-bg:#fbe8de; --bear-line:#f1cebd;
  /* 未表態 */
  --neu:#dccfb8; --neu-ink:#87776a; --neu-bg:#f4ede0; --neu-line:#e7dcc8;
  /* 分歧／提示（牛油黃） */
  --div-ink:#9a6b12; --div-bg:#fdf1d2; --div-line:#f0dba0;
  --warn:#9a6b12; --warn-bg:#fdf4d9; --warn-line:#f0dca6;
  /* 市場分析方格 */
  --brief-bg:#fdf3df; --brief-line:#f0e0bb;
  /* 帳號類型標籤 */
  --t-opinion-ink:#a5672c; --t-opinion-bg:#f8ecda; --t-opinion-line:#ecd4b0;
  --t-news-ink:#8f6a00;    --t-news-bg:#fdf1c8;    --t-news-line:#efd98f;
  --t-disc-ink:#6e6256;    --t-disc-bg:#efe9df;    --t-disc-line:#e0d7c9;
  /* 圖表 */
  --chart-line:#a5672c;
  /* 形狀同陰影 */
  --radius:16px; --radius-sm:8px;
  --shadow:0 1px 3px rgba(120,90,50,.06);
  --shadow-hover:0 10px 24px rgba(120,90,50,.12);
  /* 字體 */
  --sans:-apple-system,"Segoe UI","PingFang TC","Noto Sans TC","Noto Sans CJK TC","Microsoft JhengHei",sans-serif;
  --serif:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",Georgia,"Times New Roman",serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}

-06","file":"summary/2026-10-06.md","date":"2026-10-06","html":"<p><b>資料範圍：10/5 08:31 至 10/6 18:19（HKT），共 17 篇帖。<\/b> 今日係第一日，資料唔夠一日，所以合埋 10/5 同 10/6 一齊睇。<\/p>\n<p><b>今日主線係記憶體。<\/b> <a href=\"https://x.com/ren_stocks/status/2107300051970126204\" target=\"_blank\" rel=\"noopener\">@ren_stocks<\/a>（10/6）話睇完 JPM 嘅記憶體市場報告之後更加睇好 <a class=\"tk\" href=\"#stock/MU\">$MU<\/a> 同 <a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a>，理由係 Micron 預計 2027、2028 年供應會比 2026 年更緊。<a href=\"https://x.com/vikramskr/status/2107314252537303353\" target=\"_blank\" rel=\"noopener\">@vikramskr<\/a>（10/6）就引述 <a href=\"https://x.com/damnang2/status/2107414090092322872\" target=\"_blank\" rel=\"noopener\">@damnang2<\/a> 講 HBM4 由 8 層返回 12 層，話美銀從來唔信「降規格」傳聞。@ren_stocks 嗰篇係今日唯一一篇「具體＋喺股票池入面（市值 ≥$50B）」嘅叫股。<\/p>\n<p><b>光通訊有人揀邊。<\/b> <a href=\"https://x.com/aleabitoreddit/status/2107143846027268373\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a>（10/5）話 <a class=\"tk\" href=\"#stock/AAOI\">$AAOI<\/a> 完成咗 6 億美元嘅增發（均價約 $105.36），佢認為只要唔再增發，AAOI 會跑贏 <a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>。呢個係相對比較，唔係睇淡 LITE；AAOI 亦唔喺股票池入面。<\/p>\n<p><b>AI 算力成本係另一個話題。<\/b> <a href=\"https://x.com/dylan522p/status/2107259067693748373\" target=\"_blank\" rel=\"noopener\">@dylan522p<\/a> 同 <a href=\"https://x.com/insane_analyst/status/2107244864333361207\" target=\"_blank\" rel=\"noopener\">@insane_analyst<\/a>（10/5）都講 AI 月費訂閱仲受到大幅補貼；chamath 轉發 <a href=\"https://x.com/socialcapital/status/2107239666781208693\" target=\"_blank\" rel=\"noopener\">@socialcapital<\/a> 嘅講法，話前沿實驗室大約九成算力已經用喺後訓練同推理。呢幾篇冇講個股。<\/p>\n<p><b>共識同分歧：<\/b> 今日冇任何帳號明確睇淡，所以未有分歧可講；睇好集中喺記憶體同小型股（<a href=\"https://x.com/asianinvestors/status/2107087905571410403\" target=\"_blank\" rel=\"noopener\">$ZETA<\/a>、<a href=\"https://x.com/asianinvestors/status/2106954470974484945\" target=\"_blank\" rel=\"noopener\">$EOS<\/a>，兩隻都唔喺股票池入面）。17 篇入面只有 5 篇有明確好淡判斷，資料儲夠幾日先比較得到觀點變化。<\/p>\n<p>內容來自被追蹤帳號公開貼文，非投資建議。<\/p>","mtime_hkt":"2026-10-06 18:46"}],"weekly":[],"monthly":[]},"briefings":[{"name":"2026-10-06-briefing.md","file":"stance/2026-10-06-briefing.md","date":"2026-10-06","html":"<h3>X 投資帖簡報：2026-10-06（HKT）<\/h3>\n<p>涵蓋時間：2026-10-05 08:31 至 2026-10-06 18:19 HKT。共 17 篇帖，其中 7 篇有 ticker。<br>團隊範圍：美股普通股、市值 ≥ $50B、只做現金長倉、唔做 ETF。<br>市值係 2026-10-05 收市數，已經喺網上核實（stockanalysis／companiesmarketcap／Nasdaq）。<\/p>\n<h4>按 ticker 分<\/h4>\n<h5><a class=\"tk\" href=\"#stock/MU\">$MU<\/a>（Micron）：喺範圍內 ✅（市值約 $1.20T）<\/h5>\n<ul><li><b>@ren_stocks<\/b>：睇好｜基本面｜長線<\/li><li>理由：JPM 記憶體市場更新令佢更睇好；Micron 預計 2027、2028 年供應會比 2026 年更緊，暫時「睇唔到幾時供求平衡」。<\/li><li>連結：<a href=\"https://x.com/ren_stocks/status/2107300051970126204\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><li>側面支持（帖文冇提 ticker）：@vikramskr 話 BoA 由頭到尾都唔信 HBM 規格下調（despec）嘅傳聞，佢引用 @damnang2 指 HBM4 會由 8Hi 返去 12Hi。睇好｜基本面。<a href=\"https://x.com/vikramskr/status/2107314252537303353\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a>（Sandisk）：喺範圍內 ✅（市值約 $250B）<\/h5>\n<ul><li><b>@ren_stocks<\/b>：睇好｜基本面｜長線<\/li><li>理由：同一篇帖，佢都係根據 JPM 嘅記憶體報告，話 NAND／記憶體供應 2027 到 2028 年會更緊。<\/li><li>連結：<a href=\"https://x.com/ren_stocks/status/2107300051970126204\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/AAOI\">$AAOI<\/a>（Applied Optoelectronics）：唔喺範圍內 ❌（市值約 $10.3B，低過 $50B）<\/h5>\n<ul><li><b>@aleabitoreddit<\/b>：睇好｜催化劑｜中線<\/li><li>理由：$600m ATM（市價增發）已經做完，平均價大約 $105.36，增發壓力冇咗。佢認為只要唔再做 ATM，AOI 會跑贏 <a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>。佢引用嘅數字係光收發模組營收每月 $471m，加每月 400K ELSFP。<\/li><li>連結：<a href=\"https://x.com/aleabitoreddit/status/2107143846027268373\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>（Lumentum）：喺範圍內 ✅（市值約 $97.9B）。但呢篇帖唔係 LITE 嘅買入理由<\/h5>\n<ul><li><b>@aleabitoreddit<\/b>：LITE 只係比較對象，帖文意思係 AAOI 跑贏 LITE，即係相對 LITE 冇咁睇好。所以呢篇帖嘅 in_universe 標咗 false，因為主要 ticker 係 AAOI。<\/li><li>連結：<a href=\"https://x.com/aleabitoreddit/status/2107143846027268373\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/ZETA\">$ZETA<\/a>（Zeta Global）：唔喺範圍內 ❌（市值約 $8.25B）<\/h5>\n<ul><li><b>@asianinvestors<\/b>：睇好｜催化劑｜中線<\/li><li>理由：RBC 將目標價升到 $40。已核實：由 $31 升上去，維持 Outperform 評級。佢話自己 $15 嗰陣睇好，人人都話佢癲。<\/li><li>連結：<a href=\"https://x.com/asianinvestors/status/2107087905571410403\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/EOS\">$EOS<\/a>：唔喺範圍內 ❌（ticker 有歧義）<\/h5>\n<ul><li><b>@asianinvestors<\/b>：睇好｜basis、horizon 資料不足，冇填<\/li><li>理由：多謝 @haydeninvestsX 嘅研究報導，佢話自己 $9 以下已經開始買。<\/li><li>注意：美股 <a class=\"tk\" href=\"#stock/EOS\">$EOS<\/a> 係 Eaton Vance Enhanced Equity Income Fund II，係封閉式基金，市值大約 $1.1B。另外亦可能係指澳洲 ASX:EOS，或者 Eos Energy（<a class=\"tk\" href=\"#stock/EOSE\">$EOSE<\/a>，市值大約 $1.2B）。無論係邊隻都唔喺範圍內。<\/li><li>連結：<a href=\"https://x.com/asianinvestors/status/2106954470974484945\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h5><a class=\"tk\" href=\"#stock/QQQ\">$QQQ<\/a>：唔喺範圍內 ❌（ETF）<\/h5>\n<ul><li><b>@CathieDWood<\/b>：冇方向觀點。佢喺 Robinhood 峰會回應觀眾，對方用 ARK 相對 QQQ 嘅表現質疑佢資歷。原文被截斷。<\/li><li>連結：<a href=\"https://x.com/CathieDWood/status/2107241954602102833\" target=\"_blank\" rel=\"noopener\">原文 ↗<\/a><\/li><\/ul>\n<h4>其他（冇 ticker，只作背景）<\/h4>\n<ul><li>記憶體／HBM：@damnang2 發咗兩篇（文章同引用帖），係訪問 SK hynix 製程工程師，講 3D DRAM、hybrid bonding 同 AI 時代嘅記憶體策略。另外一篇只有圖、冇文字。<\/li><li>AI 算力：<\/li><li>　@socialcapital（由 @chamath 轉發）話前沿實驗室大約 90% 算力用喺 post-training 同 inference。<\/li><li>　@insane_analyst 話月費訂閱仍然有大量補貼，質疑 ARR 增長嘅質素。<\/li><li>　@dylan522p 話各家 AI 訂閱提供嘅價值差距好大。<\/li><li>光通訊：@PhotonCap 講 Hybrid PIC 市場由 2025 年 $2.45B 升到 2035 年 $6.82B。佢指出報告嘅數隱含 CAGR 只係 10.8%，唔係報告寫嘅 13.6%。<\/li><li>同市場無關：@elonmusk 兩篇講 Grok、@chamath 講 COBOL 現代化、@M_McDonough 講 Hyperliquid perps（加密貨幣）。<\/li><\/ul>\n<h4>最值得跟進（範圍內，只供 swing-long 參考）<\/h4>\n<blockquote>⚠️ 以下只係 X 市場情緒輸入，唔係交易訊號。團隊仍然要先做技術面、再做基本面檢查，先決定做唔做。<\/blockquote>\n<ol><li><b><a class=\"tk\" href=\"#stock/MU\">$MU<\/a><\/b>：今日最清晰嘅範圍內睇好觀點，理由係 2027 到 2028 年供應更緊。@vikramskr 否定 HBM despec 傳聞，側面支持記憶體需求。不過要留意已核實嘅數字：市值年初至今升咗大約 274%，追高風險要靠技術面去把關。<\/li><li><b><a class=\"tk\" href=\"#stock/SNDK\">$SNDK<\/a><\/b>：同一個記憶體供應緊張嘅論點。已核實：市值一年升咗超過 12 倍，52 週高位 $2,354.39，近收市大約 $1,704–1,720，波動好大，倉位要細心處理。<\/li><li>冇第三個：<a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a> 雖然喺範圍內，但帖文係相對偏淡（話 AAOI 會跑贏佢），唔構成長倉理由。<\/li><\/ol>"}]}</script>
<script>
'use strict';
const D=JSON.parse(document.getElementById('dash-data').textContent);
const P=D.posts, PR=D.prices, MIN_POSTS=D.meta.min_daily_posts||8, HTOT=(D.meta.handles||[]).length;
const SCLS={'睇好':'bull','睇淡':'bear','中性':'neu'}, SVAL={'睇好':1,'中性':0,'睇淡':-1};
const DAY=864e5, TRADE_RE=/買進|買入|賣出|加倉|減倉|持倉|持有|建倉|平倉|清倉|資金|流入|流出|部位|倉位|入場|出場/;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const acct=p=>p.reposted_by||p.handle;
const tms=p=>Date.parse(p.time_utc);
const hk=(iso,full)=>iso?(full?iso.slice(0,10)+' '+iso.slice(11,16):iso.slice(5,10)+' '+iso.slice(11,16)):'—';
const msHK=(ms,full)=>{const s=new Date(ms+8*36e5).toISOString();return full?s.slice(0,10)+' '+s.slice(11,16):s.slice(5,10)+' '+s.slice(11,16)};
const hkDate=p=>p.time_hkt.slice(0,10);
const valid=p=>!p.folded_into&&p.theme!=='非市場';
const num=v=>{if(v==null)return 0;const m=String(v).replace(/,/g,'').match(/([\d.]+)\s*([KkMm萬]?)/);if(!m)return 0;return parseFloat(m[1])*({k:1e3,K:1e3,m:1e6,M:1e6,'萬':1e4}[m[2]]||1)};
const NAMES={};P.forEach(p=>{if(p.name&&!p.reposted_by)NAMES[p.handle]=p.name});
const tk=t=>`<a class="tk" href="#stock/${encodeURIComponent(t)}">$${esc(t)}</a>`;
const hd=h=>`<a class="hd" href="#account/${encodeURIComponent(h)}">@${esc(h)}</a>`;
function pill(s,star){if(!s)return '<span class="st none">○ 未表態</span>';const ic={'睇好':'▲','睇淡':'▼','中性':'●'}[s];return `<span class="st ${SCLS[s]}"${star?' title="多股帖：分析師只標示整篇帖立場，套用到帖內每隻股票"':''}>${ic} ${s}${star?'＊':''}</span>`}
function emptyBox(t){return `<div class="empty">${t}</div>`}
const OV=D.overrides||{};const UNC=t=>!!(OV[t]&&OV[t].unconfirmed);
const UNC_TXT='<span class="pill p-unc" title="代號可能有歧義，未能確認對應哪隻股票">代號未確認</span>';
const pct=(v,t)=>t&&UNC(t)?UNC_TXT:v==null?'<span class="flat">無股價資料</span>':`<span class="${v>=0?'up':'dn'}">${v>=0?'+':''}${v.toFixed(1)}%</span>`;
function arrow(v,isNew){if(isNew)return '<span class="up">新</span>';return v>0?`<span class="up">▲${v}</span>`:v<0?`<span class="dn">▼${-v}</span>`:'<span class="flat">－</span>'}

// 每篇帖對每隻股票的立場
// 有 stance_by_ticker 就逐股取值（沒列出的股票＝未表態）；沒有才退回整篇立場（多股帖標＊）
function stanceFor(p,t){if(p.stance_by_ticker&&typeof p.stance_by_ticker==='object')return {s:p.stance_by_ticker[t]||null,star:false};if(!p.stance)return {s:null,star:false};return {s:p.stance,star:p.tickers.length>1}}
function views(posts){const out=[];posts.filter(valid).forEach(p=>p.tickers.forEach(t=>{const r=stanceFor(p,t);out.push({p,t,a:acct(p),s:r.s,star:r.star,ms:tms(p)})}));return out}
function groupBy(arr,f){const m=new Map();arr.forEach(x=>{const k=f(x);if(!m.has(k))m.set(k,[]);m.get(k).push(x)});return m}
// 每帳號對某股票的「目前立場」= 最近一次有表態的觀點
function acctTicker(vs){const out=new Map();groupBy(vs,v=>v.a).forEach((arr,a)=>{arr.sort((x,y)=>x.ms-y.ms);const st=arr.filter(v=>v.s);const cur=st.length?st[st.length-1]:null,prev=st.length>1?st[st.length-2]:null;out.set(a,{a,views:arr,last:arr[arr.length-1],cur,prev,changes:changesOf(st)})});return out}
function changesOf(st){const ch=[];for(let i=1;i<st.length;i++){if(st[i].s!==st[i-1].s)ch.push({from:st[i-1],to:st[i],kind:chgKind(st[i-1].s,st[i].s)})}return ch}
function chgKind(a,b){if(a===b)return 'same';const x=SVAL[a],y=SVAL[b];if(x*y<0)return 'rev';return y>x?'str':'wk'}
function chgLabel(r){if(!r.cur)return '<span class="chg first">—</span>';if(!r.prev)return '<span class="chg first">首次表態</span>';const k=chgKind(r.prev.s,r.cur.s);return {same:'<span class="chg same">不變</span>',str:`<span class="chg str">轉強（原${r.prev.s}）</span>`,wk:`<span class="chg wk">轉弱（原${r.prev.s}）</span>`,rev:`<span class="chg rev">反轉（原${r.prev.s}）</span>`}[k]}
// 每隻股票統計
function tickerStats(vs){const m=new Map();groupBy(vs,v=>v.t).forEach((arr,t)=>{const at=acctTicker(arr);let b=0,s=0,n=0,u=0;at.forEach(r=>{const x=r.cur?r.cur.s:null;if(x==='睇好')b++;else if(x==='睇淡')s++;else if(x==='中性')n++;else u++});
 const vb=arr.filter(v=>v.s==='睇好').length,vs_=arr.filter(v=>v.s==='睇淡').length,vn=arr.filter(v=>v.s==='中性').length;
 m.set(t,{t,mentions:arr.length,accounts:at.size,b,s,n,u,vb,vs:vs_,vn,vu:arr.length-vb-vs_-vn,at,arr,tag:consTag(b,s,n)})});return m}
function consTag(b,s,n){if(b>=1&&s>=1)return 'div';if(b>=2&&s===0)return 'con';if(s>=2&&b===0)return 'bear';if(b+s+n===0)return 'none';return 'one'}
const TAG={con:'<span class="pill p-con">共同睇好</span>',bear:'<span class="pill p-bear">共同睇淡</span>',div:'<span class="pill p-div">分歧</span>',one:'<span class="pill p-one">單一觀點</span>',none:'<span class="pill p-one">未表態</span>'};
function ratio(b,n,s,u){const x=b+n+s+u||1;return `<div class="ratio" title="睇好 ${b} · 中性 ${n} · 睇淡 ${s} · 未表態 ${u}"><i class="b" style="width:${b/x*100}%"></i><i class="m" style="width:${n/x*100}%"></i><i class="n" style="width:${u/x*100}%"></i><i class="s" style="width:${s/x*100}%"></i></div><span class="rl">好 ${b} / 中 ${n} / 淡 ${s} / 未 ${u}</span>`}
// 股價
function closes(t){if(UNC(t))return null;const p=PR[t];return p&&p.c&&p.c.length?p.c:null}
function chg(t,days){const c=closes(t);if(!c)return null;const last=c[c.length-1];if(days==null)return (last[1]/c[0][1]-1)*100;const lim=new Date(Date.parse(last[0])-days*DAY).toISOString().slice(0,10);let base=null;for(const r of c){if(r[0]<=lim)base=r;else break}if(!base)return null;return (last[1]/base[1]-1)*100}
function closeOn(t,dateStr){const c=closes(t);if(!c)return null;let r=null;for(const x of c){if(x[0]<=dateStr)r=x;else break}return r}
const money=v=>v==null?'—':'$'+(v>=1000?v.toLocaleString('en-US',{maximumFractionDigits:2}):v.toFixed(2));

// 貼文卡片
const FOLD={};P.forEach(p=>{if(p.folded_into)(FOLD[p.folded_into]=FOLD[p.folded_into]||[]).push(p)});
function postCard(p,focusT){const a=acct(p);let st;if(focusT&&p.tickers.includes(focusT)){const r=stanceFor(p,focusT);st=pill(r.s,r.star)}else if(p.stance_by_ticker){st=p.tickers.map(t=>{const r=stanceFor(p,t);return `${pill(r.s)} ${tk(t)}`}).join(' ')}else st=pill(p.stance,false);
 const chips=[];if(p.horizon)chips.push(`<span class="chip">${esc(p.horizon)}</span>`);if(p.basis)chips.push(`<span class="chip">${esc(p.basis)}</span>`);if(p.specific===true)chips.push('<span class="chip spec">具體</span>');if(p.in_universe===false)chips.push('<span class="chip out">股票池外</span>');
 if(p.reposted_by)chips.push(`<span class="chip rep">↻ 轉發 @${esc(p.handle)}</span>`);if(TRADE_RE.test(p.summary_zh||''))chips.push('<span class="chip claim" title="帖中提及的交易／資金紀錄未經查證">據貼文所述</span>');
 const tks=p.stance_by_ticker?'':p.tickers.map(tk).join(' ');
 const pap=p.price_at_post?Object.entries(p.price_at_post).map(([t,v])=>`$${esc(t)} ${esc(v)}`).join('、'):'';
 const stats=[p.likes?'♥ '+esc(p.likes):'',p.views?'👁 '+esc(p.views):''].filter(Boolean).join(' · ');
 const fold=(FOLD[p.url]||[]).map(f=>`<a href="${esc(f.url)}" target="_blank" rel="noopener">附圖貼文 ↗</a>`).join(' ');
 return `<div class="post"><div class="h">${hd(a)}${st}${tks}${chips.join('')}<time datetime="${esc(p.time_hkt)}">${hk(p.time_hkt)} HKT</time></div>
<p>${esc(p.summary_zh||'（無摘要）')}</p>${p.truncated?'<div class="trunc">原文較長，請點開看全文</div>':''}${pap?`<div class="ref">發帖時股價（據紀錄）：${pap}</div>`:''}
<div class="ft"><a href="${esc(p.url)}" target="_blank" rel="noopener">原始貼文 ↗</a>${fold}<span class="stats">${stats}</span></div></div>`}
function keyPosts(posts){return posts.filter(valid).slice().sort((x,y)=>((y.stance?2:0)+(y.tickers.length?1:0))-((x.stance?2:0)+(x.tickers.length?1:0))||num(y.views)-num(x.views)||tms(y)-tms(x))}

// 共用表格
function attTable(stats,opt){opt=opt||{};const rows=[...stats.values()].sort((a,b)=>b.mentions-a.mentions||b.accounts-a.accounts||a.t.localeCompare(b.t));if(!rows.length)return emptyBox('此範圍內沒有貼文提及任何股票代號。');
 return `<div class="scroll"><table><thead><tr><th>股票</th><th class="num">提及</th><th class="num">帳號</th>${opt.prev?'<th class="num">變化</th>':''}<th>帳號立場（好／中／淡／未）</th>${opt.price?'<th class="num">28日</th><th class="num">1年</th><th class="num">收市</th>':''}<th></th></tr></thead><tbody>${rows.map(r=>{const pv=opt.prev?opt.prev.get(r.t):null;const c=closes(r.t);
 return `<tr class="click" data-href="#stock/${encodeURIComponent(r.t)}"><td>${tk(r.t)}${UNC(r.t)?' <span class="chip unc" title="代號未確認">?</span>':''}</td><td class="num">${r.mentions}</td><td class="num">${r.accounts}</td>${opt.prev?`<td class="num">${opt.hasPrev?arrow(r.mentions-(pv?pv.mentions:0),!pv):'<span class="flat">—</span>'}</td>`:''}<td>${ratio(r.b,r.n,r.s,r.u)}</td>${opt.price?`<td class="num">${pct(chg(r.t,28),r.t)}</td><td class="num">${pct(chg(r.t,null),r.t)}</td><td class="num">${c?money(c[c.length-1][1]):UNC(r.t)?UNC_TXT:'<span class="flat">無股價資料</span>'}</td>`:''}<td>${TAG[r.tag]}</td></tr>`}).join('')}</tbody></table></div>`}
function matrix(vs){const st=tickerStats(vs);const ts=[...st.values()].sort((a,b)=>b.mentions-a.mentions||a.t.localeCompare(b.t)).map(r=>r.t);if(!ts.length)return emptyBox('此範圍內沒有可列出的帳號 × 股票立場。');
 const accts=[...groupBy(vs,v=>v.a).keys()].sort();const C={'睇好':['c-b','好'],'睇淡':['c-s','淡'],'中性':['c-n','中']};let star=false;
 return `<div class="matrix scroll"><table><thead><tr><th class="acct">帳號＼股票</th>${ts.map(t=>`<th>${tk(t)}</th>`).join('')}</tr></thead><tbody>${accts.map(a=>`<tr><th class="acct">${hd(a)}</th>${ts.map(t=>{const r=st.get(t).at.get(a);if(!r)return '<td><span class="cell c-x">·</span></td>';
 if(!r.cur)return '<td><span class="cell c-u" title="有提及但未表態">?</span></td>';const c=C[r.cur.s];if(r.cur.star)star=true;const mix=r.changes.length?' ↺':'';return `<td><span class="cell ${c[0]}" title="${esc(r.cur.s)}｜${hk(r.cur.p.time_hkt)} HKT${r.changes.length?'｜期內立場有變':''}">${c[1]}${r.cur.star?'＊':''}${mix}</span></td>`}).join('')}</tr>`).join('')}</tbody></table></div>
<div class="legend">好＝睇好 · 淡＝睇淡 · 中＝中性 · ?＝有提及但未表態 · ·＝未提及${star?' · ＊＝多股帖，整篇帖立場套用到帖內每隻股票':''} · ↺＝期內立場有變。點股票代號看個股深入。</div>`}
function bindRows(){document.querySelectorAll('tr.click').forEach(tr=>tr.addEventListener('click',e=>{if(e.target.closest('a'))return;location.hash=tr.dataset.href}))}
function summaryBox(kind,title,match){const arr=(D.summaries&&D.summaries[kind])||[];let s=null,stale=false;if(match){s=arr.filter(x=>x.date===match).slice(-1)[0];if(!s&&arr.length){s=arr[arr.length-1];stale=true}}else s=arr[arr.length-1];
 const body=s?`${stale?`<div class="note">本期（${esc(match)}）尚未有分析，以下為最新一份：${esc(s.name)}</div>`:''}${s.html}`:emptyBox(`尚未有${title}（${kind==='daily'?'summary/'+esc(match||'YYYY-MM-DD')+'.md':kind==='weekly'?'summary/week-*.md':'summary/month-*.md'} 尚未產生）。`);
 return {html:body,src:s?`來源：${esc(s.file)}`:''}}
function windowAccts(posts){return new Set(posts.map(acct))}
function rangeStr(posts){if(!posts.length)return '—';const ms=posts.map(tms);return msHK(Math.min(...ms),true)+' – '+msHK(Math.max(...ms),true)+' HKT'}

// ===== 帳號卡片（今日動態）｜資料格式跟 design/account-cards-demo.html：{name,handle,avatar,type,bio,bull,bear,mentioned} =====
const ACC=D.accounts||{};
const TYPE={opinion:'觀點帳號',news:'市場新聞',disclosure:'交易披露'};
function accInfo(a){if(ACC[a])return ACC[a];const k=Object.keys(ACC).find(k=>k.toLowerCase()===a.toLowerCase());return k?ACC[k]:{}}
function cardData(a,aps,vs){const i=accInfo(a);const bt=groupBy(vs.filter(v=>v.a===a),v=>v.t);const bull=[],bear=[],mentioned=[];
 [...bt.entries()].sort((x,y)=>y[1].length-x[1].length||x[0].localeCompare(y[0])).forEach(([t,arr])=>{const st=arr.filter(v=>v.s).sort((x,y)=>x.ms-y.ms);const s=st.length?st[st.length-1].s:null;if(s==='睇好')bull.push(t);else if(s==='睇淡')bear.push(t);else mentioned.push(t)});
 return {name:i.name||NAMES[a]||a,handle:a,avatar:(i.avatar&&/^data:image\//.test(i.avatar))?i.avatar:null,type:TYPE[i.type]?i.type:'opinion',typeKnown:!!TYPE[i.type],bio:i.bio||null,bull,bear,mentioned,n:aps.length}}
function accChips(a,c,max){max=max||3;return a.slice(0,max).map(t=>`<a class="tk ${c}" href="#stock/${encodeURIComponent(t)}">${esc(t)}</a>`).join('')+(a.length>max?`<span class="tk more" title="${esc(a.slice(max).join('、'))}">+${a.length-max}</span>`:'')}
function accCard(d,label){const has=d.bull.length||d.bear.length;const av=d.avatar?`<img class="av" src="${esc(d.avatar)}" alt="">`:`<div class="av" aria-hidden="true">${esc(Array.from(d.name.replace(/^[^\p{L}\p{N}]+/u,''))[0]||'@').toUpperCase()}</div>`;
 const body=has?`<div class="row"><span class="lb bull">看多</span>${d.bull.length?accChips(d.bull,'bull'):`<span class="none">${label}沒有明確看多貼文</span>`}</div><div class="row"><span class="lb bear">看空</span>${d.bear.length?accChips(d.bear,'bear'):`<span class="none">${label}沒有明確看空貼文</span>`}</div>`
  :`<div class="quiet">${label}沒有明確看多或看空的標的</div><div class="row"><span class="lb men">${label}提及</span>${d.mentioned.length?accChips(d.mentioned,'men'):`<span class="none">${label}沒有提及</span>`}</div>`;
 const href='#account/'+encodeURIComponent(d.handle);
 return `<article class="acc" tabindex="0" role="link" data-href="${href}" aria-label="@${esc(d.handle)} 的觀點"><div class="acc-top">${av}<div><div class="nmrow"><span class="nm" title="${esc(d.name)}">${esc(d.name)}</span><a class="xlink" href="https://x.com/${encodeURIComponent(d.handle)}" target="_blank" rel="noopener">X 個人頁 ↗</a></div><div class="hdl">@${esc(d.handle)} <span class="n">· ${d.n} 篇</span></div></div><span class="type ${d.type}"${d.typeKnown?'':' title="尚未有帳號分類，預設為觀點帳號"'}>${TYPE[d.type]}</span></div>
${d.bio?`<p class="bio" title="${esc(d.bio)}">${esc(d.bio)}</p>`:'<div class="acc-div"></div>'}${body}<a class="go" href="${href}" aria-label="查看 @${esc(d.handle)} 的觀點">›</a></article>`}
function accountCards(posts,vs,label){const g=groupBy(posts.filter(p=>!p.folded_into),acct);if(!g.size)return '';
 const cards=[...g.entries()].map(([a,aps])=>cardData(a,aps,vs)).sort((x,y)=>((y.bull.length+y.bear.length)>0)-((x.bull.length+x.bear.length)>0)||y.n-x.n||x.handle.localeCompare(y.handle));
 return `<section class="acc-sec"><div class="acc-head"><h2>${cards.length} 個帳號・${label}動態</h2><small>點選卡片查看帳號觀點</small></div><div class="acc-grid">${cards.map(d=>accCard(d,label)).join('')}</div></section>`}
function bindCards(){document.querySelectorAll('.acc[data-href]').forEach(el=>{el.addEventListener('click',e=>{if(e.target.closest('a'))return;location.hash=el.dataset.href});el.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target===el)location.hash=el.dataset.href})})}
// ===== 每日 =====
function vDaily(){const days=D.days.map(d=>d.day);if(!days.length)return emptyBox('目前沒有任何貼文資料。');
 let i=days.length-1;const used=[days[i]];const vcount=ds=>P.filter(p=>ds.includes(p.day)&&valid(p)).length;let merged=false;
 while(vcount(used)<MIN_POSTS&&i>0){i--;used.unshift(days[i]);merged=true}
 const prevDay=i>0?days[i-1]:null;const posts=P.filter(p=>used.includes(p.day));const vposts=posts.filter(valid);const prevPosts=prevDay?P.filter(p=>p.day===prevDay):[];
 const vs=views(posts),pvs=views(prevPosts);const st=tickerStats(vs),pst=tickerStats(pvs);
 const ac=windowAccts(posts.filter(p=>!p.folded_into));const nb=vs.filter(v=>v.s==='睇好').length,ns=vs.filter(v=>v.s==='睇淡').length,nu=vs.filter(v=>!v.s).length;const stanced=vposts.filter(p=>p.stance).length;
 const dd=(a,b)=>prevDay?`<span class="d">${arrow(a-b)} 對比 ${esc(prevDay.slice(5))}</span>`:'<span class="d">無前一日可比較</span>';
 const lastMeta=D.days[D.days.length-1];
 let h=`<p class="range">分析範圍：<b>${rangeStr(vposts.length?vposts:posts)}</b>（批次日 ${used.map(esc).join('、')}，有效貼文 ${vposts.length} 篇${posts.length-vposts.length?`；另 ${posts.length-vposts.length} 篇為附圖或非市場內容，不計入`:''}）`+
 (merged?` <span class="fb">當日有效貼文少於 ${MIN_POSTS} 篇，已合併 ${used.map(d=>esc(d.slice(5))).join(' 至 ')} 的資料</span>`:'')+(vposts.length<MIN_POSTS&&!merged?` <span class="fb">有效貼文少於 ${MIN_POSTS} 篇，且沒有更早的資料可合併，結論參考價值有限</span>`:'')+
 `<br>資料天數：目前共 ${days.length} 個批次日（${esc(days[0])}${days.length>1?' – '+esc(days[days.length-1]):''}）${lastMeta.coverage_start_hkt?`；最新批次抓取範圍 ${hk(lastMeta.coverage_start_hkt,true)} – ${hk(lastMeta.coverage_end_hkt||lastMeta.cutoff_hkt,true)} HKT`:''}</p>`;
 h+=`<div class="kpis"><div class="kpi"><small>有效貼文</small><b>${vposts.length}</b>${dd(vposts.length,prevPosts.filter(valid).length)}</div><div class="kpi"><small>有動態帳號</small><b>${ac.size}</b><span class="d">／追蹤 ${HTOT}</span></div><div class="kpi"><small>被提及股票</small><b>${st.size}</b>${dd(st.size,pst.size)}</div><div class="kpi"><small>睇好觀點</small><b class="up">${nb}</b><span class="d">按「帖×股票」計</span></div><div class="kpi"><small>睇淡觀點</small><b class="dn">${ns}</b><span class="d">按「帖×股票」計</span></div><div class="kpi"><small>未表態</small><b>${nu}</b><span class="d">已表態貼文 ${stanced}／${vposts.length}</span></div></div>`;
 const sm=summaryBox('daily','今日市場分析',used[used.length-1]);const br=(D.briefings||[]).filter(b=>used.includes(b.date)).slice(-1)[0];
 h+=`<section class="brief"><h2>今日市場分析<small>${sm.src}</small></h2>${sm.html}${br?`<details><summary>分析師簡報（${esc(br.file)}）</summary>${br.html}</details>`:''}</section>`;
 h+=accountCards(posts,vs,merged?'本期':'今日');
 // 共同立場
 const con=[...st.values()].filter(r=>r.b>=2),bear=[...st.values()].filter(r=>r.s>=2);
 const shared=`<div class="box"><h3>明確共同立場<small>≥2 個帳號同一立場</small></h3>${con.length||bear.length?`${con.length?`<p><span class="pill p-con">共同睇好</span> ${con.map(r=>`${tk(r.t)}（${r.b} 個帳號）`).join('、')}</p>`:''}${bear.length?`<p><span class="pill p-bear">共同睇淡</span> ${bear.map(r=>`${tk(r.t)}（${r.s} 個帳號）`).join('、')}</p>`:''}`:emptyBox('本期沒有任何股票獲 ≥2 個帳號表達同一立場。')}</div>`;
 // 關注度變化
 let chgH='';if(prevDay){const ups=[...st.values()].map(r=>({t:r.t,d:r.mentions-(pst.get(r.t)?pst.get(r.t).mentions:0),n:!pst.get(r.t)}));const gone=[...pst.values()].filter(r=>!st.has(r.t));
  chgH=`<div class="box"><h3>關注度變化<small>對比 ${esc(prevDay)}</small></h3>${ups.filter(x=>x.d>0).length?`<p>升溫：${ups.filter(x=>x.d>0).sort((a,b)=>b.d-a.d).map(x=>`${tk(x.t)} ${arrow(x.d,x.n)}`).join('、')}</p>`:''}${ups.filter(x=>x.d<0).length?`<p>降溫：${ups.filter(x=>x.d<0).map(x=>`${tk(x.t)} ${arrow(x.d)}`).join('、')}</p>`:''}${gone.length?`<p>本期未再提及：${gone.map(r=>tk(r.t)).join('、')}</p>`:''}${!ups.some(x=>x.d)&&!gone.length?emptyBox('關注度與前一日相同。'):''}</div>`}
 else chgH=`<div class="box"><h3>關注度變化</h3>${emptyBox(`目前只有 ${days.length} 個批次日的資料${merged?'（且已全部合併使用）':''}，未能與前一日比較。`)}</div>`;
 // 沒有提及股票的活躍帳號
 const noT=[...ac].filter(a=>!vs.some(v=>v.a===a)).sort();
 const kp=keyPosts(posts);const top=kp.slice(0,8),rest=kp.slice(8);
 h+=`<div class="cols"><div><div class="box"><h3>關注度排行<small>點一行看個股深入分析</small></h3>${attTable(st,{prev:pst,hasPrev:!!prevDay})}<div class="legend">「帳號立場」以每個帳號在範圍內最近一次表態計；未表態＝有提及但分析師未標立場（或尚未有 stance 資料）。</div></div>

function dataDaysNote(posts,n){const bd=[...new Set(posts.map(p=>p.day))].sort();const pd=[...new Set(posts.filter(valid).map(hkDate))].sort();
 return {bd,pd,html:bd.length<Math.min(n,3)?`<div class="note">目前只有 ${bd.length} 個批次日的資料（${bd.map(esc).join('、')||'無'}；貼文橫跨 ${pd.length} 個 HKT 日曆日）。以下按現有資料計算，趨勢、變化與一致性需累積更多天數才有意義。</div>`:''}}
function heatBars(vs,start,end){const ds=[];for(let t=start+DAY;t<=end+DAY-1;t+=DAY){ds.push(new Date(t+8*36e5).toISOString().slice(0,10))}const dset=[...new Set(ds)].slice(-28);
 const g=groupBy(vs,v=>hkDate(v.p));const mx=Math.max(1,...dset.map(d=>(g.get(d)||[]).length));
 return `<div class="bars">${dset.map(d=>{const a=g.get(d)||[];const c=k=>a.filter(v=>k==='u'?!v.s:v.s===k).length;const hh=x=>x/mx*110;return `<div class="col" title="${d}：提及 ${a.length}（好 ${c('睇好')} / 中 ${c('中性')} / 淡 ${c('睇淡')} / 未 ${c('u')}）"><i class="b" style="height:${hh(c('睇好'))}px"></i><i class="m" style="height:${hh(c('中性'))}px"></i><i class="n" style="height:${hh(c('u'))}px"></i><i class="s" style="height:${hh(c('睇淡'))}px"></i></div>`}).join('')}</div><div class="bl">${dset.map(d=>`<span>${d.slice(5)}</span>`).join('')}</div><div class="legend">按發帖日期（HKT）計每日提及次數；綠＝睇好、灰＝中性、淺灰＝未表態、紅＝睇淡。</div>`}
function changeList(vs){const out=[];groupBy(vs,v=>v.a+'|'+v.t).forEach(arr=>{arr.sort((x,y)=>x.ms-y.ms);changesOf(arr.filter(v=>v.s)).forEach(c=>out.push(c))});out.sort((a,b)=>b.to.ms-a.to.ms);

function acctFocus(posts,vs){const g=groupBy(posts.filter(valid),acct);if(!g.size)return emptyBox('期內沒有帳號發帖。');const rows=[...g.entries()].sort((a,b)=>b[1].length-a[1].length||a[0].localeCompare(b[0]));

 const th=[...groupBy(ps.filter(p=>p.theme),p=>p.theme).entries()].sort((x,y)=>y[1].length-x[1].length).map(x=>`<span class="chip">${esc(x[0])}</span>`).join(' ');return `<tr><td>${hd(a)}</td><td class="num">${ps.length}</td><td>${tl||'<span class="flat">未提及股票</span>'}</td><td><div class="tags">${th}</div></td></tr>`}).join('')}</tbody></table></div>`}

 const W=Math.max(300,el.clientWidth||700),H=W<500?220:270,L=W<500?44:56,R=12,T=34,B=26;const xs=data.map(r=>Date.parse(r[0])),ys=data.map(r=>r[1]);
 const x0=xs[0],x1=xs[xs.length-1];let y0=Math.min(...ys),y1=Math.max(...ys);
 const vs=views(P).filter(v=>v.t===t).map(v=>{let pv=v.p.price_at_post&&v.p.price_at_post[t]!=null?parseFloat(v.p.price_at_post[t]):null;const r=closeOn(t,v.p.date_et);return {v,date:r?r[0]:null,y:pv!=null&&!isNaN(pv)?pv:(r?r[1]:null),fromPost:pv!=null&&!isNaN(pv)}}).filter(m=>m.date&&Date.parse(m.date)>=x0&&m.y!=null);
 vs.forEach(m=>{y0=Math.min(y0,m.y);y1=Math.max(y1,m.y)});const pad=(y1-y0)*.06||1;y0-=pad;y1+=pad;
 const sx=x=>L+(x-x0)/(x1-x0||1)*(W-L-R),sy=y=>T+(1-(y-y0)/(y1-y0))*(H-T-B);
 const pts=data.map(r=>sx(Date.parse(r[0])).toFixed(1)+','+sy(r[1]).toFixed(1)).join(' ');
 let g='';for(let i=0;i<=4;i++){const yv=y0+(y1-y0)*i/4,yy=sy(yv);g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text class="ax" x="${L-6}" y="${yy+4}" text-anchor="end">${yv>=1000?Math.round(yv).toLocaleString('en-US'):yv.toFixed(yv<10?2:1)}</text>`}
 const xl=[0,Math.floor(data.length/2),data.length-1].map((i,k)=>`<text class="ax" x="${sx(xs[i])}" y="${H-6}" text-anchor="${['start','middle','end'][k]}">${data[i][0]}</text>`).join('');
 const col=s=>s==='睇好'?'bull':s==='睇淡'?'bear':'neu';const byX=groupBy(vs,m=>m.date);let mk='',k=0;
 [...byX.entries()].sort((a,b)=>a[0].localeCompare(b[0])).forEach(([d,ms])=>{const xx=sx(Date.parse(d));const lab=[...new Set(ms.map(m=>'@'+m.v.a))].join(' ');const s0=ms.find(m=>m.v.s)||ms[0];const ly=12+(k%2)*13;k++;
  mk+=`<g><line class="vl ${col(s0.v.s)}" x1="${xx}" x2="${xx}" y1="${T-6}" y2="${H-B}"/>${ms.map((m,j)=>`<circle class="mk ${col(m.v.s)}" cx="${xx}" cy="${sy(m.y)}" r="5.5"><title>${esc(m.date)} @${esc(m.v.a)}：${esc(m.v.s||'未表態')}｜${m.fromPost?'發帖時股價':'收市'} ${m.y}</title></circle>`).join('')}<text class="lab" x="${Math.min(xx+4,W-R)}" y="${ly}" text-anchor="${xx>W*0.8?'end':'start'}">${esc(lab)}</text></g>`});
 el.innerHTML=`<svg class="chart" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="$${esc(t)} 股價走勢">${g}<polygon class="ar" points="${sx(x0)},${H-B} ${pts} ${sx(x1)},${H-B}"/><polyline class="ln" points="${pts}"/>${mk}${xl}</svg>${vs.length?'':`<div class="legend">此區間內沒有可標示的觀點。</div>`}`}

// ===== 帳號頁 =====
function vAccount(a){const ps=P.filter(p=>acct(p)===a);const tracked=(D.meta.handles||[]).some(h=>h.toLowerCase()===a.toLowerCase());
 if(!ps.length)return `<a class="back" href="#daily">← 返回儀表板</a><div class="dhead"><h2 class="acct-h">@${esc(a)}</h2></div>${emptyBox(tracked?'此帳號在現有資料範圍內沒有貼文。':'找不到此帳號。')}`;
 const vs=views(ps);const at=groupBy(vs,v=>v.t);const vp=ps.filter(valid);
 const trows=[...at.entries()].sort((x,y)=>y[1].length-x[1].length).map(([t,arr])=>{arr.sort((x,y)=>x.ms-y.ms);const st=arr.filter(v=>v.s);const cur=st[st.length-1]||null,prev=st.length>1?st[st.length-2]:null;return `<tr class="click" data-href="#stock/${encodeURIComponent(t)}"><td>${tk(t)}</td><td class="num">${arr.length}</td><td>${pill(cur?cur.s:null,cur&&cur.star)}</td><td>${chgLabel({cur,prev})}</td><td>${st.map(v=>`<span title="${hk(v.p.time_hkt)}">${pill(v.s,v.star)}</span>`).join(' ')||'<span class="flat">未表態</span>'}</td><td class="num">${hk(arr[arr.length-1].p.time_hkt)}</td></tr>`}).join('');
 const ai=accInfo(a),cd=cardData(a,ps,vs);
 return `<a class="back" href="#daily">← 返回儀表板</a><div class="dhead">${cd.avatar?`<img class="av" src="${esc(cd.avatar)}" alt="">`:`<div class="av" aria-hidden="true">${esc(Array.from(cd.name)[0]||'@').toUpperCase()}</div>`}<h2 class="acct-h">${esc(cd.name)}</h2><span class="nm">@${esc(a)}</span><span class="tpill ${cd.type}">${TYPE[cd.type]}</span><a href="https://x.com/${encodeURIComponent(a)}" target="_blank" rel="noopener">X 個人頁 ↗</a></div>${ai.bio?`<p class="abio">${esc(ai.bio)}</p>`:''}
<div class="kpis" style="margin-top:12px"><div class="kpi"><small>貼文</small><b>${ps.length}</b><span class="d">有效 ${vp.length}</span></div><div class="kpi"><small>提及股票</small><b>${at.size}</b></div><div class="kpi"><small>已表態貼文</small><b>${vp.filter(p=>p.stance).length}</b></div><div class="kpi"><small>資料範圍</small><b style="font-size:1rem">${rangeStr(ps)}</b></div></div>
<div class="cols"><div class="box"><h3>貼文<small>最新在上</small></h3>${ps.filter(p=>!p.folded_into).map(p=>postCard(p)).join('')}</div>
<div class="box"><h3>股票與立場歷史</h3>${trows?`<div class="scroll"><table><thead><tr><th>股票</th><th class="num">提及</th><th>目前</th><th>變化</th><th>歷次表態（舊→新）</th><th class="num">最近</th></tr></thead><tbody>${trows}</tbody></table></div>`:emptyBox('此帳號在現有資料中沒有提及股票代號。')}</div></div>`}

// ===== 頁首／頁尾／路由 =====
function header(){const m=D.meta;const st=m.stance;$('#hsub').innerHTML=`資料截止：<span class="cut">${m.cutoff_hkt?hk(m.cutoff_hkt,true)+' HKT':'資料不足'}</span> · 追蹤 ${HTOT} 個 X 帳號 · 頁面產生 ${esc(m.generated_hkt)} HKT`;
 const srcs=groupBy(Object.entries(PR).filter(([t])=>!UNC(t)),([t,p])=>p.source);const asof=Object.values(PR).map(p=>p.as_of).filter(Boolean).sort();const fet=Object.values(PR).map(p=>p.fetched_hkt).filter(Boolean).sort();
 $('#foot').innerHTML=`<p><b>免責聲明：</b>所有內容整理自被追蹤帳號的公開貼文，只反映帳號本身的說法；任何「資金流向」或「交易紀錄」均為「據貼文所述」，未經查證。本頁不構成投資建議。</p>
<p>立場資料：${st.files.length?`分析師標示（${st.files.map(esc).join('、')}，對應 ${st.matched} 篇貼文）；沒有標示立場的貼文一律列為「未表態」。`:'尚未有分析師立場資料（stance/*.json），所有貼文暫列為「未表態」。'}</p>
<p>股價：${Object.keys(PR).length?[...srcs.entries()].map(([s,arr])=>`${esc(s)}（${arr.map(x=>'$'+esc(x[0])).join(' ')}）`).join('；')+` 日收市價，截至 ${esc(asof[asof.length-1]||'—')}（美東交易日），抓取於 ${esc(fet[fet.length-1]||'—')} HKT`:'沒有任何股價資料'}${m.price_missing.length?`；無股價資料：${m.price_missing.map(t=>'$'+esc(t)).join(' ')}`:''}${Object.keys(OV).filter(UNC).length?`；代號未確認（不顯示股價）：${Object.keys(OV).filter(UNC).map(t=>'$'+esc(t)).join(' ')}`:''}。股價僅供對照，可能有延遲。</p>
<p>時間均為香港時間（HKT, UTC+8）。資料批次：${D.days.map(d=>esc(d.day)+'（'+d.n_posts+' 篇）').join('、')||'無'}。</p>`;
 const opts=[...new Set(P.flatMap(p=>p.tickers))].sort().map(t=>`<option value="$${esc(t)}">`).concat([...new Set(P.map(acct))].sort().map(a=>`<option value="@${esc(a)}">`));$('#sl').innerHTML=opts.join('')}
function go(q){q=(q||'').trim();if(!q)return;if(q[0]==='@')location.hash='#account/'+encodeURIComponent(q.slice(1));else location.hash='#stock/'+encodeURIComponent(q.replace(/^\$/,'').toUpperCase())}
let resizeT=null;
function render(){const h=decodeURIComponent(location.hash.replace(/^#\/?/,''));const [v,arg]=[h.split('/')[0]||'daily',h.split('/').slice(1).join('/')];const main=$('#main');let view=v;
 try{if(v==='stock'&&arg){if(chartState.t!==arg.toUpperCase()){chartState={t:arg.toUpperCase(),range:'1y'}}main.innerHTML=vStock(arg.toUpperCase());drawChart(arg.toUpperCase());
   const rb=$('#rbtn');if(rb)rb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;chartState.range=b.dataset.r;rb.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));drawChart(chartState.t)})}
  else if(v==='account'&&arg)main.innerHTML=vAccount(arg);
  else if(v==='weekly')main.innerHTML=vWeekly();else if(v==='monthly')main.innerHTML=vMonthly();else{view='daily';main.innerHTML=vDaily()}}
 catch(e){main.innerHTML=emptyBox('頁面產生錯誤：'+esc(e.message));console.error(e)}
 document.querySelectorAll('#tabs a').forEach(a=>a.setAttribute('aria-selected',a.dataset.v===view));bindRows();bindCards();document.title=({daily:'每日',weekly:'每週',monthly:'每月',stock:'$'+(arg||'').toUpperCase(),account:'@'+arg}[view]||'')+'｜市場共識儀表板'}
header();render();
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
addEventListener('resize',()=>{clearTimeout(resizeT);resizeT=setTimeout(()=>{if(chartState.t&&location.hash.startsWith('#stock/'))drawChart(chartState.t)},150)});
$('#sf').addEventListener('submit',e=>{e.preventDefault();go($('#sq').value);$('#sq').value='';$('#sq').blur()});
$('#sq').addEventListener('change',e=>{const v=e.target.value;if(/^[@$]/.test(v)){go(v);e.target.value=''}});
</script></body></html>
