90092322872\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6），講下一代記憶體競爭唔可以單靠微縮：3D DRAM 喺製造同檢測兩方面都有瓶頸，而將記憶體單元同周邊電路分開造再接合，會改變競爭嘅基礎。呢篇係技術討論，冇講個股好淡。<\/p>\n<p><strong>分歧：<\/strong> 今日冇明顯分歧嘅股票。<a href=\"https://x.com/aleabitoreddit\" target=\"_blank\" rel=\"noopener\">@aleabitoreddit<\/a>（<a href=\"https://x.com/aleabitoreddit/status/2107143846027268373\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）講 <a class=\"tk\" href=\"#stock/AAOI\">$AAOI<\/a> 終於完成 6 億美元「按市價增發」（ATM），公司公告共賣出約 569 萬股，均價 $105.36。佢之前批評公司 4 月、6 月、8 月接連增發，喺 $100、$150、$200 呢啲價位都有約 6 億美元沽壓，令股價突破唔到。不過佢覺得 AAOI 營運上 2027 年好強，光模組月收入 4.71 億美元，2028 年每月仲有 40 萬個 ELSFP，收入爬升快到可以將預測市盈率壓到單位數。所以佢話只要公司唔再增發，AAOI 應該會跑贏 <a class=\"tk\" href=\"#stock/LITE\">$LITE<\/a>。呢個係有條件嘅相對比較，唔係睇淡 LITE；AAOI 市值亦唔喺股票池（≥$50B）入面。<\/p>\n<p><strong>值得留意：<\/strong> AI 訂閱成本成為話題。<a href=\"https://x.com/insane_analyst\" target=\"_blank\" rel=\"noopener\">@insane_analyst<\/a>（<a href=\"https://x.com/insane_analyst/status/2107244864333361207\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）話 AI 月費訂閱仲係大幅補貼緊。佢附圖顯示，同樣係 $200 月費，按 API 價計（以 agentic 工作量計），ChatGPT Pro 大約值 $2,084（10.4 倍），Claude Max 20x 大約值 $11,726（58.6 倍）。佢反問：喺供應極度緊張嘅市場，補貼越高係好事定壞事？冇補貼嘅話，年度經常性收入（ARR）仲會唔會升得咁快？<a href=\"https://x.com/dylan522p\" target=\"_blank\" rel=\"noopener\">@dylan522p<\/a>（<a href=\"https://x.com/dylan522p/status/2107259067693748373\" target=\"_blank\" rel=\"noopener\">原帖<\/a>・10/6）亦話 Anthropic、OpenAI 等公司嘅訂閱俾用戶嘅價值差距好大，佢哋測試咗 Meta、Minimax、Kimi、Grok 同 Cursor 嘅訂閱。兩位都冇講個股。<\/p>\n<p>今日係第一日資料，17 則入面只有 5 則有明確好淡判斷，未有立場變化可以比較。<\/p>\n<p>內容來自被追蹤帳號公開貼文，非投資建議。<\/p>","range":"有效資料不足（共 17 則），分析合併 10/5–10/6 兩天（10/5 08:31 至 10/6 18:19 HKT）","mtime_hkt":"2026-10-06 19:00"}],"weekly":[],"monthly":[]},"briefings":[{"date":"2026-10-06","html":"<h3>X 投資帖簡報：2026-10-06（HKT）<\/h3>\n<p>涵蓋時間：2026-10-05 08:31 至 2026-10-06 18:19 HKT。共 17 篇帖，其中 7 篇有 ticker。<br>團隊範圍：美股普通股、市值 ≥ $50B、只做現金長倉、唔做 ETF。<br>市值係 2026-10-05 收市數，已經喺網上核實（stockanalysis／companiesmarketcap／Nasdaq）。<\/p>\n<h4>按 ticker 分<\/h4>\n<h5>< function stanceOf(p,t){if(p.stance_by_ticker&&typeof p.stance_by_ticker==='object')return {s:S_OF[p.stance_by_ticker[t]]||'none',star:false};if(!p.stance)return {s:'none',star:false};return {s:S_OF[p.stance]||'none',star:p.tickers.length>1}}
const POSTS=[];ALLP.filter(valid).forEach(p=>p.tickers.forEach(t=>{const r=stanceOf(p,t);POSTS.push({p,t,acc:p.acc,s:r.s,star:r.star,ms:p.ms,d:p.date,kind:p.basis||null,why:p.summary_zh||'',url:p.url})}));

const explicit=s=>s==='bull'||s==='bear';

// ---------- 計算（對應設計稿 postsIn / latest / prevStance / change / dist / agreeLabel / dailyWindow） ----------
const postsIn=(from,to)=>POSTS.filter(x=>x.d>=from&&x.d<=to);

function latest(acc,t,from,to){let r=null;for(const x of postsIn(from,to))if(x.acc===acc&&x.t===t&&(!r||x.ms>=r.ms))r=x;return r}
function prevStance(acc,t,beforeMs){let r=null;for(const x of POSTS)if(x.acc===acc&&x.t===t&&x.ms<beforeMs&&stanced(x.s)&&(!r||x.ms>r.ms))r=x;return r}
function change(prev,cur){if(!prev||!cur||!stanced(cur.s)||prev.s===cur.s)return null;if(explicit(prev.s)&&explicit(cur.s))return '反轉';const rank={bear:0,neu:1,bull:2};return rank[cur.s]>rank[prev.s]?'轉強':'轉弱'}

function accsOf(from,to){return [...new Set(POSTS.filter(x=>x.d>=from&&x.d<=to).map(x=>x.acc))]}

function agreeLabel(c){const tot=c.bull+c.bear+c.neu+c.none;if(tot<2)return {l:'樣本不足',k:'neu'};if(c.bull>=1&&c.bear>=1&&Math.min(c.bull,c.bear)/Math.max(c.bull,c.bear)>=.5)return {l:'明顯分歧',k:'chg'};const r=Math.abs(c.bull-c.bear)/tot;if(r>=.6)return {l:c.bull>c.bear?'高度一致看多':'高度一致看空',k:c.bull>c.bear?'bull':'bear'};return {l:'部分一致',k:'neu'}}
function dailyWindow(){const n=rawIn(TODAY,TODAY).filter(valid).length;const y=addDays(TODAY,-1);const hasPrev=ALLP.some(p=>p.date<TODAY);return n<MIN_POSTS&&hasPrev?{from:y,to:TODAY,merged:true,n}:{from:TODAY,to:TODAY,merged:false,n}}

 const W=Math.max(300,el.clientWidth||760),H=W<500?220:250,L=W<500?44:52,R=10,T=34,B=22;const xs=data.map(r=>Date.parse(r[0])),ys=data.map(r=>r[1]);const x0=xs[0],x1=xs[xs.length-1];let y0=Math.min(...ys),y1=Math.max(...ys);
 const marks=POSTS.filter(x=>x.t===t).map(x=>{const pv=x.p.price_at_post&&x.p.price_at_post[t]!=null&&!(OV[t]&&OV[t].symbol&&OV[t].symbol!==t)?parseFloat(x.p.price_at_post[t]):NaN;// 覆寫報價代號時不用分析師記錄的價（可能是同名美股）
const r=closeOn(t,x.p.date_et);return {x,date:r?r[0]:null,y:!isNaN(pv)?pv:(r?r[1]:null),fromPost:!isNaN(pv)}}).filter(m=>m.date&&Date.parse(m.date)>=x0&&m.y!=null);
 marks.forEach(m=>{y0=Math.min(y0,m.y);y1=Math.max(y1,m.y)});const pad=(y1-y0)*.06||1;y0-=pad;y1+=pad;
 const sx=v=>L+(v-x0)/(x1-x0||1)*(W-L-R),sy=v=>T+(1-(v-y0)/(y1-y0))*(H-T-B);const pts=data.map(r=>sx(Date.parse(r[0])).toFixed(1)+','+sy(r[1]).toFixed(1)).join(' ');
 let g='';for(let i=0;i<=3;i++){const v=y0+(y1-y0)*i/3,yy=sy(v);g+=`<line class="g" x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}"/><text x="${L-6}" y="${yy+3}" text-anchor="end">${v>=1000?Math.round(v).toLocaleString('en-US'):v.toFixed(v<10?2:1)}</text>`}

function render(){const h=decodeURIComponent((location.hash||'#daily').slice(1));
 const ms=h.match(/^stock[\/-](.+)$/),ma=h.match(/^account\/(.+)$/);
 if(ms||ma){if(!document.getElementById('view').innerHTML)drawView();try{ms?openDive(ms[1].toUpperCase()):openAccount(ma[1])}catch(e){console.error(e);document.getElementById('dive').innerHTML='<div class="wrap">'+empty('畫面顯示錯誤：'+esc(e.message))+'</div>';showDive(document.getElementById('dive'))}return}
 closeDive();current=VIEWS[h]?h:'daily';drawView()}
function drawView(){document.querySelectorAll('nav.tabs button').forEach(b=>b.setAttribute('aria-selected',b.dataset.v===current));
 try{document.getElementById('view').innerHTML=VIEWS[current]();linkHandles(document.getElementById('view'))}catch(e){console.error(e);document.getElementById('view').innerHTML=empty('畫面顯示錯誤：'+esc(e.message))}}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tk]');if(b){e.preventDefault();location.hash='stock/'+b.dataset.tk;return}
 const v=e.target.closest('nav.tabs button');if(v){location.hash=v.dataset.v;return}
 const card=e.target.closest('.acc[data-href]');if(card&&!e.target.closest('a,button')){location.hash=card.dataset.href}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('dive').hidden){location.hash=current;return}const card=e.target.closest&&e.target.closest('.acc[data-href]');if(card&&e.key==='Enter'&&e.target===card)location.hash=card.dataset.href});
window.addEventListener('hashchange',render);
let rT=null;window.addEventListener('resize',()=>{clearTimeout(rT);rT=setTimeout(()=>{const m=decodeURIComponent(location.hash.slice(1)).match(/^stock[\/-](.+)$/);if(m)drawChart(m[1].toUpperCase())},150)});
// 頁首
(function header(){const m=D.meta;document.getElementById('cutoff').textContent=m.cutoff_hkt?m.cutoff_hkt.slice(0,10)+' '+m.cutoff_hkt.slice(11,16)+'（HKT）':'資料不足';
 const slots=m.update_slots_hkt||[];const now=Date.now(),base=Math.max(now,Date.parse((m.generated_hkt||'').replace(' ','T')+':00+08:00')||0);let next=null;
 for(let k=0;k<3&&!next;k++){const d=hkDate(base+k*DAY);for(const s of slots){const t=Date.parse(`${d}T${s}:00+08:00`);if(t>base){next=t;break}}}
 document.getElementById('nextup').textContent=next?`${hkDate(next)} ${hm(next)}（預定）`:'—';
 document.getElementById('acccount').textContent=(D.tracked&&D.tracked.accounts&&D.tracked.accounts.length)||HANDLES.length;
 const srcs={};Object.entries(D.prices).filter(([t])=>!UNC(t)&&isUS(t)).forEach(([t,p])=>(srcs[p.source]=srcs[p.source]||[]).push('$'+t));const asof=Object.entries(D.prices).filter(([t])=>isUS(t)).map(([,p])=>p.as_of).sort().pop();
 const nonUS=Object.entries(D.prices).filter(([t])=>!UNC(t)&&!isUS(t)).map(([t,p])=>`$${esc(t)} 以 ${esc(p.symbol||t)}（${esc((OV[t]&&OV[t].exchange)||p.exchange||'')}，${CURNAME[curOf(t)]||curOf(t)}，${esc(p.source)}，截至 ${esc(p.as_of)} ${tradeDay(t)}）報價，非美股`);const fet=Object.values(D.prices).map(p=>p.fetched_hkt).sort().pop();const unc=Object.keys(OV).filter(UNC);
 document.getElementById('foot').innerHTML=`<p><b>免責聲明：</b>所有內容整理自被追蹤帳號的公開貼文，只反映帳號本身的說法；任何「資金流向」或「交易紀錄」均為「據貼文所述」，未經查證。本頁不構成投資建議。</p>
<p>立場資料：${m.stance.files.length?`由分析師逐篇標示（已標示 ${m.stance.matched} 篇貼文）；沒有標示立場的一律列為「未表態」。`:'尚未有分析師立場資料，所有貼文暫列為「未表態」。'}</p>
<p>股價：${Object.keys(srcs).length?Object.keys(srcs).map(esc).join('、')+` 日收市價，截至 ${esc(asof)}（美東交易日），抓取於 ${esc(fet)} HKT`:'沒有股價資料'}${m.price_missing.length?`；無股價資料：${m.price_missing.map(t=>'$'+esc(t)).join(' ')}`:''}${nonUS.length?'；非美股以當地交易所及貨幣報價（個股頁已標示）':''}。</p>
<p>時間均為香港時間（HKT, UTC+8）。帳號頭像與簡介來自各帳號的 X 個人頁。</p>`;linkHandles(document.getElementById('foot'))})();
render();

</script>
</body></html>
