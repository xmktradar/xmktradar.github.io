<!doctype html><meta charset="utf-8">
<!-- Motion scenes. v6.2 Tape Cats: Canva Tape Take lock 2026-11-05 + PNG cat mouth/cue. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=Noto+Sans+TC:wght@500;700;900&display=block">
<style>
/* === token-bright.css (inlined from design/shorts-maneki/) — Canva DAHaCls9wB8 === */
:root {
  --bg0: #FFF9EE;
  --bg-lilac: #F0E8FF;
  --bg-sky: #E5F7FF;
  --petal-coral: #FF6B8A;
  --petal-apricot: #FFB347;
  --petal-lilac: #B794F6;
  --petal-mint: #5EEAD4;
  --petal-lemon: #FFE066;
  --ink: #3D3D3D;
  --ink-muted: #6e6e73;
  --accent: #F06A4D;
  --lightning: #BAE6FD;
  --badge-bg: #FFE8B8;
  --badge-ink: #E85A3A;
  --bubble-outline: #FFD28A;
  --subline-border: #BAE6FD;
  --card: #fffffff0;
  --ticker: #E8940A;
  --bull: #0A9F5C;
  --bear: #E11D48;
  --safe-top: 120px;
  --safe-bottom: 250px;
  --safe-side: 80px;
}
html,body{margin:0;width:1080px;height:1920px;overflow:hidden}
body{position:relative;font-family:'Inter','Noto Sans TC','Noto Sans CJK TC',sans-serif;background:var(--bg0);color:var(--ink)}
#bg{position:absolute;inset:0;background:var(--bg0);overflow:hidden;z-index:0}
#c{position:absolute;inset:0;z-index:2}
#cat-layer{position:absolute;inset:0;z-index:3;pointer-events:none;overflow:hidden}
.frame-bg{
  position:absolute;inset:0;
  background:
    radial-gradient(90% 70% at 12% 18%, color-mix(in srgb, var(--petal-apricot) 28%, transparent) 0%, transparent 55%),
    radial-gradient(80% 65% at 88% 78%, color-mix(in srgb, var(--petal-lilac) 22%, transparent) 0%, transparent 50%),
    var(--bg0);
}
.scene-open .frame-bg{background:
  radial-gradient(90% 70% at 18% 12%, #FFB34733 0%, transparent 55%),
  radial-gradient(60% 45% at 82% 78%, #BAE6FD44 0%, transparent 50%),
  #FFF9EE}
.scene-split .frame-bg{background:linear-gradient(90deg, #E5F7FF 0 50%, #FFF0F3 50% 100%)}
.scene-m1 .frame-bg{background:
  radial-gradient(80% 60% at 50% 40%, #B794F644 0%, transparent 60%),
  #FFF9EE}
.scene-m2 .frame-bg,.scene-cta .frame-bg{background:#E5F7FF}
.petal{position:absolute;width:42%;height:28%;border-radius:60% 40% 55% 45%;opacity:.22;pointer-events:none;z-index:0;will-change:transform,opacity}
.petal--coral{background:var(--petal-coral)}.petal--apricot{background:var(--petal-apricot)}
.petal--lilac{background:var(--petal-lilac)}.petal--mint{background:var(--petal-mint)}
.petal--lemon{background:var(--petal-lemon)}
.orb{position:absolute;width:55%;height:40%;border-radius:50%;filter:blur(32px);opacity:.28;pointer-events:none;z-index:0;will-change:transform,opacity}
.orb--hook{background:var(--petal-apricot);top:8%;left:-8%}
.orb--quote{background:var(--petal-lilac);bottom:12%;right:-10%}
.orb--mint{background:var(--petal-mint)}.orb--coral{background:var(--petal-coral)}
.orb--lemon{background:var(--petal-lemon)}
.ribbon{position:absolute;height:10px;width:70%;border-radius:999px;opacity:.28;pointer-events:none;z-index:0;
  background:linear-gradient(90deg,var(--petal-mint),var(--petal-lemon),var(--petal-coral));transform:rotate(-18deg)}
.stripe{position:absolute;inset:0;opacity:.06;pointer-events:none;z-index:0;
  background:repeating-linear-gradient(-32deg,#FFB347 0 14px,transparent 14px 36px)}
.dot{position:absolute;border-radius:50%;opacity:.4;pointer-events:none;z-index:0}
.panel{position:absolute;left:var(--safe-side);right:var(--safe-side);background:var(--card);border:1px solid rgba(61,61,61,.08);border-radius:20px;box-shadow:0 12px 40px #1d1d1f14;backdrop-filter:blur(2px);color:var(--ink)}
.safe-type{position:absolute;left:var(--safe-side);right:var(--safe-side);top:200px;bottom:var(--safe-bottom);z-index:4}
.muted{color:var(--ink-muted)}
.amber,.type-ticker{color:var(--ticker)}
.up,.type-bull{color:var(--bull)}
.down,.type-bear{color:var(--bear)}
.mono{font-family:'Inter','Noto Sans TC',ui-monospace,monospace;font-variant-numeric:tabular-nums}
.brand{position:absolute;left:56px;top:56px;display:flex;align-items:center;gap:14px;z-index:5}
.brand img{width:44px;height:44px;border-radius:10px;object-fit:cover;opacity:.92}
.brand .name{font-weight:700;font-size:28px;letter-spacing:.2px;color:var(--ink)}
.brand .date{margin-left:10px;font:600 24px Inter,sans-serif;color:var(--ink-muted)}
/* Canva show badge (swappable Tape Take / Crowd Heat / Week Tape) */
.show-badge{
  position:absolute;left:56px;top:var(--safe-top);z-index:5;
  background:var(--badge-bg);color:var(--badge-ink);
  font:800 34px/1 Inter,sans-serif;letter-spacing:.2px;
  padding:14px 28px;border-radius:18px;box-shadow:0 6px 18px #f06a4d22}
.show-badge .date{margin-left:14px;font:600 24px Inter,sans-serif;color:var(--ink-muted)}
/* Speech bubble / soft starburst */
.speech-bubble-wrap{filter:drop-shadow(0 14px 28px rgba(61,61,61,.12))}
.speech-bubble{
  position:relative;background:#fff;color:var(--ink);
  border:4px solid var(--bubble-outline);border-radius:36px;
  padding:52px 48px 56px;
  box-shadow:0 0 0 10px rgba(255,210,138,.28);
  clip-path:polygon(
    2% 14%, 6% 6%, 14% 10%, 18% 2%, 28% 8%, 36% 0%, 46% 7%, 54% 1%,
    64% 8%, 74% 0%, 82% 9%, 90% 3%, 96% 12%, 100% 22%,
    96% 32%, 100% 42%, 95% 52%, 100% 62%, 94% 72%, 100% 82%, 92% 92%,
    82% 96%, 72% 100%, 62% 94%, 52% 100%, 42% 93%, 32% 100%, 22% 94%,
    12% 100%, 4% 90%, 0% 78%, 5% 66%, 0% 54%, 6% 42%, 0% 30%, 5% 20%
  );
}
.speech-bubble .hookQ,.hookQ{
  font-weight:800;font-size:56px;line-height:1.18;letter-spacing:-.8px;
  font-style:italic;color:var(--ink)}
.speech-bubble .hookQ .accent,.hookQ .accent{color:var(--accent);font-style:italic}
.subline{
  background:#fff;border:3px solid var(--subline-border);border-radius:18px;
  padding:22px 28px;box-shadow:0 8px 24px #3d3d3d12;
  font:700 32px/1.35 Inter,sans-serif;color:var(--ink);max-width:520px}
.subline .punch{color:var(--accent);display:block;margin-top:4px}
.lightning{position:absolute;z-index:1;pointer-events:none;color:var(--lightning);opacity:.95;
  filter:drop-shadow(0 4px 10px #bae6fd88)}
.lightning--tr{top:140px;right:48px;width:120px;height:180px}
.lightning--bl{bottom:200px;left:36px;width:100px;height:150px;transform:scaleY(-1) rotate(18deg)}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:24px}
.tk{font-weight:800;letter-spacing:-2px}
.num{font-weight:800;letter-spacing:-1px}
.label{font-weight:600;font-size:28px;color:var(--ink-muted);text-transform:uppercase;letter-spacing:1.5px}
.card{background:var(--card);color:var(--ink);border:1px solid rgba(61,61,61,.08);border-radius:16px;padding:28px 32px;box-shadow:0 8px 28px #1d1d1f10}
.parable-line,.quote-line{font-size:40px;font-weight:600;line-height:1.35;margin:10px 0;color:var(--ink-muted)}
.quote-handle{font-weight:800;font-size:56px;letter-spacing:-1px;margin:8px 0 20px}
.stance-pill{display:inline-block;font:700 26px Inter,sans-serif;letter-spacing:1px;text-transform:uppercase;padding:8px 18px;border-radius:999px;border:1px solid currentColor}
.type{color:var(--ink)}
.cat-host{
  position:absolute;bottom:48px;right:24px;width:420px;height:480px;
  display:flex;align-items:flex-end;justify-content:center;
  transform-origin:50% 90%;will-change:transform}
.cat-host--left{right:auto;left:24px}
.cat-host--center{left:50%;right:auto;transform:translateX(-50%);width:460px}
.cat-host img.cat-body{
  width:100%;height:auto;max-height:480px;object-fit:contain;
  filter:drop-shadow(0 18px 28px rgba(29,29,31,.18));
  user-select:none;-webkit-user-drag:none}
.cat-host img.cat-mouth{
  position:absolute;left:0;right:0;bottom:0;width:100%;height:auto;max-height:480px;
  object-fit:contain;opacity:0;pointer-events:none}
@keyframes cat-bob {
  0%,100%{transform:translateY(0) rotate(-1.5deg)}
  50%{transform:translateY(-10px) rotate(1.5deg)}
}
.cat-host.bobbing{animation:cat-bob 2.4s ease-in-out infinite}
.cat-host.bobbing.cat-host--center{animation-name:cat-bob-center}
@keyframes cat-bob-center {
  0%,100%{transform:translateX(-50%) translateY(0) rotate(-1.5deg)}
  50%{transform:translateX(-50%) translateY(-10px) rotate(1.5deg)}
}
</style>
<body class="scene-open"><div id="bg"></div><div id="c"></div><div id="cat-layer" aria-hidden="true"></div></body>
