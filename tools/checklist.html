<!DOCTYPE html>
<html lang="{{lang}}">
<head>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-42CSNJ8DF9"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-42CSNJ8DF9');</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="index,follow,max-image-preview:large">
<title>{{title}}</title>
<meta name="description" content="{{desc}}">
<link rel="canonical" href="{{canon}}">
<link rel="alternate" hreflang="zh-Hant" href="https://thecrowdtape.com/zh/checklist/earnings/">
<link rel="alternate" hreflang="en" href="https://thecrowdtape.com/en/checklist/earnings/">
<link rel="alternate" hreflang="x-default" href="https://thecrowdtape.com/zh/checklist/earnings/">
<meta property="og:type" content="website">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{desc}}">
<meta property="og:url" content="{{canon}}">
<meta property="og:image" content="https://thecrowdtape.com/og/ig-{{lang_code}}.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{title}}">
<meta name="twitter:description" content="{{desc}}">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="/assets/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#fbf6ec; --surface:#fffaf2; --ink:#3b2f24; --muted:#87776a; --line:#ece1cc;
  --accent:#a5672c; --accent-soft:#f8ecda; --link:#a5672c;
  --f-display:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light dark;
}
@media (prefers-color-scheme: dark){:root{--bg:#000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#a1a1a6;--line:#38383a;--accent:#0a84ff;--accent-soft:#0a2540;--link:#2997ff}}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",var(--f-body);font-size:16px;line-height:1.6;overflow-wrap:anywhere;-webkit-font-smoothing:antialiased}
a{color:var(--link)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:18px;min-width:0}
.brand{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",var(--f-body);font-weight:600;font-size:19px;letter-spacing:-.02em;color:var(--ink);text-decoration:none}
.site-nav,.lang{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.site-nav a,.lang a{font-size:13px;font-weight:600;padding:5px 11px;border:0;border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface)}
.lang a[aria-current]{background:var(--accent-soft)}
.site-nav a.nav-donate{background:var(--accent);color:#fff}
h1{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",var(--f-body);font-weight:700;font-size:clamp(28px,5vw,40px);line-height:1.12;letter-spacing:-.02em;margin:0 0 8px}
.lead{margin:0 0 16px;color:var(--muted)}
.card{background:var(--surface);border:0;border-radius:20px;padding:16px 18px;margin:14px 0}
.card h2{font-size:17px;margin:0 0 10px;letter-spacing:-.01em}
.preview li,.full li{margin:0 0 8px}
.preview{opacity:.95}
.full[hidden]{display:none!important}
.ct-news{position:relative;overflow-x:clip;box-sizing:border-box;width:100%;max-width:100%;margin:14px 0 0;padding:14px 16px;background:var(--surface);border:0;border-radius:20px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ct-news-t{flex:1 0 100%;margin:0;font-weight:700;font-size:15px;line-height:1.45}
.ct-news input[type=email]{flex:1 1 140px;min-width:0;max-width:100%;box-sizing:border-box;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--ink);font:inherit;font-size:16px}
.ct-news button[type=submit]{flex:0 1 auto;max-width:100%;box-sizing:border-box;margin:0;padding:8px 16px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.ct-news small{flex:1 0 100%;margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.ct-news-msg{flex:1 0 100%;margin:0;font-size:14px;line-height:1.45}
.ct-news input[name=website]{position:absolute!important;left:0!important;top:0!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;border:0!important;white-space:nowrap}
.note{margin:14px 0 0;padding:12px 14px;border-radius:16px;background:var(--accent-soft);font-size:14px}
.site-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
.site-foot a{font-weight:700}
@media(max-width:420px){.wrap{padding:16px 14px 40px}}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="brand" href="{{home}}">The Crowd Tape</a>
  <nav class="site-nav" aria-label="{{nav_label}}">
    <a href="{{home}}earnings/">{{earnings_nav}}</a>
    <a href="{{home}}tools/">{{tools_nav}}</a>
    <a class="nav-donate" href="{{home}}support/">{{support_nav}}</a>
  </nav>
  <nav class="lang" aria-label="{{lang_nav}}">
    <a href="/zh/checklist/earnings/" hreflang="zh-Hant"{{cur_zh}}>中</a>
    <a href="/en/checklist/earnings/" hreflang="en"{{cur_en}}>EN</a>
  </nav>
</header>
<main>
  <h1>{{h1}}</h1>
  <p class="lead">{{lead}}</p>
  <section class="card preview" aria-label="{{preview_label}}">
    <h2>{{preview_h2}}</h2>
    <ul>
      {{preview_items}}
    </ul>
  </section>
  <form class="ct-news" id="ct-news-checklist" data-lang="{{lang_code}}" action="https://crowdtape-newsletter.vercel.app/api/subscribe" method="POST">
    <label for="ct-email-checklist" class="ct-news-t">{{form_title}}</label>
    <input id="ct-email-checklist" type="email" name="email" required autocomplete="email" placeholder="you@example.com">
    <input type="hidden" name="lang" value="{{lang_code}}">
    <input type="hidden" name="src" value="checklist-earnings">
    <input type="text" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
    <button type="submit">{{form_btn}}</button>
    <small>{{form_note}}</small>
    <p class="ct-news-msg" role="status" hidden></p>
  </form>
  <section class="card full" id="checklist-full" hidden>
    <h2>{{full_h2}}</h2>
    <ol>
      {{full_items}}
    </ol>
    <p class="note">{{welcome_note}}</p>
    <p><a href="{{home}}earnings/">{{back_earnings}}</a> · <a href="{{home}}tools/?utm_source=site&amp;utm_medium=cta&amp;utm_campaign=checklist">{{to_tools}}</a></p>
  </section>
  <script>
  (function(){
    var M={en:["Thanks! Full checklist unlocked below. Welcome email will also include this link.","Please check the email address and try again."],
           zh:["多謝！完整清單已喺下面解鎖。歡迎電郵亦會附上呢個連結。","電郵地址有誤，請再試。"]};
    var full=document.getElementById('checklist-full');
    document.querySelectorAll('form.ct-news').forEach(function(f){
      f.addEventListener('submit',function(e){
        e.preventDefault();
        var l=f.dataset.lang||'en',m=f.querySelector('.ct-news-msg'),d=Object.fromEntries(new FormData(f));
        fetch(f.action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
          .then(function(r){return r.json()}).then(function(j){
            m.hidden=false;m.textContent=M[l][j.ok?0:1];
            if(j.ok){
              f.reset();
              if(full){full.hidden=false;try{full.scrollIntoView({behavior:'smooth',block:'start'})}catch(err){}}
              if(window.gtag)gtag('event','newsletter_signup',{lang:l,src:'checklist-earnings'});
            }
          }).catch(function(){m.hidden=false;m.textContent=M[l][1];});
      });
    });
    var sub=new URLSearchParams(location.search).get('subscribed');
    if(sub==='1'||sub==='0') document.querySelectorAll('form.ct-news').forEach(function(f){
      var l=f.dataset.lang||'en',m=f.querySelector('.ct-news-msg');
      m.hidden=false;m.textContent=M[l][sub==='1'?0:1];
      if(sub==='1'&&full) full.hidden=false;
    });
  })();
  </script>
</main>
<footer class="site-foot">
  <p><a href="{{home}}">{{home_nav}}</a> · <a href="{{home}}newsletter/?utm_source=site&amp;utm_medium=cta&amp;utm_campaign=newsletter">{{news_nav}}</a> · <a href="{{home}}earnings/">{{earnings_nav}}</a> · <a href="{{home}}tools/">{{tools_nav}}</a></p>
</footer>
</div>
</body>
</html>
