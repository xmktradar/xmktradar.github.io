<!doctype html><meta charset="utf-8">
<!-- IG/Threads portrait (1080x1350): the day's landscape share picture, plus headline and brand.
     tools/og.js calls portrait(lang, data, pictureDataUrl). Light page, same cream and accent as the site. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900;900&display=block">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1080px;height:1350px;position:relative;overflow:hidden;color:#3b2f24;background:#fbf6ec;
 font-family:"Noto Sans TC","Noto Color Emoji",sans-serif}
.dots{position:absolute;inset:0;background-image:radial-gradient(#f1e7d3 1.4px,transparent 1.5px);background-size:14px 14px}
.main{position:absolute;left:64px;right:64px;top:80px;bottom:64px;display:flex;flex-direction:column;align-items:center;text-align:center}
.row1{display:flex;gap:16px;align-items:center}
.brand{display:inline-flex;align-items:center;gap:12px;background:#fffaf2;border:1px solid #ece1cc;border-radius:999px;padding:10px 26px 10px 12px;font-weight:900;font-size:34px;color:#2a2119}
.brand img{width:56px;height:56px;border-radius:14px;object-fit:cover}
.date{background:#f8ecda;border:1px solid #ecd4b0;color:#a5672c;border-radius:12px;padding:8px 18px;font:700 28px "IBM Plex Mono",monospace}
h1{margin:36px 0 0;font-weight:900;font-size:62px;line-height:1.2}
h1 .hl{font-family:"IBM Plex Mono",monospace;color:#a5672c}
.pic{margin-top:36px;width:100%;border-radius:20px;border:1px solid #ece1cc;box-shadow:0 8px 24px rgba(120,90,50,.12);background:#fff;display:block}
.fl{margin-top:auto;font-weight:700;font-size:26px;color:#87776a}
.site{margin-top:8px;font:700 24px "IBM Plex Mono",monospace;color:#a5672c}
</style>
<body>
<div class="dots"></div>
<div class="main">
 <div class="row1"><span class="brand"><img src="logo.png" alt="">The Crowd Tape</span><span class="date" id="date"></span></div>
 <h1 id="h"></h1>
 <img class="pic" id="pic" alt="">
 <div class="fl" id="fl"></div>
 <div class="site">thecrowdtape.com</div>
</div>
<script>
function portrait(lang,D,pic){
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.documentElement.lang=lang;
const L={
 zh:{hb:'今日最多人看好',ht:'今日最多人討論',acc:n=>`${n} 個帳號`,fl:'不構成投資建議'},
 en:{hb:'Most bullish today',ht:'Most discussed today',acc:n=>`${n} account${n===1?'':'s'}`,fl:'Not investment advice'},
 ko:{hb:'오늘 가장 많은 강세',ht:'오늘 가장 많이 언급',acc:n=>`계정 ${n}개`,fl:'투자 조언 아님'}}[lang];
document.getElementById('date').textContent=D&&D.date?D.date:'';
const t=D&&D.top&&D.top[0];
document.getElementById('h').innerHTML=t?`${D.mode==='bull'?L.hb:L.ht}<br><span class="hl">$${esc(t.t)}</span><br>${L.acc(t.n)}`:'';
document.getElementById('pic').src=pic||'';
document.getElementById('fl').textContent=L?L.fl:'';
}
</script>
</body>
