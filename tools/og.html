<!doctype html><meta charset="utf-8">
<!-- Share image (1200x630) in the style of the @thecrowdtape Instagram posts. tools/og.js calls render(lang, data). -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Sans+KR:wght@400;500;700;900&display=block">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1200px;height:630px;position:relative;overflow:hidden;color:#151a2c;
 font-family:"Noto Sans TC","Noto Sans KR","Noto Color Emoji",sans-serif}
html[lang=ko] body{font-family:"Noto Sans KR","Noto Sans TC","Noto Color Emoji",sans-serif}
.bg{position:absolute;inset:0}
.bull .bg{background:linear-gradient(135deg,#8fe3c3 0%,#c6ec9f 48%,#fde7a1 100%)}
.talk .bg{background:linear-gradient(135deg,#9fc8fb 0%,#c3b9f6 55%,#f6c8df 100%)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.55) 1.6px,transparent 1.7px);background-size:22px 22px;mask-image:linear-gradient(90deg,transparent 0,#000 60%)}
/* the tape */
.tape{position:absolute;left:-40px;right:-40px;top:22px;height:46px;background:#151a2c;transform:rotate(-2.2deg);
 display:flex;align-items:center;gap:34px;padding-left:70px;white-space:nowrap;box-shadow:0 6px 0 rgba(21,26,44,.18)}
.tape span{font:700 22px "IBM Plex Mono",monospace;color:#fff}
.tape i{font-style:normal;margin-left:8px}
.tape .u{color:#5ee08f}.tape .d{color:#ff7d7d}
.tape .sep{color:#f8d34a}
.main{position:absolute;left:56px;right:56px;top:100px;bottom:84px;display:grid;grid-template-columns:520px 1fr;gap:30px}
.row1{display:flex;gap:12px;align-items:center;flex-wrap:nowrap}
.brand{white-space:nowrap;display:inline-flex;align-items:center;gap:8px;background:#fff;border-radius:999px;padding:7px 18px 7px 10px;font-weight:900;font-size:22px;box-shadow:0 4px 0 rgba(21,26,44,.14)}
.brand .lg{width:30px;height:30px;border-radius:50%;background:#e6f3e8;border:2px solid #2f7d4a;display:grid;place-items:center;font-size:16px}
.date{display:inline-block;background:#f8d34a;border:3px solid #151a2c;border-radius:12px;padding:5px 14px;font-weight:900;font-size:22px;transform:rotate(-2.5deg);box-shadow:3px 4px 0 #151a2c;white-space:nowrap}
.win{margin-top:12px;display:inline-block;background:#fff;border:3px solid #151a2c;border-radius:12px;padding:4px 14px;font:700 19px "IBM Plex Mono",monospace}
h1{margin:14px 0 0;font-weight:900;font-size:52px;line-height:1.12;letter-spacing:.5px}
h1 .hl{background:linear-gradient(transparent 52%,#fbe25b 52%);padding:0 6px;font-family:"IBM Plex Mono",monospace;font-size:1.35em}
h1 .n{font-size:.85em;white-space:nowrap}
.stats{display:flex;gap:16px;margin-top:16px}
.stat{flex:1;border-radius:18px;padding:8px 18px;border:3px solid;box-shadow:0 5px 0 rgba(21,26,44,.16)}
.stat .l{font-weight:900;font-size:19px}
.stat .v{font-weight:900;font-size:40px;line-height:1.05}
.stat .v small{font-size:26px;margin-left:6px}
.stat.g{background:#c9f3d6;border-color:#2f8f52;color:#1d6b3a}
.stat.r{background:#fbd3da;border-color:#c63b4e;color:#a52b3d}
.stat.b{background:#dfe7ff;border-color:#3557c9;color:#2a43a0}
.stat.p{background:#f3e3ff;border-color:#8a4fd6;color:#6b37b0}
.rt{display:flex;flex-direction:column;gap:11px}
.rt .t{white-space:nowrap;font-weight:900;font-size:24px;display:flex;align-items:center;gap:8px;margin-bottom:2px}
.card{background:#fff;border-radius:18px;border:3px solid #151a2c;box-shadow:0 5px 0 #151a2c;display:grid;grid-template-columns:34px 158px 1fr 104px;align-items:center;gap:10px;padding:8px 14px;height:86px}
.rk{width:34px;height:34px;border-radius:50%;background:#151a2c;color:#fff;display:grid;place-items:center;font:700 18px "IBM Plex Mono",monospace}
.card:first-of-type .rk{background:#f8d34a;color:#151a2c;border:2px solid #151a2c}
.tk{font:700 34px "IBM Plex Mono",monospace;line-height:1;white-space:nowrap}
.pill{display:inline-block;margin-top:6px;font-weight:900;font-size:16px;padding:2px 10px;border-radius:999px;border:2px solid}
.pill.g{color:#1d6b3a;border-color:#2f8f52;background:#e3f7ea}
.pill.r{color:#a52b3d;border-color:#c63b4e;background:#fde7eb}
.pill.n{color:#3c4466;border-color:#8890b5;background:#eef0fb}
.avs{display:flex}
.avs img,.avs b{width:42px;height:42px;border-radius:50%;border:3px solid #fff;margin-left:-12px;box-shadow:0 0 0 2px #2f8f52;object-fit:cover;background:#eee}
.avs img:first-child{margin-left:0}
.avs b{display:grid;place-items:center;font-size:14px;color:#151a2c;background:#f8d34a;box-shadow:0 0 0 2px #151a2c}
.mini{display:flex;flex-direction:column;align-items:flex-end;gap:2px}
.mini svg{width:88px;height:34px}
.mini .c{font:700 20px "IBM Plex Mono",monospace}
.u{color:#1f9d55}.d{color:#d23b4f}
.foot{position:absolute;left:56px;right:56px;bottom:22px;height:44px;background:rgba(255,255,255,.88);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-weight:700;font-size:18px;color:#3c4466;white-space:nowrap;gap:12px}
html[lang=en] .foot{font-size:16px;padding:0 18px}
.foot b{color:#151a2c}
.foot .cta{background:#151a2c;color:#fff;border-radius:999px;padding:5px 16px;font-weight:900}

.q{margin-top:14px;display:flex;gap:12px;align-items:flex-start;background:#fff;border:3px solid #151a2c;border-radius:18px;padding:10px 16px;box-shadow:0 5px 0 rgba(21,26,44,.16);position:relative}
.q img{width:48px;height:48px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #2f8f52}
.q .who{font:700 17px "IBM Plex Mono",monospace;color:#3c4466}
.q .tx{font-weight:700;font-size:21px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.streak{display:inline-block;vertical-align:middle;margin-left:10px;background:#ff6b3d;color:#fff;font-weight:900;font-size:20px;padding:4px 12px;border-radius:10px;transform:rotate(3deg);box-shadow:2px 3px 0 #151a2c;border:2px solid #151a2c;letter-spacing:0}
.fl{display:inline-block;margin-left:6px;font-weight:900;font-size:15px;color:#d2451e;background:#ffe3d6;border:2px solid #ff6b3d;border-radius:999px;padding:1px 8px;vertical-align:3px}
html[lang=ko] h1,html[lang=ko] .q .tx{word-break:keep-all}
.rt .t small{font:700 15px "IBM Plex Mono",monospace;color:#3c4466;margin-left:auto}
</style>
<body>
<div class="bg"></div><div class="dots"></div>
<div class="tape" id="tape"></div>
<div class="main">
 <div>
  <div class="row1"><span class="brand"><span class="lg">📊</span>The Crowd Tape</span><span class="date" id="date"></span></div>
    <h1 id="h"></h1>
  <div class="q" id="q"></div>
  <div class="stats" id="stats"></div>
 </div>
 <div class="rt" id="rt"></div>
</div>
<div class="foot"><span><b>@thecrowdtape</b> · xmktradar.github.io</span><span id="fl"></span><span class="cta" id="cta"></span></div>
<script>
function render(lang,D){
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
document.documentElement.lang=lang;document.body.className=D.mode;
const L={
 zh:{snap:'快照',hb:'今日最多人看好：',ht:'今日最多人討論：',acc:n=>`${n} 個帳號`,sb:'🟢 共同看多',sr:'🔴 共同看淡',sa:'🗣️ 今日發文帳號',st:'💬 討論股票',u:'隻',ua:'個',
   tb:'🏆 最多人看好 Top 4',tt:'🔥 最多人討論 Top 4',stk:n=>`🔥 連續 ${n} 日上榜`,fs:n=>`🔥${n}日`,pb:n=>`${n} 個看好`,pt:n=>`${n} 個帳號`,pr:n=>`${n} 個看淡`,fl:'不構成投資建議',m1:'走勢：1 個月',cta:'每 4 小時更新 👉'},
 en:{snap:'',hb:'Most bullish today:',ht:'Most discussed today:',acc:n=>`${n} account${n===1?'':'s'}`,sb:'🟢 Joint bullish',sr:'🔴 Joint bearish',sa:'🗣️ Accounts posting',st:'💬 Stocks discussed',u:'',ua:'',
   tb:'🏆 Most bullish · Top 4',tt:'🔥 Most discussed · Top 4',stk:n=>`🔥 ${n} days in a row`,fs:n=>`🔥${n}d`,pb:n=>`${n} bullish`,pt:n=>`${n} account${n===1?'':'s'}`,pr:n=>`${n} bearish`,fl:'Not investment advice',m1:'charts: 1 month',cta:'Updated every 4h 👉'},
 ko:{snap:'스냅샷',hb:'오늘 가장 많은 강세:',ht:'오늘 가장 많이 언급:',acc:n=>`계정 ${n}개`,sb:'🟢 공동 강세',sr:'🔴 공동 약세',sa:'🗣️ 게시 계정',st:'💬 언급 종목',u:'개',ua:'개',
   tb:'🏆 강세 Top 4',tt:'🔥 최다 언급 Top 4',stk:n=>`🔥 ${n}일 연속`,fs:n=>`🔥${n}일`,pb:n=>`강세 ${n}`,pt:n=>`계정 ${n}개`,pr:n=>`약세 ${n}`,fl:'투자 조언 아님',m1:'차트: 1개월',cta:'4시간마다 업데이트 👉'}}[lang];
const m1=x=>x.spark&&x.spark.length>1?(x.spark[x.spark.length-1]/x.spark[0]-1)*100:null;
const pct=v=>v==null?'':(v>=0?'▲':'▼')+Math.abs(v).toFixed(1)+'%';
const tape=D.tape.map(x=>`<span>$${x.t}<i class="${x.d1>=0?'u':'d'}">${pct(x.d1)}</i></span><span class="sep">✦</span>`).join('');
document.getElementById('tape').innerHTML=tape+tape;
document.getElementById('date').textContent=`📅 ${D.date} ${L.snap}`;
const t0=D.top[0];
document.getElementById('h').innerHTML=`${D.mode==='bull'?L.hb:L.ht}<br><span class="hl">$${t0.t}</span> <span class="n">${L.acc(t0.n)} ${D.mode==='bull'?'🏆':'🔥'}</span>${t0.streak>=2?`<span class="streak">${L.stk(t0.streak)}</span>`:''}`;
const Q=D.quote,qe=document.getElementById('q');qe.style.display=Q&&Q.text?'':'none';if(Q&&Q.text){qe.innerHTML=`${Q.av?`<img src="${Q.av}">`:''}<div><div class="who">💬 @${esc(Q.acc)}</div><div class="tx">${esc(Q.text)}</div></div>`}
const stat=(c,l,v,u)=>`<div class="stat ${c}"><div class="l">${l}</div><div class="v">${v}<small>${u}</small></div></div>`;
document.getElementById('stats').innerHTML=D.mode==='bull'?stat('g',L.sb,D.bull_n,L.u)+stat('r',L.sr,D.bear_n,L.u):stat('b',L.sa,D.acc,L.ua)+stat('p',L.st,D.n_tk,L.u);
const spark=a=>{if(!a||a.length<2)return '';const mn=Math.min(...a),mx=Math.max(...a),sp=(mx-mn)||1;const pts=a.map((v,i)=>`${(i/(a.length-1)*86+1).toFixed(1)},${(32-(v-mn)/sp*30).toFixed(1)}`).join(' ');const up=a[a.length-1]>=a[0];return `<svg viewBox="0 0 88 34"><polyline points="${pts}" fill="none" stroke="${up?'#1f9d55':'#d23b4f'}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/></svg>`};
document.getElementById('rt').innerHTML=`<div class="t">${D.mode==='bull'?L.tb:L.tt}<small>${L.m1}</small></div>`+D.top.map((x,i)=>{
 const pills=D.mode==='bull'?`<span class="pill g">${L.pb(x.n)}</span>`:(x.bull||x.bear?`${x.bull?`<span class="pill g">${L.pb(x.bull)}</span> `:''}${x.bear?`<span class="pill r">${L.pr(x.bear)}</span>`:''}`:`<span class="pill n">${L.pt(x.n)}</span>`);
 const av=x.avs.slice(0,x.n>4?3:4).map(a=>`<img src="${a}">`).join('')+(x.n>4?`<b>+${x.n-3}</b>`:'');
 return `<div class="card"><span class="rk">${i+1}</span><div><div class="tk">$${x.t}</div><div style="white-space:nowrap">${pills}${x.streak>=2?`<span class="fl">${L.fs(x.streak)}</span>`:''}</div></div><div class="avs">${av}</div><div class="mini">${spark(x.spark)}<span class="c ${m1(x)>=0?'u':'d'}">${pct(m1(x))}</span></div></div>`}).join('');
document.getElementById('fl').textContent=D.win+' · ⚠️ '+L.fl;
document.getElementById('cta').textContent=L.cta;
}
</script>
</body>
