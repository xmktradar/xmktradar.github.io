<!doctype html><meta charset="utf-8">
<!-- One picture (1080x1350) of the daily multi-picture posts, in the @thecrowdtape Instagram style.
     tools/carousel.js calls render(lang, theme, date, page, slide); tools/carousel.py writes the slides, text included. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;700&family=Noto+Sans+TC:wght@400;500;700;900;900&display=block">
<style>
*{box-sizing:border-box}
html,body{margin:0}
body{width:1080px;height:1350px;position:relative;overflow:hidden;color:#151a2c;font-family:"Noto Sans TC","Noto Color Emoji",sans-serif}
.bg{position:absolute;inset:0}
/* Comic-style backgrounds: bold colour, sunburst rays, halftone dots and doodles; the ray centre moves on every picture. */
.snap{--a:#5ab8ff;--b:#8f7bff;--c:#ffd84d}
.duel{--a:#2fc46b;--b:#ff4f6d;--c:#ffd84d}
.focus{--a:#ffb020;--b:#ff6aa8;--c:#7cf0c4}
.bg{background:linear-gradient(160deg,var(--a) 0%,var(--b) 100%)}
.duel .bg{background:linear-gradient(115deg,var(--a) 0 49.6%,#151a2c 49.6% 50.4%,var(--b) 50.4% 100%)}
.rays{position:absolute;inset:-200px;background:repeating-conic-gradient(from 0deg at var(--cx,20%) var(--cy,22%),rgba(255,255,255,.22) 0 5deg,transparent 5deg 12deg)}
.dots{position:absolute;inset:0;background-image:radial-gradient(rgba(21,26,44,.16) 3.2px,transparent 3.6px);background-size:22px 22px;-webkit-mask-image:radial-gradient(circle at var(--dx,85%) var(--dy,85%),#000 0,transparent 55%);mask-image:radial-gradient(circle at var(--dx,85%) var(--dy,85%),#000 0,transparent 55%)}
.deco{position:absolute;inset:0;pointer-events:none}
.deco svg{position:absolute}
.glow{position:absolute;left:48px;right:48px;top:158px;bottom:150px;background:rgba(255,255,255,.28);border:4px solid #151a2c;border-radius:34px;box-shadow:8px 10px 0 rgba(21,26,44,.85)}
.top{position:absolute;left:64px;right:64px;top:76px;display:flex;align-items:center;gap:16px}
.brand{white-space:nowrap;display:inline-flex;align-items:center;gap:10px;background:#fff;border-radius:999px;padding:8px 22px 8px 10px;font-weight:900;font-size:28px;box-shadow:0 5px 0 rgba(21,26,44,.14)}
.brand img{width:50px;height:50px;border-radius:12px;object-fit:cover;margin:-4px 0}
.date{background:#f8d34a;border:4px solid #151a2c;border-radius:14px;padding:6px 16px;font-weight:900;font-size:28px;transform:rotate(-2.5deg);box-shadow:4px 5px 0 #151a2c;white-space:nowrap}
.pg{margin-left:auto;font:700 26px "IBM Plex Mono",monospace;background:#151a2c;color:#fff;border-radius:999px;padding:6px 18px}
.main{position:absolute;left:64px;right:64px;top:180px;bottom:150px}
#in{display:flex;flex-direction:column;gap:22px;min-height:100%}
.cv{display:flex;gap:24px;align-items:center}
.cvl{flex:1;min-width:0;display:flex;flex-direction:column;gap:22px}
.cvr{width:400px;flex:none;display:flex;flex-direction:column;gap:20px}
.cvq{padding:16px 20px}
.cvq .hd{display:flex;align-items:center;gap:12px;margin-bottom:8px}
.cvq img{width:52px;height:52px;border-radius:50%;flex:none;box-shadow:0 0 0 3px #2f8f52;object-fit:cover}
.cvq .who{font-size:22px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cvq .tx{font-size:26px;line-height:1.35;-webkit-line-clamp:4}
.cvr .cvq:only-child .tx{font-size:28px;-webkit-line-clamp:7}
.kick{align-self:flex-start;background:#151a2c;color:#fff;font-weight:900;font-size:34px;padding:8px 22px;border-radius:14px;transform:rotate(-1.5deg)}
.win{align-self:flex-start;background:#fff;border:3px solid #151a2c;border-radius:12px;padding:4px 14px;font:700 22px "IBM Plex Mono",monospace}
.lead{font-weight:900;font-size:46px;margin-top:6px}
.big{font:700 170px/1 "IBM Plex Mono",monospace;letter-spacing:-4px}
.big span{background:linear-gradient(transparent 58%,#fbe25b 58%);padding:0 10px}
.sub{font-weight:900;font-size:44px}
.pills{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-block;font-weight:900;font-size:26px;padding:4px 16px;border-radius:999px;border:3px solid;white-space:nowrap}
.pill.g{color:#1d6b3a;border-color:#2f8f52;background:#e3f7ea}
.pill.r{color:#a52b3d;border-color:#c63b4e;background:#fde7eb}
.pill.n{color:#3c4466;border-color:#8890b5;background:#eef0fb}
.pill.o{color:#b13a12;border-color:#ff6b3d;background:#ffe3d6}
.stats{display:flex;gap:18px}
.stat{flex:1;border-radius:20px;padding:14px 22px;border:4px solid;font-weight:900;font-size:32px;box-shadow:0 6px 0 rgba(21,26,44,.16)}
.stat.b{background:#dfe7ff;border-color:#3557c9;color:#2a43a0}
.stat.p{background:#f3e3ff;border-color:#8a4fd6;color:#6b37b0}
.box{background:#fff;border:4px solid #151a2c;border-radius:24px;box-shadow:0 7px 0 #151a2c;padding:22px 26px}
.q{display:flex;gap:18px;align-items:flex-start}
.q img{width:76px;height:76px;border-radius:50%;flex:none;box-shadow:0 0 0 3px #2f8f52;object-fit:cover}
.who{font:700 24px "IBM Plex Mono",monospace;color:#3c4466}
.tx{font-weight:700;font-size:32px;line-height:1.4;display:-webkit-box;-webkit-line-clamp:5;-webkit-box-orient:vertical;overflow:hidden}
.swipe{align-self:flex-end;background:#ff6b3d;color:#fff;font-weight:900;font-size:32px;padding:10px 24px;border-radius:16px;border:3px solid #151a2c;box-shadow:4px 5px 0 #151a2c;transform:rotate(2deg)}
.sec h2{margin:0 0 12px;font-size:38px;font-weight:900}
.cards{display:flex;flex-direction:column;gap:14px}
.card{background:#fff;border-radius:22px;border:4px solid #151a2c;box-shadow:0 6px 0 #151a2c;display:grid;grid-template-columns:52px 1fr 190px 150px;align-items:center;gap:16px;padding:12px 20px;min-height:116px}
.rk{width:50px;height:50px;border-radius:50%;background:#151a2c;color:#fff;display:grid;place-items:center;font:700 26px "IBM Plex Mono",monospace}
.card:first-child .rk{background:#f8d34a;color:#151a2c;border:3px solid #151a2c}
.tk{font:700 48px/1 "IBM Plex Mono",monospace;white-space:nowrap;margin-bottom:8px}
.card .pill{font-size:21px;padding:2px 12px;margin-right:6px}
.avs{display:flex}
.avs img,.avs b{width:58px;height:58px;border-radius:50%;border:4px solid #fff;margin-left:-16px;box-shadow:0 0 0 3px #151a2c;object-fit:cover;background:#eee}
.avs img:first-child{margin-left:0}
.avs b{display:grid;place-items:center;font-size:20px;background:#f8d34a}
.mini svg{width:150px;height:60px}
.card:has(.cq){min-height:0;padding:10px 20px;row-gap:6px}
.cq{grid-column:1/-1;display:flex;gap:10px;align-items:center;border-top:3px dashed #d5d9e6;padding-top:8px;margin-top:-6px;min-width:0}
.cq img{width:34px;height:34px;border-radius:50%;flex:none;object-fit:cover;box-shadow:0 0 0 2px #151a2c}
.cq span{font-weight:700;font-size:24px;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cq b{font:700 20px "IBM Plex Mono",monospace;color:#3c4466}
.empty{font-weight:700;font-size:32px;color:#3c4466;background:rgba(255,255,255,.7);border-radius:18px;padding:18px 24px}
.cta{background:#151a2c;color:#fff;border-radius:24px;padding:24px 30px;font-weight:900;font-size:34px;line-height:1.6}
.cta div:first-child{color:#f8d34a;font-size:40px}
.acc{display:flex;gap:24px;align-items:center}
.acc img{width:150px;height:150px;border-radius:50%;border:6px solid #fff;box-shadow:0 0 0 5px #151a2c;object-fit:cover;background:#eee}
.acc .h{font:700 40px "IBM Plex Mono",monospace}
.acc .n{font-weight:700;font-size:30px;color:#3c4466}
.badge{align-self:flex-start;font-weight:900;font-size:52px;padding:10px 34px;border-radius:20px;border:5px solid #151a2c;box-shadow:5px 6px 0 #151a2c;transform:rotate(-2deg)}
.badge.bull{background:#5ee08f}.badge.bear{background:#ff8a8a}.badge.neutral{background:#e3e6f5}
.say{font-weight:700;font-size:38px;line-height:1.5}
.when{font:700 24px "IBM Plex Mono",monospace;color:#3c4466;margin-top:14px}
.bar{display:flex;height:64px;border-radius:999px;overflow:hidden;border:4px solid #151a2c;box-shadow:0 6px 0 #151a2c;font-weight:900;font-size:30px}
.bar div{display:grid;place-items:center;color:#151a2c;min-width:90px}
.bar .b{background:#5ee08f}.bar .r{background:#ff8a8a}
.chart{display:flex;align-items:center;gap:20px}
.chart svg{width:520px;height:150px;background:rgba(255,255,255,.75);border-radius:20px;border:3px solid #151a2c;padding:10px}
.chg{font:700 44px "IBM Plex Mono",monospace}
.chg small{display:block;font:700 22px "Noto Sans TC",sans-serif;color:#3c4466}
.u{color:#1f9d55}.d{color:#d23b4f}
.note{font-weight:900;font-size:36px}
.row{display:flex;gap:18px;align-items:center;background:#fff;border:4px solid #151a2c;border-radius:22px;box-shadow:0 6px 0 #151a2c;padding:16px 22px}
.row img{width:72px;height:72px;border-radius:50%;object-fit:cover;flex:none;box-shadow:0 0 0 3px #151a2c}
.row .pt{font:700 46px "IBM Plex Mono",monospace;white-space:nowrap}
.row .pt span{color:#b13a12}
.row .by{font:700 24px "IBM Plex Mono",monospace;color:#3c4466}
.row>div{min-width:0}
.row .rq{font-weight:700;font-size:25px;line-height:1.35;margin-top:6px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.row .v{font-weight:700;font-size:28px;line-height:1.4}
.row .pill{font-size:20px;padding:1px 10px;margin-right:8px}
/* without the characters (2026-10-23) the one-account and one-quote pictures fill the space with bigger text */
#in.account{justify-content:center}
#in.account .say{font-size:46px}
#in.account .acc img{width:190px;height:190px}
#in.quote .q img{width:110px;height:110px}
#in.quote .q .who{font-size:30px}
#in.quote .q .tx{font-size:46px;line-height:1.5;-webkit-line-clamp:10}
.talk{align-self:flex-start;background:#f8d34a;border:4px solid #151a2c;border-radius:14px;padding:6px 20px;font-weight:900;font-size:34px;box-shadow:4px 5px 0 #151a2c}
#in.igcta{justify-content:center;align-items:center;text-align:center;gap:28px}
#in.igcta .kick{align-self:center}
#in.igcta .lead{font-size:56px;line-height:1.2}
#in.igcta .handle{font:700 92px/1 "IBM Plex Mono",monospace;letter-spacing:-3px}
#in.igcta .handle span{background:linear-gradient(transparent 58%,#fbe25b 58%);padding:0 12px}
#in.igcta .sub{font-size:42px;line-height:1.35;max-width:920px}
#in.igcta .swipe{align-self:center;margin-top:8px}
.foot{position:absolute;left:64px;right:64px;bottom:76px;height:60px;background:rgba(255,255,255,.9);border-radius:999px;display:flex;align-items:center;justify-content:space-between;padding:0 30px;font-weight:700;font-size:24px;color:#3c4466;white-space:nowrap}
.foot b{color:#151a2c}
</style>
<body>
<div class="bg"></div><div class="rays"></div><div class="dots"></div><div class="deco" id="deco"></div><div class="glow"></div>
<div class="top"><span class="brand"><img src="logo.png" alt="">The Crowd Tape</span><span class="date" id="date"></span><span class="pg" id="pg"></span></div>
<div class="main" id="main"><div id="in"></div></div>
<div class="foot"><span><b>@thecrowdtape</b> · thecrowdtape.com</span><span id="fl"></span></div>
<script>
const FL={zh:'⚠️ 唔構成投資建議',en:'⚠️ Not investment advice',ko:'⚠️ 투자 조언 아님'};
const esc=v=>String(v==null?'':v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function spark(a,w,h){if(!a||a.length<2)return '';const mn=Math.min(...a),mx=Math.max(...a),sp=(mx-mn)||1;const pts=a.map((v,i)=>`${(i/(a.length-1)*(w-4)+2).toFixed(1)},${(h-4-(v-mn)/sp*(h-8)).toFixed(1)}`).join(' ');const up=a[a.length-1]>=a[0];return `<svg viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="${up?'#1f9d55':'#d23b4f'}" stroke-width="${w>200?5:4}" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
const pct=v=>v==null?'':(v>=0?'▲':'▼')+Math.abs(v).toFixed(1)+'%';
const pills=ps=>(ps||[]).map(p=>`<span class="pill ${p.c}">${esc(p.x)}</span>`).join('');
const avs=(a,more)=>(a||[]).filter(Boolean).map(s=>`<img src="${s}">`).join('')+(more?`<b>+${more}</b>`:'');
const cta=c=>c&&c.length?`<div class="cta">${c.map(x=>`<div>${esc(x)}</div>`).join('')}</div>`:'';
function dedupeHandle(acc,text){
 const a=String(acc||'').replace(/^@/,''), t=String(text==null?'':text).trim();
 const m=t.match(/^@([A-Za-z0-9_]+)[：:]\s*/);
 if(m && m[1].toLowerCase()===a.toLowerCase()) return t.slice(m[0].length);
 return t;
}
const quote=q=>q&&q.text?`<div class="box q">${q.av?`<img src="${q.av}">`:''}<div><div class="who">💬 @${esc(q.acc)}</div><div class="tx">${esc(dedupeHandle(q.acc,q.text))}</div></div></div>`:'';
function render(lang,theme,date,page,S){
 document.documentElement.lang=lang;document.body.className=theme||'snap';
 document.getElementById('pg').style.display='';
 document.getElementById('date').style.display='';
 document.querySelector('.foot span').innerHTML='<b>@thecrowdtape</b> · thecrowdtape.com';
 const pi=Math.max(0,(page-1)%4);
 const C=[['18%','20%','88%','88%'],['82%','18%','12%','86%'],['15%','80%','86%','14%'],['85%','82%','14%','16%']][pi],st=document.body.style;
 st.setProperty('--cx',C[0]);st.setProperty('--cy',C[1]);st.setProperty('--dx',C[2]);st.setProperty('--dy',C[3]);
 const star=(x,y,r,f,rot)=>`<svg style="left:${x}px;top:${y}px;transform:rotate(${rot}deg)" width="${r*2}" height="${r*2}" viewBox="-10 -10 20 20"><path d="M0-10 2.6-3.6 9.5-3.1 4.2 1.4 5.9 8.1 0 4.5-5.9 8.1-4.2 1.4-9.5-3.1-2.6-3.6Z" fill="${f}" stroke="#151a2c" stroke-width="1.2" stroke-linejoin="round"/></svg>`;
 const spark4=(x,y,r,f)=>`<svg style="left:${x}px;top:${y}px" width="${r*2}" height="${r*2}" viewBox="-10 -10 20 20"><path d="M0-10C1 -2 2-1 10 0 2 1 1 2 0 10-1 2-2 1-10 0-2-1-1-2 0-10Z" fill="${f}" stroke="#151a2c" stroke-width="1"/></svg>`;
 const zig=(x,y,f,rot)=>`<svg style="left:${x}px;top:${y}px;transform:rotate(${rot}deg)" width="150" height="40" viewBox="0 0 150 40"><path d="M4 30 22 8 40 30 58 8 76 30 94 8 112 30 130 8 146 30" fill="none" stroke="${f}" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
 const D=[[star(950,118,30,'var(--c)',12),spark4(22,1210,22,'#fff'),zig(890,1240,'#151a2c',-8)],
          [star(14,120,26,'var(--c)',-10),spark4(1010,1200,24,'#fff'),zig(20,1250,'#fff',6)],
          [star(985,1185,32,'var(--c)',20),spark4(16,128,20,'#fff'),zig(860,104,'#151a2c',4)],
          [star(16,1196,28,'var(--c)',-18),spark4(1006,120,22,'#fff'),zig(880,1252,'#fff',-4)]][pi];
 document.getElementById('deco').innerHTML=D.join('');
 document.getElementById('date').textContent=date?'📅 '+date:'';
 document.getElementById('pg').textContent=page?page+'/4':'';
 document.getElementById('fl').textContent=FL[lang];
 if(S.kind==='igcta'){
  document.getElementById('pg').style.display='none';
  document.getElementById('date').style.display='none';
  document.querySelector('.foot span').innerHTML='<b>@thecrowdtape</b>';
 }
 let h='';
 if(S.kind==='cover'){
  h=`<div class="kick">${esc(S.kicker)}</div>${S.win?`<div class="win">${esc(S.win)}</div>`:''}<div class="lead">${esc(S.lead)}</div>
   <div class="big"${S.quotes&&S.quotes.length&&S.big.length>4?` style="font-size:${S.big.length>5?110:135}px"`:''}><span>$${esc(S.big)}</span></div><div class="sub">${esc(S.sub)}</div>`;
  const side=S.quotes&&S.quotes.length;  // featured posts sit beside the headline (12:30 snapshot)
  if(side){h+=S.pills&&S.pills.length?`<div class="pills">${pills(S.pills)}</div>`:'';h=`<div class="cv"><div class="cvl">${h}</div><div class="cvr">${S.quotes.map((q,i)=>`<div class="box cvq" style="transform:rotate(${i?-1.2:1.5}deg)"><div class="hd">${q.av?`<img src="${q.av}">`:''}<div class="who">💬 @${esc(q.acc)}</div></div><div class="tx">${esc(dedupeHandle(q.acc,q.text))}</div></div>`).join('')}</div></div>`}
  if(S.bar){const[b,r]=S.bar,t=(b+r)||1;h+=`<div class="bar"><div class="b" style="flex:${Math.max(b,.0001)/t}">🟢 ${b}</div><div class="r" style="flex:${Math.max(r,.0001)/t}">🔴 ${r}</div></div>`}
  if(!side&&S.pills&&S.pills.length)h+=`<div class="pills">${pills(S.pills)}</div>`;
  if(S.spark&&S.spark.length>1){const m1=(S.spark[S.spark.length-1]/S.spark[0]-1)*100;h+=`<div class="chart">${spark(S.spark,500,130)}<div class="chg ${S.d1>=0?'u':'d'}">${pct(S.d1)}<small>${esc(S.d1l)}</small><span class="${m1>=0?'u':'d'}" style="font-size:30px">1M ${pct(m1)}</span></div></div>`}
  if(S.stats)h+=`<div class="stats">${S.stats.map(x=>`<div class="stat ${x.c}">${esc(x.l)}</div>`).join('')}</div>`;
  if(!side)h+=quote(S.quote);
  if(S.note)h+=`<div class="note">${esc(S.note)}</div>`;
  if(S.swipe)h+=`<div class="swipe">${esc(S.swipe)}</div>`;
 }else if(S.kind==='cards'){
  h=(S.secs||[]).map(sec=>`<div class="sec"><h2>${esc(sec.h)}</h2>${sec.cards.length?`<div class="cards">${sec.cards.map(c=>`<div class="card"><span class="rk">${c.rk}</span><div><div class="tk">$${esc(c.t)}</div><div>${pills(c.pills)}</div></div><div class="avs">${avs(c.avs,c.more)}</div><div class="mini">${spark(c.spark,150,60)}</div>${c.q?`<div class="cq">${c.q.av?`<img src="${c.q.av}">`:''}<span><b>@${esc(c.q.acc)}</b> ${esc(dedupeHandle(c.q.acc,c.q.text))}</span></div>`:''}</div>`).join('')}</div>`:`<div class="empty">${esc(sec.empty||'')}</div>`}</div>`).join('');
  h+=cta(S.cta);
 }else if(S.kind==='account'){
  h=`<div class="kick">${esc(S.kicker)} · $${esc(S.t)}</div><div class="acc">${S.av?`<img src="${S.av}">`:''}<div><div class="h">@${esc(S.acc)}</div><div class="n">${esc(S.name)}</div></div></div>
   <div class="badge ${S.side}">${S.side==='bull'?'🟢':S.side==='bear'?'🔴':'⚪'} ${esc(S.badge)}</div>
   <div class="box"><div class="say">${esc(dedupeHandle(S.acc,S.text))}</div><div class="when">${esc(S.when)}</div></div>`;
 }else if(S.kind==='targets'){
  h=`<div class="sec"><h2>${esc(S.h)}</h2></div>`+S.rows.map(r=>`<div class="row">${r.av?`<img src="${r.av}">`:''}<div><div class="pt">$${esc(r.t)} 🎯 <span>$${esc(r.pt)}</span></div><div class="by">@${esc(r.acc)} · ${esc(r.day)}</div>${r.text?`<div class="rq">💬 ${esc(dedupeHandle(r.acc,r.text))}</div>`:''}</div></div>`).join('');
 }else if(S.kind==='views'){
  h=`<div class="sec"><h2>${esc(S.h)}</h2></div>`+S.rows.map(r=>`<div class="row">${r.av?`<img src="${r.av}">`:''}<div><div class="by"><span class="pill ${r.s==='bull'?'g':r.s==='bear'?'r':'n'}">${esc(r.badge)}</span>@${esc(r.acc)}</div><div class="v">${esc(dedupeHandle(r.acc,r.text))}</div></div></div>`).join('');
 }else if(S.kind==='quote'){
  h=`<div class="sec"><h2>${esc(S.h)}</h2></div><div style="flex:1"></div>${quote(S.quote)}<div style="flex:1"></div>${cta(S.cta)}`;
 }else if(S.kind==='igcta'){
  h=`<div class="kick">${esc(S.kicker)}</div>
   <div class="lead">${esc(S.lead)}</div>
   <div class="handle"><span>@thecrowdtape</span></div>
   <div class="sub">${esc(S.sub)}</div>
   ${S.save?`<div class="swipe">${esc(S.save)}</div>`:''}`;
 }
 if(S.talk)h=`<div class="talk">${esc(S.talk)}</div>`+h;
