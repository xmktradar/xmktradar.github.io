<style>
:root{
  --bg:#fbf6ec; --surface:#fffaf2; --ink:#3b2f24; --muted:#87776a; --line:#ece1cc;
  --accent:#a5672c; --accent-soft:#f8ecda;
  --f-display:"Noto Serif TC","Source Han Serif TC","Songti TC","PMingLiU",serif;
  --f-body:"Noto Sans TC","PingFang TC","Noto Sans CJK TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html{overflow-x:clip}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;overflow-wrap:anywhere}
.issues .dates{font-family:var(--f-data);font-variant-numeric:tabular-nums}
img{max-width:100%;height:auto}
a{color:var(--accent)}
.wrap{max-width:760px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;margin-bottom:22px;min-width:0}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;color:var(--ink);text-decoration:none}
.site-nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center;max-width:100%;min-width:0}
.site-nav a{box-sizing:border-box;max-width:100%;font-size:13px;font-weight:700;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--ink);text-decoration:none;background:var(--surface);line-height:1.3}
.site-nav a.nav-donate{background:var(--accent);color:#fff;border-color:var(--accent)}
.lang{display:flex;flex-wrap:wrap;gap:4px}
.lang a{font-size:13px;font-weight:600;padding:5px 10px;border:1px solid var(--line);border-radius:999px;color:var(--muted);text-decoration:none;background:var(--surface)}
.lang a[aria-current]{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
h1{font-family:var(--f-display);font-size:28px;line-height:1.3;margin:0 0 8px;overflow-wrap:anywhere}
h2{font-family:var(--f-display);font-size:22px;line-height:1.35;margin:22px 0 8px;overflow-wrap:anywhere}
.lead{margin:0 0 16px}
.issues{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.issues a{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 16px;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;color:var(--ink);text-decoration:none}
.issues a:hover{border-color:var(--accent)}
.issues .t{font-weight:700}
.issues .dates{color:var(--muted)}
.note{margin:16px 0 0;padding:14px 16px;border:1px solid var(--line);border-left:3px solid var(--accent);border-radius:0 12px 12px 0;background:var(--accent-soft)}
.note b{display:block;margin-bottom:4px}
.note p{margin:0;font-size:14px}
.back{display:inline-block;margin-top:18px;font-weight:700;text-decoration:none}
.aff-tag{display:inline-block;margin-left:6px;padding:1px 8px;border:1px solid var(--line);border-radius:999px;background:var(--bg);color:var(--muted);font-size:12px;font-weight:700;vertical-align:middle}
.money-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;box-sizing:border-box;max-width:100%;min-width:0;margin:0 0 14px;padding:8px 10px;border:1px dashed var(--line);border-radius:12px;background:var(--surface);font-size:13.5px;font-weight:700}
.site-foot{margin-top:22px;padding-top:14px;border-top:1px solid var(--line);color:var(--muted);font-size:13px;line-height:1.7}
.site-foot p{margin:0}
.site-foot a{font-weight:700}
.ct-news{position:relative;overflow-x:clip;box-sizing:border-box;width:100%;max-width:100%;margin:18px 0 0;padding:14px 16px;background:var(--surface);border:1px solid var(--line);border-radius:16px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.ct-news-t{flex:1 0 100%;margin:0;font-weight:700;font-size:15px;line-height:1.45;overflow-wrap:anywhere}
.ct-news input[type=email]{flex:1 1 140px;min-width:0;max-width:100%;box-sizing:border-box;margin:0;padding:8px 12px;border:1px solid var(--line);border-radius:999px;background:#fff;color:var(--ink);font:inherit;font-size:16px}
.ct-news button[type=submit]{flex:0 1 auto;max-width:100%;box-sizing:border-box;margin:0;padding:8px 16px;border:0;border-radius:999px;background:var(--accent);color:#fff;font:inherit;font-weight:700;font-size:14px;cursor:pointer}
.ct-news small{flex:1 0 100%;margin:0;color:var(--muted);font-size:12.5px;line-height:1.4}
.ct-news-msg{flex:1 0 100%;margin:0;font-size:14px;line-height:1.45;overflow-wrap:anywhere}
.ct-news input[name=website]{position:absolute!important;left:0!important;top:0!important;width:1px!important;height:1px!important;margin:-1px!important;padding:0!important;overflow:hidden!important;clip:rect(0,0,0,0)!important;border:0!important;white-space:nowrap}
@media(max-width:420px){h1{font-size:24px}.wrap{padding:16px 14px 40px}h2{font-size:20px}}
/* Apple-style look (2026-10-27): same colours, font and cards as the homepage; dark mode follows the device */
:root{--bg:#f5f5f7;--surface:#fff;--ink:#1d1d1f;--muted:#6e6e73;--line:#e3e3e8;--accent:#0071e3;--accent-soft:#e8f1fb;--link:#0066cc;--hero:#fff;--grad:linear-gradient(90deg,#0071e3,#9f5afd 52%,#e3366e);color-scheme:light dark}
@media (prefers-color-scheme: dark){:root{--bg:#000;--surface:#1c1c1e;--ink:#f5f5f7;--muted:#a1a1a6;--line:#38383a;--accent:#0a84ff;--accent-soft:#0a2540;--link:#2997ff;--hero:#000}}
body{background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",var(--f-body);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
a{color:var(--link)}
h1,h2,h3,.brand{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",var(--f-body)!important;letter-spacing:-.02em}
h1{font-weight:700;font-size:clamp(30px,5vw,44px)!important;line-height:1.12!important}
.brand{font-weight:600!important;font-size:19px!important}
.card,.ct-news,.panel{background:var(--surface)!important;border:0!important;border-radius:20px!important}
.note{border:0!important;border-radius:16px!important;background:var(--accent-soft)!important}
.site-nav a,.lang a{border:0!important;background:var(--surface)!important;font-weight:600!important}
.site-nav a.nav-donate,.tool-btn,.ct-news button[type=submit],.btn{background:var(--accent)!important;color:#fff!important;border:0!important}
.lang a[aria-current]{color:var(--ink)!important;background:var(--accent-soft)!important}
.aff-tag{background:transparent!important}
.ct-news input[type=email]{background:var(--bg)!important;color:var(--ink)!important;border-color:var(--line)!important}
.site-foot{border-top-color:var(--line)!important}
</style>
</head>
<body>
<div class="wrap">
<header>
  <a class="brand" href="/zh/">The Crowd Tape</a>
  <nav class="site-nav" aria-label="網站">
    <a href="/zh/tools/">工具</a>
    <a class="nav-donate" href="/zh/support/">支持我們</a>
  </nav>
  <nav class="lang" aria-label="語言">
    <a href="/zh/newsletter/" hreflang="zh-Hant" aria-current="page">中</a>
    <a href="/en/newsletter/" hreflang="en">EN</a>
  </nav>
</header>
<main>
  <h1>電子報</h1>
  <p class="lead">每週電子報的過往期數。</p>
  <form class="ct-news" id="ct-news-newsletter" data-lang="zh" action="https://crowdtape-newsletter.vercel.app/api/subscribe" method="POST">
    <label for="ct-email-newsletter" class="ct-news-t">每週好淡統計，直送你的電郵</label>
    <input id="ct-email-newsletter" type="email" name="email" required autocomplete="email" placeholder="you@example.com">
    <input type="hidden" name="lang" value="zh">
    <input type="text" name="website" tabindex="-1" autocomplete="off" style="position:absolute;left:-9999px" aria-hidden="true">
    <button type="submit">訂閱</button>
    <small>免費・每週一封・隨時取消</small>
    <p class="ct-news-msg" role="status" hidden></p>
  </form>
  <script>
  (function(){
    var M={en:["Thanks! You're subscribed.","Please check the email address and try again."],
           zh:["多謝！你已成功訂閱。","電郵地址有誤，請再試。"]};
    document.querySelectorAll('form.ct-news').forEach(function(f){
      f.addEventListener('submit',function(e){
        e.preventDefault();
        var l=f.dataset.lang||'en',m=f.querySelector('.ct-news-msg'),d=Object.fromEntries(new FormData(f));
        fetch(f.action,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)})
          .then(function(r){return r.json()}).then(function(j){
            m.hidden=false;m.textContent=M[l][j.ok?0:1];
            if(j.ok){f.reset();if(window.gtag)gtag('event','newsletter_signup',{lang:l});}
          }).catch(function(){m.hidden=false;m.textContent=M[l][1];});
      });
    });
    var sub=new URLSearchParams(location.search).get('subscribed');
    if(sub==='1'||sub==='0') document.querySelectorAll('form.ct-news').forEach(function(f){
      var l=f.dataset.lang||'en',m=f.querySelector('.ct-news-msg');
      m.hidden=false;m.textContent=M[l][sub==='1'?0:1];
    });
  })();
  </script>
  <h2>過往期數</h2>
  <ul class="issues"><li><a href="/newsletter/issue-1/"><span class="t">Weekly digest #1</span><span class="dates">Oct 12–18, 2026</span></a></li></ul>
  <aside class="note">
    <b>非投資建議</b>
    <p>不是。本站只整理第三方的公開貼文，供參考，不構成投資建議，也不是買賣任何股票的邀請。</p>
  </aside>
  <p><a class="back" href="/zh/">返回首頁</a></p>
</main>
<footer class="site-foot">
  <p><a href="/zh/tools/">工具</a> · <a href="/zh/support/">支持我們</a> · <a href="/zh/newsletter/">電子報</a> · <a href="https://www.tradingview.com/?aff_id=1172819" rel="sponsored noopener" target="_blank" data-tool="tradingview">TradingView <span class="aff-tag">推廣</span></a> · <a href="https://www.stockrover.com/thecrowdtape" rel="sponsored nofollow noopener" target="_blank" data-tool="stockrover">Stock Rover <span class="aff-tag">推廣</span></a></p>
</footer>
</div>
<script>
document.addEventListener("click",function(e){
  var a=e.target&&e.target.closest&&e.target.closest("a[href]");
  if(!a||!window.gtag)return;
  if(a.hasAttribute("data-method"))gtag("event","donate_click",{method:"paypal",lang:document.documentElement.lang});
  var u=a.href,h="";
  try{h=new URL(u).hostname.toLowerCase()}catch(err){return}
  if(a.getAttribute("data-tool")||h==="tradingview.com"||h.endsWith(".tradingview.com"))gtag("event","affiliate_click",{tool:(a.getAttribute("data-tool")||"tradingview").toLowerCase(),lang:document.documentElement.lang||""});
  if(h==="x.com"||h.endsWith(".x.com")||h==="twitter.com"||h.endsWith(".twitter.com"))gtag("event","x_outbound",{link_url:u,page:"newsletter",lang:document.documentElement.lang||"",transport_type:"beacon"});
});
</script>
</body>
